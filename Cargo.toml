[package]
name = "bouchaud-os"
version = "0.1.0"
edition = "2021"
authors = ["Arthur Bouchaud"]
description = "Bouchaud OS - noyau expérimental from scratch en Rust"
license = "MIT OR Apache-2.0"

[features]
default = ["legacy-boot"]
legacy-boot = ["dep:bootloader"]
uefi-boot = ["dep:bootloader_api"]
reference-bringup = []
reference-desktop = ["reference-bringup"]
# P19 experimental QEMU TCG profile, opt-in; the physical default is unchanged.
p19-tcg-low-latency = []
# BANC DE CHARGE D'ENTREE-SORTIE.
#
# Lit le volume USB en boucle, arme des pannes artificielles et ETEINT la
# machine a la fin. Rien de tout cela n'a sa place dans une image livree, et un
# reglage a l'execution laisserait la possibilite de l'armer par accident. Voir
# `platform/pc/banc_io.rs` et `tools/ci/run_trigkey_ladybird_io_stress.sh`.
banc-io = []
# BANC DE PANNE VIRTIO-GPU (BOUCHAUD_VIRTIO_GPU_DMA_ETAT_V1).
#
# Le `RESOURCE_ATTACH_BACKING` du scanout du bureau part VERS le peripherique
# (sonnette tiree), puis l'attente est declaree echue : exactement le cas ou
# le peripherique a pu retenir l'adresse sans qu'on le sache. La memoire doit
# etre conservee. Option de compilation, jamais dans `default` : voir
# `tools/ci/run_virtio_gpu_dma_panne.sh`.
banc-virtio-gpu-sans-reponse = []
# BANC DE COURSE C5 (P13_PAGE_REMPLIE_AVANT_PUBLICATION_V1).
#
# Elargit a 2 ms la fenetre de publication d'une page privee chargee a la
# demande : `banc-c5-ordre-historique` rejoue l'ordre d'avant le correctif (PTE
# presente sur une frame vierge, PUIS copie) ; `banc-c5-fenetre-corrigee`
# garde l'ordre corrige (copie, PUIS PTE) avec la meme attente. Reproduction
# negative et controle sous KVM. Jamais dans `default` : voir
# `tools/ci/run_faute_persistance.sh` et `.github/workflows/p13-cible-kvm.yml`.
banc-c5-ordre-historique = []
banc-c5-fenetre-corrigee = []
# BANC TEMOIN CONSOLE (P13_CONSOLE_DIFFEREE_CONTRE_PRESSION_V1).
#
# Retire la contre-pression des lignes differees : anneau du coeur plein, la
# ligne est perdue, comme avant le correctif. Reproduction negative du banc
# `BANC_RAFALE_MASQUEE` a image egale. Jamais dans `default`.
banc-console-sans-contre-pression = []
# BANC TEMOIN REVEIL (P13_REVEIL_COEUR_MUET_V1).
#
# Retablit la regle de placement au reveil d'avant le correctif (historique
# garde sauf privilege ou interactive face a un coeur hors ordonnanceur) et
# l'exclusion de tout fil noyau du vol. Reproduction negative de
# `tools/ci/run_reveil_coeur_muet.sh` a image egale. Jamais dans `default`.
banc-reveil-historique = []
# BANC DE PANNE VIRTIO-GPU (BOUCHAUD_VIRTIO_GPU_BARRIERE_V1).
#
# Le premier `TRANSFER_TO_HOST_2D` du bureau est juge contre une barriere qui
# n'est pas la sienne : exactement ce que verrait le pilote si le
# peripherique rendait la reponse d'une autre commande (achevement
# desordonne ou tardif). La file doit etre cassee, le scanout abandonne, sans
# panique. Jamais dans `default` : voir
# `tools/ci/run_virtio_gpu_reponse_etrangere.sh`.
banc-virtio-gpu-reponse-etrangere = []
# BANC DE PANNE VIRTIO-GPU (BOUCHAUD_VIRTIO_GPU_IRQ_V1, P10+.1).
#
# Sous attente par interruption : (1) l'entree MSI-X est masquee pendant
# dix attentes -- interruptions perdues, la relecture de secours doit
# trouver chaque reponse ; (2) des interruptions parasites sur le vecteur
# -- aucune ne doit achever une commande ; (3) une
# attente dont la reponse n'est jamais vue -- echeance, file cassee, scanout
# abandonne, bureau vivant. Jamais dans `default` : voir
# `tools/ci/run_virtio_gpu_irq_pannes.sh`.
banc-virtio-gpu-irq-pannes = []

[dependencies]
# Allocateur de tas pour activer `alloc` (Vec/String/BTreeMap).
linked_list_allocator = "0.10"

# Interpreteur WebAssembly no_std (alloc).
wasmi = { version = "0.31", default-features = false }

# Pile TCP/IP no_std + alloc.
smoltcp = { version = "0.12", default-features = false, features = ["alloc", "proto-ipv4", "medium-ethernet", "socket-tcp"] }

# Rasterizer TrueType/OpenType no_std + alloc.
fontdue = { version = "0.9", default-features = false, features = ["hashbrown"] }

# HashMap no_std.
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher"] }

[build-dependencies]
fontdue = { version = "0.9", default-features = false, features = ["hashbrown"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
# Dépendances du backend x86_64 uniquement. Elles ne doivent pas contaminer
# le futur graphe de compilation AArch64.
bootloader = { version = "0.9.31", features = ["map_physical_memory"], optional = true }
bootloader_api = { version = "=0.11.15", optional = true }
x86_64 = "0.14.2"
pic8259 = "0.10.1"

[profile.dev]
panic = "abort"
# La crypto TLS/bignum est beaucoup trop lente sans optimisation.
opt-level = 2

[profile.release]
panic = "abort"
