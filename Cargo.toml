[package]
name = "bouchaud-os"
version = "0.1.0"
edition = "2021"
authors = ["Arthur Bouchaud"]
description = "Bouchaud OS - noyau expérimental from scratch en Rust"
license = "MIT OR Apache-2.0"

[dependencies]
# Allocateur de tas pour activer `alloc` (Vec/String/BTreeMap).
linked_list_allocator = "0.10"

# Interpreteur WebAssembly no_std (alloc).
wasmi = { version = "0.31", default-features = false }

# Pile TCP/IP no_std + alloc.
smoltcp = { version = "0.12", default-features = false, features = ["alloc", "proto-ipv4", "medium-ethernet", "socket-tcp"] }

# Rasterizer TrueType/OpenType no_std + alloc.
fontdue = { version = "0.9", default-features = false, features = ["hashbrown"] }

# HashMap no_std.
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
# Dépendances du backend x86_64 uniquement. Elles ne doivent pas contaminer
# le futur graphe de compilation AArch64.
bootloader = { version = "0.9.31", features = ["map_physical_memory"] }
x86_64 = "0.14.2"
pic8259 = "0.10.1"

[profile.dev]
panic = "abort"
# La crypto TLS/bignum est beaucoup trop lente sans optimisation.
opt-level = 2

[profile.release]
panic = "abort"
