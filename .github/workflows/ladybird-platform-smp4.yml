name: ladybird-platform-smp4

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/ladybird-platform-smp4"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ladybird-platform-smp4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-smp4:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 python3-dev python3-venv perl \
            clang lld ccache cmake ninja-build git curl wget gnupg lsb-release \
            zip unzip tar xz-utils file autoconf autoconf-archive automake \
            libtool libltdl-dev gettext m4 nasm bison flex libssl-dev \
            libedit-dev linux-libc-dev mesa-common-dev ca-certificates \
            qemu-system-x86

          LLVM_VERSION=20
          if ! command -v "clang-${LLVM_VERSION}" >/dev/null 2>&1; then
            CODENAME="$(lsb_release -sc)"
            wget -qO /tmp/llvm-snapshot.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
            sudo gpg --dearmor --yes -o /usr/share/keyrings/llvm-snapshot.gpg.gpg /tmp/llvm-snapshot.gpg.key
            echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg.gpg] https://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-${LLVM_VERSION} main" \
              | sudo tee /etc/apt/sources.list.d/llvm-${LLVM_VERSION}.list
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              "clang-${LLVM_VERSION}" "lld-${LLVM_VERSION}" "llvm-${LLVM_VERSION}"
          fi

      - uses: actions/cache@v4
        with:
          path: |
            third_party/ladybird
            third_party/vcpkg-gfx
            third_party/vcpkg-downloads
            third_party/vcpkg-browser-manifest
            ~/.cache/vcpkg
            ~/.cache/ccache
          key: platform-smp4-${{ runner.os }}-${{ hashFiles('third_party/UPSTREAM.md', 'tools/ladybird/**') }}
          restore-keys: |
            platform-smp4-${{ runner.os }}-

      - name: Construire Ladybird complet
        run: tools/ladybird/native-browser-final.sh --cible

      - name: Verifier tous les services
        run: |
          set -eux
          OUT=third_party/native-browser-bouchaud
          for f in BouchaudBrowserHost WebContent RequestServer ImageDecoder Compositor WebWorker WebDriver; do
            test -f "$OUT/$f"
            file "$OUT/$f"
            ! readelf -l "$OUT/$f" | grep -q INTERP
          done

      - name: Construire noyau
        run: |
          cargo install bootimage --locked
          cargo bootimage

      - name: Demarrer fixture plateforme
        run: |
          python3 tools/health/ladybird_platform_fixture.py > platform-fixture.log 2>&1 &
          echo $! > platform-fixture.pid
          sleep 1
          kill -0 "$(cat platform-fixture.pid)"

      - name: Fabriquer image
        run: |
          set -eux
          OUT=third_party/native-browser-bouchaud
          SCENARIO=scenario-platform-smp4

          mkdir -p "$SCENARIO/usr/libexec/ladybird" "$SCENARIO/usr/share/ladybird" "$SCENARIO/etc/ssl/certs"

          for f in BouchaudBrowserHost WebContent RequestServer ImageDecoder Compositor WebWorker WebDriver; do
            cp "$OUT/$f" "$SCENARIO/usr/libexec/ladybird/$f"
            chmod 755 "$SCENARIO/usr/libexec/ladybird/$f"
          done

          cp -a "$OUT/resources/." "$SCENARIO/usr/share/ladybird/"
          cp /etc/ssl/certs/ca-certificates.crt "$SCENARIO/etc/ssl/certs/ca-certificates.crt"

          cat > "$SCENARIO/autorun" <<'EOF'
          uname
          df
          echo "=== Ladybird platform + SMP4 ==="
          export BOUCHAUD_BROWSER_HOST=1
          export BOUCHAUD_M9_URL='http://10.0.2.2:18083/platform.html'
          export BOUCHAUD_ALLOW_POPUPS=1
          export BOUCHAUD_TIME_ZONE='Europe/Paris'
          /usr/libexec/ladybird/BouchaudBrowserHost
          EOF

          (cd tools/userland && IMAGE="$GITHUB_WORKSPACE/ladybird-platform-smp4.img" ./mkdisk.sh "$GITHUB_WORKSPACE/$SCENARIO")
          stat -c 'platform disk: %s bytes' ladybird-platform-smp4.img
          test "$(stat -c '%s' ladybird-platform-smp4.img)" -le $((768 * 1024 * 1024))

      - name: QEMU 4 vCPU
        run: |
          set -u
          LOG=serie-platform-smp4.log
          : > "$LOG"
          DEADLINE=$((SECONDS + 360))

          qemu-system-x86_64 \
            -drive format=raw,file=target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin \
            -drive format=raw,file=ladybird-platform-smp4.img \
            -m 12288 -smp 4 -display none -no-reboot \
            -netdev user,id=net0 -device e1000,netdev=net0 \
            -audiodev none,id=muet -device AC97,audiodev=muet \
            -serial file:"$LOG" &
          PID=$!

          while kill -0 "$PID" 2>/dev/null; do
            if grep -aFq "PLATFORM_FULL_OK" "$LOG"; then
              break
            fi
            if (( SECONDS >= DEADLINE )); then
              break
            fi
            sleep 0.5
          done

          kill -TERM "$PID" 2>/dev/null || true
          sleep 1
          kill -KILL "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          cat "$LOG"

      - name: Verdict
        run: |
          set -e
          grep -aF "SMP4_DISCOVERED count=4" serie-platform-smp4.log
          grep -aF "SMP4_AP_STARTED count=3" serie-platform-smp4.log
          grep -aF "SMP4_SCHEDULER online=1 mode=UP-pending-refactor" serie-platform-smp4.log
          grep -aF "BROWSER_HOST_PLATFORM persistent=yes" serie-platform-smp4.log
          grep -aF "BROWSER_HOST_UPSTREAM clipboard=text downloads=FileDownloader" serie-platform-smp4.log
          grep -aF "PLATFORM_CANVAS OK" serie-platform-smp4.log
          grep -aF "PLATFORM_WORKER OK" serie-platform-smp4.log
          grep -aF "PLATFORM_WASM OK" serie-platform-smp4.log
          grep -aF "PLATFORM_INDEXEDDB OK" serie-platform-smp4.log
          grep -aF "PLATFORM_FULL_OK passed=8/8" serie-platform-smp4.log

      - name: Journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-platform-smp4-logs
          path: |
            serie-platform-smp4.log
            platform-fixture.log
          if-no-files-found: warn
