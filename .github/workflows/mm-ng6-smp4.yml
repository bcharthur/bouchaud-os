name: MM NG6 SMP4

on:
  pull_request:
    paths:
      - 'src/kernel/**'
      - 'src/fs/backing.rs'
      - 'src/drivers/ata.rs'
      - 'tools/userland/mmstress.c'
      - 'tools/userland/build-mmstress.sh'
      - '.github/workflows/mm-ng6-smp4.yml'
  workflow_dispatch:

jobs:
  mmstress-smp4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 musl-tools file
      - name: Build kernel and guest stressor
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo install bootimage --locked
          cargo bootimage
          CC=musl-gcc tools/userland/build-mmstress.sh
          file mmstress | grep -E 'static-pie linked|statically linked'
          if readelf -l mmstress | grep -q 'Requesting program interpreter'; then
            echo 'mmstress must use the static Bouchaud-compatible Linux ABI' >&2
            exit 1
          fi
          # Boot files below 4 MiB stay inline in RAMFS. Pad after ELF
          # validation so argv[0] is genuinely disk-backed and churn's
          # DONTNEED/refault loop exercises the clean physical page cache.
          truncate -s 5M mmstress
          sha256sum mmstress > mmstress.sha256
      - name: Build guest scenario disk
        run: |
          set -eu
          mkdir -p scenario/bin
          cp mmstress scenario/bin/mmstress
          cat > scenario/autorun <<'AUTORUN'
          echo MMSTRESS_BASIC_BEGIN && /bin/mmstress 4 512 4 && echo MMSTRESS_BASIC_OK && echo MMSTRESS_UNRELATED_BEGIN && /bin/mmstress unrelated && echo MMSTRESS_UNRELATED_OK && echo MMSTRESS_ABA_BEGIN && /bin/mmstress aba && echo MMSTRESS_ABA_OK && echo MMSTRESS_CHURN_BEGIN && /bin/mmstress churn && echo MMSTRESS_CHURN_OK_GUEST && echo MMSTRESS_NG6_ALL_DONE
          AUTORUN
          (cd tools/userland && IMAGE="$GITHUB_WORKSPACE/mm-ng6.img" \
            ./mkdisk.sh "$GITHUB_WORKSPACE/scenario")
      - name: Run Bouchaud OS with four CPUs
        run: |
          set +e
          timeout 300 qemu-system-x86_64 \
            -drive format=raw,file=target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin \
            -drive format=raw,file=mm-ng6.img \
            -m 2048 -smp 4 -accel tcg -cpu max -display none -no-reboot \
            -netdev user,id=net0 -device e1000,netdev=net0 \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            -serial file:mm-ng6.log
          code=$?
          cat mm-ng6.log || true
          if [ "$code" -eq 124 ]; then
            echo 'QEMU MM stress timed out' >&2
            exit 1
          fi
          if [ "$code" -ne 33 ]; then
            echo "unexpected QEMU guest exit code: $code (expected 33)" >&2
            exit 1
          fi
      - name: Verify guest completion and failures
        run: |
          set -eu
          grep -aF 'MMSTRESS_BASIC_BEGIN' mm-ng6.log
          grep -aF 'MMSTRESS_BASIC_OK' mm-ng6.log
          grep -aF 'MMSTRESS_UNRELATED_BEGIN' mm-ng6.log
          grep -aF 'MMSTRESS_UNRELATED_OK' mm-ng6.log
          grep -aF 'MMSTRESS_ABA_BEGIN' mm-ng6.log
          grep -aF 'MMSTRESS_ABA_OK' mm-ng6.log
          grep -aF 'MMSTRESS_CHURN_BEGIN' mm-ng6.log
          grep -aF 'MMSTRESS_CHURN_OK_GUEST' mm-ng6.log
          grep -aF 'MMSTRESS_NG6_ALL_DONE' mm-ng6.log
          grep -aF '=== AUTORUN FIN === statut=0' mm-ng6.log
          if grep -aqE '\*\*\* KERNEL PANIC \*\*\*|DOUBLE FAULT|FAULT_FATAL|faute de page utilisateur|assertion failed|panicked at' mm-ng6.log; then
            echo 'fatal kernel or user fault in MM stress log' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mm-ng6-smp4-log
          path: |
            mm-ng6.log
            mmstress.readelf.txt
            mmstress.sha256
