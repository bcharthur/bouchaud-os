name: MM NG6 SMP4 (debug)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mm-ng6-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mmstress-smp4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: QEMU + musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 musl-tools file
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: mm-debug-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            mm-debug-${{ runner.os }}-
            cargo-${{ runner.os }}-
      - name: Bootimage
        run: tools/ci/build_kernel.sh
      - name: MM NG6 SMP4
        run: tools/ci/run_mm_ng6.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mm-ng6-smp4-debug
          path: |
            mm-ng6.log
            mmstress.readelf.txt
            mmstress.sha256
          if-no-files-found: warn
