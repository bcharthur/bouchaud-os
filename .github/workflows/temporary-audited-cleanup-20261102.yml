name: One-shot audited branch and obsolete Actions cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-audited-cleanup-20261102.yml']
permissions:
  contents: write
  actions: write
jobs:
  one-time-prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify SHAs, archive divergent history, prune merged refs and disable obsolete workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error, subprocess
          repo=os.environ["GITHUB_REPOSITORY"]
          api="https://api.github.com/repos/"+repo
          token=os.environ["GH_TOKEN"]
          expected="b8436617a57443b6891ce90b3557f58303be3865"
          merged=json.loads("{\"chatgpt/c22-native-postgc-v20-20261101\":\"8adc5e46592bccae8a6208c88dbdda7011a86aa0\",\"chatgpt/c22-v22-pte-attribution-20261102\":\"ac3a3ece8b66946317f523cb357c3e7b3888fd47\",\"chatgpt/c22-v26-native-reclaim-20261102\":\"47d96f0c3f10ec21abb48a4571a1f471ac8d0157\",\"chatgpt/c22-v27-document-roots-20261102\":\"53ac86380e65c35d9d2d8e391474ad33780cdb42\",\"chatgpt/c22-v29-root-release-20261102\":\"5c3cd43a7a2a1c258388f9a81967abecdce51068\",\"claude/fix-c22-document-destroy-20261029\":\"357458fee5c186fe3564e4284e0f9ed1a27640c7\",\"diagnostic/c22-vma-owner-20261101-0700\":\"155ba2d715b4aeb792b60fdfe1d81da7375c5728\",\"feat/c22-brk-allocation-history-20261101\":\"ae33f5858b076d783d17b85a417f43152fe77121\",\"feat/c22-end-to-end-forensic-20261101\":\"6fef5d76df953a82914bf8306df86d7ac512824d\",\"feat/c22-post-callback-gc-20261031\":\"220797f44bea164331e23bb7caeffd6862c563ad\",\"feat/c22-vma-owner-probe-20261101\":\"78c5c803252747591b063e33b4d58fe1b94dbf69\",\"chatgpt/ci-essential-cleanup-20261102\":\"b8436617a57443b6891ce90b3557f58303be3865\"}")
          retired=set(json.loads("[\"c22-purge-ab.yml\",\"c22-purge-ab-reuse-20261030.yml\",\"c22-analyser-tests.yml\",\"c22-chatgpt-kvm-once.yml\",\"c22-memory-cible.yml\",\"c22-document-preflight.yml\",\"c22-gc-preflight.yml\",\"c22-gc-closure-build.yml\",\"c22-stop-on-red.yml\",\"c22-rss-forensic-fast.yml\",\"c22-runtime-purge-reuse.yml\",\"endurance-http-kvm-cible.yml\",\"fixture-http-cible.yml\",\"ladybird-browser-host.yml\",\"ladybird-native-browser-v16.yml\",\"ladybird-platform-smp4.yml\",\"mm-ng6-smp4.yml\",\"nightly-candidate-smoke.yml\",\"p13-console-sync-proof.yml\",\"scm-receive.yml\",\"system-health.yml\"]"))
          keep={"main","chatgpt/active","fix/nightly-ladybird-artifact-20261101","fix/proc-processus-snapshot-kvm-20261101","backup/main-before-c22-v29-20261102","backup/main-before-branch-prune-20261102"}
          def call(path,method="GET",body=None,missing=False):
              data=json.dumps(body).encode() if body is not None else None
              req=urllib.request.Request(api+path,data=data,headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"bouchaud-cleanup-oneshot","Content-Type":"application/json"},method=method)
              try:
                  with urllib.request.urlopen(req,timeout=25) as resp:
                      raw=resp.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  txt=e.read().decode(errors="replace")
                  if missing and e.code==404: return None
                  raise RuntimeError(method+" "+path+" "+str(e.code)+" "+txt[:350])
          assert os.environ["GITHUB_REF"]=="refs/heads/main", "not main"
          sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          prev=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          assert prev==expected, ("unexpected main parent",prev)
          assert call("/git/ref/heads/backup/main-before-branch-prune-20261102")["object"]["sha"]==expected
          assert call("/branches/main")["commit"]["sha"]==sha
          prs=call("/pulls?state=open&per_page=100")
          active={x["head"]["ref"] for x in prs}
          print("CLEANUP_PREFLIGHT main="+sha+" branches="+str(len(merged))+" open_prs="+str(len(active)),flush=True)
          assert not any(n in active for n in merged)
          assert "feat/c22-v9-ci-forensic-20261031" not in active
          for name,want in merged.items():
              assert name not in keep
              ref=call("/git/ref/heads/"+name,missing=True)
              if ref is None:
                  print("ALREADY_ABSENT",name,flush=True)
                  continue
              got=ref["object"]["sha"]
              assert got==want, (name,got,want)
              comparison=call("/compare/"+got+"..."+sha)
              assert comparison["status"] in ("ahead","identical"),(name,comparison["status"])
              call("/git/refs/heads/"+name,"DELETE")
              assert call("/git/ref/heads/"+name,missing=True) is None
              print("BRANCH_DELETED",name,flush=True)
          name="feat/c22-v9-ci-forensic-20261031"
          want="9b4d43b1dfe76416923c1146f1cbbdfbe0561e70"
          ref=call("/git/ref/heads/"+name,missing=True)
          if ref is not None:
              assert ref["object"]["sha"]==want
              archive="refs/tags/archive/c22-v9-ci-forensic-20261102"
              previous=call("/git/ref/tags/archive/c22-v9-ci-forensic-20261102",missing=True)
              if previous is None:
                  call("/git/refs","POST",{"ref":archive,"sha":want})
              else:
                  assert previous["object"]["sha"]==want
              assert call("/git/ref/tags/archive/c22-v9-ci-forensic-20261102")["object"]["sha"]==want
              call("/git/refs/heads/"+name,"DELETE")
              print("DIVERGENT_ARCHIVED_AND_DELETED",name,archive,flush=True)
          workflows=call("/actions/workflows?per_page=100").get("workflows",[])
          found=set()
          for wf in workflows:
              basename=wf["path"].rsplit("/",1)[-1]
              if basename not in retired: continue
              found.add(basename)
              if wf["state"]!="active":
                  print("WORKFLOW_ALREADY_INACTIVE",basename,wf["state"],flush=True)
                  continue
              call("/actions/workflows/"+str(wf["id"])+"/disable","PUT")
              print("WORKFLOW_DISABLED",basename,flush=True)
          print("CLEANUP_FINISHED all_branches_checked="+str(len(merged)+1)+" obsolete_workflows_seen="+str(len(found)),flush=True)
          
          PY
