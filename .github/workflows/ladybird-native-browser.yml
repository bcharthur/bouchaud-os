name: ladybird-native-browser

# Producteur CANONIQUE de l'artefact consomme par run.ps1.
# Un commit de branche avec PR ne declenche que pull_request, jamais un doublon push.
on:
  pull_request:
    paths:
      - 'tools/ladybird/**'
      - 'third_party/UPSTREAM.md'
      - '.github/workflows/ladybird-native-browser.yml'
      - 'tools/ci/run_ladybird_browser_host.sh'
      # La page que le smoke charge. Elle porte ses quatre sous-tests et leurs
      # gardes-fous : la modifier change ce que le job mesure, et ne pas la
      # declencher laissait cette modification invisible jusqu'au prochain
      # commit qui touchait, lui, un chemin declencheur.
      - 'tools/health/browser_host_fixture.py'
      # LE DEMARRAGE DU NAVIGATEUR EST D'ABORD DU NOYAU.
      #
      # `fork`, `execve`, le chargeur ELF, les fautes de page, le VMM et
      # l'ordonnanceur sont exactement ce que traverse chaque service de
      # Ladybird avant d'exister. Une modification purement noyau pouvait
      # donc casser -- ou reparer -- le demarrage sans que ce smoke tourne.
      - 'src/kernel/process/**'
      - 'src/kernel/memory/**'
      - 'src/kernel/scheduler/**'
      - 'src/compat/linux/**'
      - 'src/kernel/navigateur/**'
      - 'src/gui/services.rs'
  push:
    branches: [main]
    paths:
      - 'tools/ladybird/**'
      - 'third_party/UPSTREAM.md'
      - '.github/workflows/ladybird-native-browser.yml'
      - 'tools/ci/run_ladybird_browser_host.sh'
      # La page que le smoke charge. Elle porte ses quatre sous-tests et leurs
      # gardes-fous : la modifier change ce que le job mesure, et ne pas la
      # declencher laissait cette modification invisible jusqu'au prochain
      # commit qui touchait, lui, un chemin declencheur.
      - 'tools/health/browser_host_fixture.py'
      # LE DEMARRAGE DU NAVIGATEUR EST D'ABORD DU NOYAU.
      #
      # `fork`, `execve`, le chargeur ELF, les fautes de page, le VMM et
      # l'ordonnanceur sont exactement ce que traverse chaque service de
      # Ladybird avant d'exister. Une modification purement noyau pouvait
      # donc casser -- ou reparer -- le demarrage sans que ce smoke tourne.
      - 'src/kernel/process/**'
      - 'src/kernel/memory/**'
      - 'src/kernel/scheduler/**'
      - 'src/compat/linux/**'
      - 'src/kernel/navigateur/**'
      - 'src/gui/services.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ladybird-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ladybird / build once
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain C/C++
        id: toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 python3-dev python3-venv perl \
            clang lld ccache cmake ninja-build rsync git curl wget gnupg lsb-release zip unzip tar xz-utils file \
            autoconf autoconf-archive automake libtool libltdl-dev gettext m4 \
            nasm bison flex libssl-dev libedit-dev linux-libc-dev mesa-common-dev ca-certificates
          LLVM_VERSION=20
          if ! command -v "clang-${LLVM_VERSION}" >/dev/null 2>&1; then
            CODENAME="$(lsb_release -sc)"
            wget -qO /tmp/llvm-snapshot.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
            sudo gpg --dearmor --yes -o /usr/share/keyrings/llvm-snapshot.gpg.gpg /tmp/llvm-snapshot.gpg.key
            echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg.gpg] https://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-${LLVM_VERSION} main" \
              | sudo tee /etc/apt/sources.list.d/llvm-${LLVM_VERSION}.list
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "clang-${LLVM_VERSION}" "lld-${LLVM_VERSION}" "llvm-${LLVM_VERSION}"
          fi
          clang-20 --version
          ld.lld-20 --version
          ccache --version
          identity=$({ clang-20 --version; gcc --version; cmake --version; ld.lld-20 --version; ldd --version; } | sha256sum | cut -d' ' -f1)
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Verifier la reutilisation des sources
        run: python3 tools/ladybird/test-incremental-source.py

      - name: Cache Cargo Ladybird
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ladybird-cargo-${{ runner.os }}-${{ hashFiles('third_party/UPSTREAM.md', 'tools/ladybird/native-browser-final.sh') }}
          restore-keys: ladybird-cargo-${{ runner.os }}-

      - name: Cache source Ladybird
        id: source
        uses: actions/cache/restore@v4
        with:
          path: third_party/ladybird
          key: ladybird-source-${{ runner.os }}-${{ hashFiles('third_party/UPSTREAM.md', 'tools/ladybird/patches/**') }}

      - name: Cache vcpkg navigateur
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/vcpkg-gfx
            third_party/vcpkg-downloads
            third_party/vcpkg-browser-manifest
            third_party/vcpkg-browser-installed
            ~/.cache/vcpkg
          key: ladybird-vcpkg-v4-${{ runner.os }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('tools/ladybird/browser-vcpkg.sh', 'tools/ladybird/triplets/**', 'third_party/UPSTREAM.md', 'tools/ladybird/patches/**') }}
          restore-keys: |
            ladybird-vcpkg-v4-${{ runner.os }}-${{ steps.toolchain.outputs.identity }}-
            ladybird-vcpkg-v3-${{ runner.os }}-

      - name: Dependances navigateur
        run: tools/ladybird/browser-vcpkg.sh

      # Checkpoint expensive dependencies BEFORE compiling the browser.
      - name: Sauvegarder les dependances pretes
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/vcpkg-gfx
            third_party/vcpkg-downloads
            third_party/vcpkg-browser-manifest
            third_party/vcpkg-browser-installed
            ~/.cache/vcpkg
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Sauvegarder la source
        if: steps.source.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/ladybird
          key: ${{ steps.source.outputs.cache-primary-key }}

      # ccache est le cache incremental principal. Contrairement au build tree
      # complet, il reste compact et reutilisable quand quelques TU changent.
      - name: Cache ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ladybird-ccache-v2-${{ runner.os }}-${{ hashFiles('third_party/UPSTREAM.md') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ladybird-ccache-v2-${{ runner.os }}-${{ hashFiles('third_party/UPSTREAM.md') }}-
            ladybird-ccache-v2-${{ runner.os }}-

      # Both paths must travel together: Ninja records source timestamps.
      # Changes are reapplied to a fresh tree and checksum-synced before CMake.
      - name: Restaurer le build incremental Ninja
        id: ninja
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/ladybird-browser-src
            third_party/build-ladybird-browser-bouchaud
          key: ladybird-ninja-v1-${{ runner.os }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('third_party/UPSTREAM.md', 'tools/ladybird/browser-upstream.sh', 'tools/ladybird/browser-vcpkg.sh', 'tools/ladybird/triplets/**') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ladybird-ninja-v1-${{ runner.os }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('third_party/UPSTREAM.md', 'tools/ladybird/browser-upstream.sh', 'tools/ladybird/browser-vcpkg.sh', 'tools/ladybird/triplets/**') }}-

      - name: Statistiques ccache avant
        run: ccache -s || true

      # Le journal de ninja fait cinq mille lignes, et une erreur de
      # compilation tombe AU MILIEU : les cibles encore en vol continuent de
      # s'afficher apres elle, sur des centaines de lignes. Une interface qui
      # ne rend que la fin du journal -- l'API des journaux de job en est une --
      # ne montre donc jamais le diagnostic, seulement
      # « ninja: build stopped: cannot make progress ».
      #
      # C'est arrive : une construction rouge dont l'erreur etait litteralement
      # illisible. Le journal est donc conserve, et les diagnostics recopies A
      # LA FIN, la ou on les lira.
      - name: Construire Ladybird
        run: |
          set -o pipefail
          tools/ladybird/native-browser-final.sh --cible 2>&1 \
            | tee /tmp/ladybird-build.log

      - name: Diagnostics de compilation
        if: failure()
        run: |
          set +e
          echo "=== blocs FAILED, recopies depuis le milieu du journal ==="
          grep -n -A 40 '^FAILED:' /tmp/ladybird-build.log | head -250
          echo
          echo "=== toutes les lignes d'erreur ==="
          grep -n -E 'error:|Error [0-9]+' /tmp/ladybird-build.log | head -80
          exit 0

      - name: Marquer la capacite UI V16
        run: |
          printf 'Bouchaud V16 chrome=fontconfig+svg loading=1\n' > third_party/native-browser-bouchaud/V16_UI_CAPABLE

      # BOUCHAUD_ARTEFACT_PERIME_V2
      #
      # Un marqueur PAR generation, et non un marqueur unique qu'on reecrit.
      # `V16_UI_CAPABLE` dit « ce chrome a des icones SVG et du texte Skia » ;
      # il continue de le dire, et un artefact d'aujourd'hui le porte encore.
      # Ce qu'il ne peut pas dire, c'est « ce chrome a des onglets » -- et un
      # artefact d'avant ce lot passerait le controle de completude avec ses
      # seuls anciens marqueurs, resterait en place, et l'utilisateur
      # chercherait le defaut dans le code des onglets, qui est ecrit.
      #
      # C'est exactement le defaut que V16 avait deja coute une fois.
      - name: Marquer la capacite UI V19
        run: |
          printf 'Bouchaud V19 onglets=1 recherche=1 presse-papiers=1 menu=1 telechargements=1 favoris=1\n' > third_party/native-browser-bouchaud/V19_UI_CAPABLE

      - name: Statistiques ccache apres
        if: always()
        run: ccache -s || true

      - name: Verifier les artefacts runtime
        run: |
          set -eux
          OUT=third_party/native-browser-bouchaud
          for f in BouchaudBrowserHost WebContent RequestServer ImageDecoder Compositor WebWorker WebDriver; do
            test -f "$OUT/$f"
            file "$OUT/$f"
            ! readelf -l "$OUT/$f" | grep -q INTERP
          done
          test -x "$OUT/webcontent-bootstrap"
          test -f "$OUT/M9_CAPABLE"
          test -d "$OUT/resources"
          # V16 n'est plus un workflow: c'est une capacite de l'artefact canonique.
          if [ -f "$OUT/V16_UI_CAPABLE" ]; then cat "$OUT/V16_UI_CAPABLE"; fi
          if [ -f "$OUT/V19_UI_CAPABLE" ]; then cat "$OUT/V19_UI_CAPABLE"; fi
          du -sh "$OUT"

      # BOUCHAUD_C65_STATIC_PIE_OU_ET_EXEC
      #
      # Une seconde edition de liens de WebWorker, en statique NON-PIE, a cote
      # du binaire normal. Les objets ne changent pas : c'est un relink.
      #
      # Les deux binaires partent dans le MEME artefact parce que la variance
      # entre coureurs atteint un facteur deux sur le meme SHA (65,9 s contre
      # 129,1 s) : comparer deux runs ne prouverait rien.
      #
      # `continue-on-error` est volontaire et borne : si la variante ne se lie
      # pas, le build de reference reste publie et la CI garde son sens. Le
      # travail de mesure, lui, echoue s'il ne trouve pas le binaire.
      - name: Variante ET_EXEC de WebWorker
        continue-on-error: true
        run: tools/ladybird/build-variante-etexec.sh third_party/native-browser-bouchaud

      - name: Publier Ladybird natif
        uses: actions/upload-artifact@v4
        with:
          name: bouchaud-ladybird-native-browser
          path: third_party/native-browser-bouchaud/
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Sauvegarder le build incremental
        if: ${{ !cancelled() && steps.ninja.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/ladybird-browser-src
            third_party/build-ladybird-browser-bouchaud
          key: ${{ steps.ninja.outputs.cache-primary-key }}

      # Successful objects are reusable even when another translation unit fails.
      - name: Sauvegarder ccache meme apres erreur
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}


  browser-host-smoke:
    name: ladybird / browser-host smoke
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: QEMU + outils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 file socat
      - name: Cache Cargo noyau
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ladybird-smoke-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            ladybird-smoke-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-
      - name: Bootimage
        run: tools/ci/build_kernel.sh
      - uses: actions/download-artifact@v4
        with:
          name: bouchaud-ladybird-native-browser
          path: native-browser
      - name: Smoke BrowserHost sur Bouchaud OS
        run: tools/ci/run_ladybird_browser_host.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin native-browser
      - name: Journaux
        if: always()
        uses: actions/upload-artifact@v4
        # `surface-browser-host.ppm` est la capture du moniteur QEMU. Le
        # verdict de mire dit « absente » sans jamais montrer ce qui a ete
        # capture ; sans le fichier, on ne peut ni verifier le verdict ni voir
        # CE QUI s'est affiche a la place.
        #
        # Dans un bloc `|`, une ligne commencant par `#` n'est pas un
        # commentaire mais un motif de chemin : ce commentaire-ci est donc
        # dehors, a sa place.
        with:
          name: ladybird-browser-host-smoke-logs
          path: |
            serie-browser-host.log
            fixture-browser-host.log
            surface-browser-host.ppm
          if-no-files-found: warn

  # ==========================================================================
  # BOUCHAUD_C44_DEUX_STATUTS_REELS
  # ==========================================================================
  #
  # `BOUCHAUD_C32_DEUX_VERDICTS` avait separe les deux verdicts dans la SORTIE
  # du banc, mais un seul travail les portait -- et il ne bloquait que sur le
  # fonctionnel. `BO_SMOKE_PERF_BLOQUANT` n'etait defini par aucun workflow :
  # une regression de performance laissait la CI verte.
  #
  # Deux travaux, donc deux statuts que GitHub affiche et bloque separement.
  # UN SEUL demarrage QEMU : ce travail ne relance rien, il relit le journal
  # que le precedent a publie.
  #
  # `needs: browser-host-smoke` sans `if: always()` est VOULU : si le navigateur ne
  # fonctionne pas, ses chiffres de performance ne veulent rien dire, et un
  # rouge de performance par-dessus un rouge fonctionnel n'informe personne.
  performance:
    name: ladybird / performance
    needs: browser-host-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ladybird-browser-host-smoke-logs
          path: .
      - name: Budgets de performance
        run: tools/ci/verifie_ladybird_perf.sh serie-browser-host.log

  # ==========================================================================
  # BOUCHAUD_C65_STATIC_PIE_OU_ET_EXEC
  # ==========================================================================
  #
  # Deux demarrages froids, MEME machine, MEME run, seul le WebWorker change :
  # static-PIE contre static ET_EXEC. Un `-static-pie` glibc applique ~405 000
  # relocations dans `_dl_relocate_static_pie` avant `main` ; un `ET_EXEC` n'en
  # applique aucune. La variante supprime la phase au lieu de la regler, ce qui
  # en fait une falsification.
  #
  # Le meme run pour les deux bras parce que la variance entre coureurs atteint
  # un facteur deux sur le MEME SHA : un avant/apres entre deux runs ne
  # prouverait rien.
  #
  # Diagnostic : il ne remplace ni le fonctionnel ni la performance.
  variante-elf:
    name: ladybird / variante ELF (diagnostic)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: QEMU + outils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 file socat binutils
      - name: Bootimage
        run: tools/ci/build_kernel.sh
      - uses: actions/download-artifact@v4
        with:
          name: bouchaud-ladybird-native-browser
          path: native-browser
      - name: Deux demarrages froids, deux formes d'ELF
        run: tools/ci/run_variante_elf.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin native-browser
      - name: Journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-variante-elf-logs
          path: |
            serie-browser-host-elf-pie.log
            serie-browser-host-elf-etexec.log
            elf-pie.sortie
            elf-etexec.sortie
          if-no-files-found: warn

  # ==========================================================================
  # BOUCHAUD_C57_LA_PREMIERE_POSITION_OU_L_ORIGINE
  # ==========================================================================
  #
  # Deux demarrages QEMU FROIDS sur le meme binaire, seul l'ordre des origines
  # change. Il repond a une question que le smoke de reference ne peut pas
  # poser, parce qu'il n'a qu'un ordre.
  #
  # Ce travail est un DIAGNOSTIC : il ne remplace ni le fonctionnel ni la
  # performance, et n'en modifie aucun. Son echec ne masque rien -- les deux
  # statuts existants restent ce qu'ils sont.
  ordre-worker:
    name: ladybird / ordre worker (diagnostic)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: QEMU + outils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 file socat
      - name: Bootimage
        run: tools/ci/build_kernel.sh
      - uses: actions/download-artifact@v4
        with:
          name: bouchaud-ladybird-native-browser
          path: native-browser
      - name: Deux demarrages froids, ordres inverses
        run: tools/ci/run_worker_ordre.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin native-browser
      - name: Journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-ordre-worker-logs
          path: |
            serie-browser-host-ordre-blob.log
            serie-browser-host-ordre-http.log
            ordre-blob.sortie
            ordre-http.sortie
          if-no-files-found: warn
