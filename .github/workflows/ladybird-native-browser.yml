      - name: Deux demarrages froids, ordres inverses
        run: tools/ci/run_worker_ordre.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin native-browser
      - name: Journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
