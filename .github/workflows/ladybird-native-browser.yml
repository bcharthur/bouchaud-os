name: ladybird-native-browser

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "tools/ladybird/**"
      - "src/gui/**"
      - "src/fs/**"
      - "src/drivers/block.rs"
      - "src/kernel/elf.rs"
      - "src/kernel/exec.rs"
      # `src/shell` compose l'environnement que `exec.rs` transmet au
      # navigateur : c'est de la que vient `BOUCHAUD_M9_URL`. Le scenario
      # Ladybird depend donc de ce repertoire autant que des precedents.
      - "src/shell/**"
      - "src/kernel/abi/file.rs"
      - "src/kernel/abi/mem.rs"
      - "src/kernel/abi/proc.rs"
      - "src/kernel/partage.rs"
      - "src/kernel/task.rs"
      - "src/kernel/resource.rs"
      - "src/kernel/scheduler.rs"
      - "src/kernel/vmm.rs"
      - "src/kernel/memory.rs"
      - "src/drivers/gpu.rs"
      - "src/drivers/gfx.rs"
      # La pile reseau manquait entierement, alors que M9 (HTTP), M12 (HTTPS)
      # et l'essai Internet en dependent de bout en bout : une correction dans
      # `poll_ip`, dans l'ABI socket ou dans le pilote de carte ne declenchait
      # aucun des scenarios qu'elle pouvait casser.
      - "src/net/**"
      - "src/kernel/abi/net.rs"
      - "src/drivers/e1000.rs"
      - "src/arch/x86_64/cpu.rs"
      - "src/arch/x86_64/idt.rs"
      - ".github/workflows/ladybird-native-browser.yml"
  pull_request:
    paths:
      - "tools/ladybird/**"
      - "src/gui/**"
      - "src/fs/**"
      - "src/drivers/block.rs"
      - "src/kernel/elf.rs"
      - "src/kernel/exec.rs"
      # `src/shell` compose l'environnement que `exec.rs` transmet au
      # navigateur : c'est de la que vient `BOUCHAUD_M9_URL`. Le scenario
      # Ladybird depend donc de ce repertoire autant que des precedents.
      - "src/shell/**"
      - "src/kernel/abi/file.rs"
      - "src/kernel/abi/mem.rs"
      - "src/kernel/abi/proc.rs"
      - "src/kernel/partage.rs"
      - "src/kernel/task.rs"
      - "src/kernel/resource.rs"
      - "src/kernel/scheduler.rs"
      - "src/kernel/vmm.rs"
      - "src/kernel/memory.rs"
      - "src/drivers/gpu.rs"
      - "src/drivers/gfx.rs"
      # La pile reseau manquait entierement, alors que M9 (HTTP), M12 (HTTPS)
      # et l'essai Internet en dependent de bout en bout : une correction dans
      # `poll_ip`, dans l'ABI socket ou dans le pilote de carte ne declenchait
      # aucun des scenarios qu'elle pouvait casser.
      - "src/net/**"
      - "src/kernel/abi/net.rs"
      - "src/drivers/e1000.rs"
      - "src/arch/x86_64/cpu.rs"
      - "src/arch/x86_64/idt.rs"
      - ".github/workflows/ladybird-native-browser.yml"

concurrency:
  group: ladybird-native-browser-${{ github.ref }}
  cancel-in-progress: true


# Jeton au minimum de ses droits.
#
# Sans bloc `permissions`, le `GITHUB_TOKEN` d'un travail herite du reglage du
# depot — historiquement l'ecriture sur tout. Un workflow qui ne fait que lire
# le code, construire et televerser des artefacts n'a besoin que de le lire :
# une etape compromise (une action tierce, une dependance) ne peut alors pas
# ecrire dans le depot. `actions/upload-artifact` n'utilise pas ce jeton.
permissions:
  contents: read

jobs:
  build:
    name: WebContent-static-Bouchaud
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Outils de construction
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 python3-dev python3-venv perl \
            clang lld ccache cmake ninja-build git curl wget gnupg lsb-release zip unzip tar xz-utils file \
            autoconf autoconf-archive automake libtool libltdl-dev gettext m4 \
            nasm bison flex \
            libssl-dev libedit-dev linux-libc-dev mesa-common-dev ca-certificates

          test -f /usr/include/ltdl.h
          dpkg-query -W -f='${Status}\n' libltdl-dev | grep -q 'install ok installed'
          dpkg-query -W -f='${Status}\n' linux-libc-dev | grep -q 'install ok installed'
          dpkg-query -W -f='${Status}\n' mesa-common-dev | grep -q 'install ok installed'
          command -v ccache

          LLVM_VERSION=20
          if ! command -v "clang-${LLVM_VERSION}" >/dev/null 2>&1; then
            CODENAME="$(lsb_release -sc)"
            wget -qO /tmp/llvm-snapshot.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
            sudo gpg --dearmor --yes -o /usr/share/keyrings/llvm-snapshot.gpg.gpg /tmp/llvm-snapshot.gpg.key
            echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg.gpg] https://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-${LLVM_VERSION} main" \
              | sudo tee /etc/apt/sources.list.d/llvm-${LLVM_VERSION}.list
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              "clang-${LLVM_VERSION}" "lld-${LLVM_VERSION}" "llvm-${LLVM_VERSION}"
          fi

          clang-20 --version
          clang++-20 --version
          ld.lld-20 --version
          llvm-ar-20 --version
          llvm-ranlib-20 --version
          ccache --version

      - name: Cache cargo Ladybird
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ladybird-browser-cargo-${{ runner.os }}-${{ hashFiles('third_party/UPSTREAM.md', 'tools/ladybird/native-browser-final.sh') }}
          restore-keys: |
            ladybird-browser-cargo-${{ runner.os }}-

      - name: Cache arbre Ladybird
        uses: actions/cache@v4
        with:
          path: third_party/ladybird
          key: ladybird-source-${{ runner.os }}-${{ hashFiles('third_party/UPSTREAM.md', 'tools/ladybird/patches/**') }}

      - name: Restaurer caches vcpkg navigateur
        id: cache-browser-vcpkg
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/vcpkg-gfx
            third_party/vcpkg-downloads
            third_party/vcpkg-browser-manifest
            ~/.cache/vcpkg
          key: ladybird-browser-vcpkg-v2-${{ runner.os }}-${{ hashFiles('tools/ladybird/browser-vcpkg.sh', 'third_party/UPSTREAM.md') }}
          restore-keys: |
            ladybird-browser-vcpkg-v2-${{ runner.os }}-
            ladybird-browser-vcpkg-${{ runner.os }}-
            ladybird-gfx-vcpkg-${{ runner.os }}-

      - name: Construire les dependances navigateur
        run: tools/ladybird/browser-vcpkg.sh

      - name: Sauvegarder progression vcpkg apres echec
        if: failure()
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/vcpkg-gfx
            third_party/vcpkg-downloads
            third_party/vcpkg-browser-manifest
            ~/.cache/vcpkg
          key: ladybird-browser-vcpkg-v2-${{ runner.os }}-${{ hashFiles('tools/ladybird/browser-vcpkg.sh', 'third_party/UPSTREAM.md') }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publier cache vcpkg complet
        if: success() && steps.cache-browser-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/vcpkg-gfx
            third_party/vcpkg-downloads
            third_party/vcpkg-browser-manifest
            ~/.cache/vcpkg
          key: ladybird-browser-vcpkg-v2-${{ runner.os }}-${{ hashFiles('tools/ladybird/browser-vcpkg.sh', 'third_party/UPSTREAM.md') }}

      - name: Restaurer build WebContent partiel
        id: restore-browser-build
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/build-ladybird-browser-bouchaud
            third_party/native-browser-bouchaud
          key: ladybird-browser-build-v3-${{ runner.os }}-${{ hashFiles('third_party/UPSTREAM.md') }}-${{ github.sha }}
          restore-keys: |
            ladybird-browser-build-v3-${{ runner.os }}-${{ hashFiles('third_party/UPSTREAM.md') }}-

      - name: Restaurer ccache Ladybird
        id: restore-browser-ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ladybird-browser-ccache-v1-${{ runner.os }}-${{ hashFiles('third_party/UPSTREAM.md') }}-${{ github.sha }}
          restore-keys: |
            ladybird-browser-ccache-v1-${{ runner.os }}-${{ hashFiles('third_party/UPSTREAM.md') }}-
            ladybird-browser-ccache-v1-${{ runner.os }}-

      - name: Construire le navigateur Ladybird natif
        run: tools/ladybird/native-browser-final.sh --cible

      - name: Sauvegarder build WebContent meme apres echec
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/build-ladybird-browser-bouchaud
            third_party/native-browser-bouchaud
          key: ladybird-browser-build-v3-${{ runner.os }}-${{ hashFiles('third_party/UPSTREAM.md') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Sauvegarder ccache Ladybird meme apres echec
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ladybird-browser-ccache-v1-${{ runner.os }}-${{ hashFiles('third_party/UPSTREAM.md') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verifier les artefacts
        run: |
          test -x third_party/native-browser-bouchaud/WebContent
          test -x third_party/native-browser-bouchaud/RequestServer
          test -x third_party/native-browser-bouchaud/webcontent-bootstrap
          test -f third_party/native-browser-bouchaud/M9_CAPABLE
          file third_party/native-browser-bouchaud/WebContent
          ! file third_party/native-browser-bouchaud/WebContent | grep -qi 'dynamically linked'
          ls -lh third_party/native-browser-bouchaud/

      - name: Publier Ladybird natif
        uses: actions/upload-artifact@v4
        with:
          name: bouchaud-ladybird-native-browser
          path: third_party/native-browser-bouchaud/
          if-no-files-found: error
          retention-days: 14

  qemu:
    name: M8-HTML-local-fenetre-Bouchaud
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Installer QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Cache cargo noyau
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Construire le noyau
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo install bootimage --locked
          cargo bootimage

      - uses: actions/download-artifact@v4
        with:
          name: bouchaud-ladybird-native-browser
          path: native-browser

      - name: Fabriquer le disque Ladybird M8
        run: |
          set -e
          # Gardes synchronisees avec src/fs/tar.rs. Une croissance future du
          # runtime doit echouer ici avec sa taille reelle, pas devenir un
          # mysterieux "fichier introuvable" apres une troncature noyau.
          MAX_BOOT_FILE=$((512 * 1024 * 1024))
          MAX_DATA_DISK=$((768 * 1024 * 1024))
          WEB_SIZE=$(stat -c '%s' native-browser/WebContent)
          echo "WebContent: $WEB_SIZE octets"
          test "$WEB_SIZE" -le "$MAX_BOOT_FILE"

          mkdir -p scenario/usr/libexec/ladybird scenario/usr/share/ladybird
          cp native-browser/WebContent scenario/usr/libexec/ladybird/WebContent
          cp native-browser/webcontent-bootstrap scenario/usr/libexec/ladybird/webcontent-bootstrap
          # Le WM lance son client graphique a ce chemin. Le bootstrap reste le
          # processus suivi par la fenetre et engendre le vrai WebContent.
          cp native-browser/webcontent-bootstrap scenario/bo-navigateur
          chmod 755 scenario/bo-navigateur scenario/usr/libexec/ladybird/*
          for svc in RequestServer ImageDecoder Compositor WebWorker; do
            if [ -x "native-browser/$svc" ]; then
              cp "native-browser/$svc" "scenario/usr/libexec/ladybird/$svc"
              chmod 755 "scenario/usr/libexec/ladybird/$svc"
            fi
          done
          if [ -d native-browser/resources ]; then
            cp -a native-browser/resources/. scenario/usr/share/ladybird/
          fi
          cat > scenario/autorun <<'SCENARIO'
          uname
          df
          echo "=== Ladybird M8 : HTML local dans fenetre Bouchaud ==="
          export BO_AUTOSTART_BROWSER=1
          export BOUCHAUD_M8=1
          desktop
          SCENARIO
          (cd tools/userland && IMAGE="$GITHUB_WORKSPACE/ladybird-browser.img" ./mkdisk.sh "$GITHUB_WORKSPACE/scenario")
          DISK_SIZE=$(stat -c '%s' ladybird-browser.img)
          echo "hdb Ladybird: $DISK_SIZE octets"
          test "$DISK_SIZE" -le "$MAX_DATA_DISK"

      - name: Executer M8 en ring3
        run: |
          set -u
          LOG=serie-ladybird-browser.log
          SUCCESS='[ladybird-bouchaud] RESULTAT : M8 HTML local dans fenetre Bouchaud OK'
          DEADLINE=$((SECONDS + 240))
          : > "$LOG"

          qemu-system-x86_64 \
            -drive format=raw,file=target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin \
            -drive format=raw,file=ladybird-browser.img \
            -m 4096 -display none -no-reboot \
            -netdev user,id=net0 -device e1000,netdev=net0 \
            -audiodev none,id=muet -device AC97,audiodev=muet \
            -serial file:"$LOG" &
          QEMU_PID=$!
          echo "qemu: pid $QEMU_PID"

          SUCCESS_SEEN=0
          while kill -0 "$QEMU_PID" 2>/dev/null; do
            if grep -Fq "$SUCCESS" "$LOG" 2>/dev/null; then
              SUCCESS_SEEN=1
              echo "qemu: succes M8 detecte, arret anticipe"
              kill -TERM "$QEMU_PID" 2>/dev/null || true
              break
            fi
            if (( SECONDS >= DEADLINE )); then
              echo "qemu: timeout M8 apres 240 s"
              kill -TERM "$QEMU_PID" 2>/dev/null || true
              break
            fi
            sleep 0.25
          done

          for _ in $(seq 1 20); do
            kill -0 "$QEMU_PID" 2>/dev/null || break
            sleep 0.1
          done
          if kill -0 "$QEMU_PID" 2>/dev/null; then
            kill -KILL "$QEMU_PID" 2>/dev/null || true
          fi

          set +e
          wait "$QEMU_PID"
          QEMU_CODE=$?
          set -e
          echo "qemu: code $QEMU_CODE success=$SUCCESS_SEEN"
          cat "$LOG"

      - name: Verdict M8
        run: |
          grep -F "tar: hdb deplie ->" serie-ladybird-browser.log
          grep -F "fichiers paresseux" serie-ladybird-browser.log
          grep -F "memfabric: premier fault fichier" serie-ladybird-browser.log
          if grep -Fq "[ARCHIVE TRONQUEE]" serie-ladybird-browser.log; then
            echo "Le disque Ladybird a ete tronque pendant le depliage" >&2
            exit 1
          fi
          grep -F "[gui] window manager demarre" serie-ladybird-browser.log
          grep -F "[gui] BO_AUTOSTART_BROWSER=1 -> /bo-navigateur" serie-ladybird-browser.log
          grep -F "gui: client /bo-navigateur pid=" serie-ladybird-browser.log
          grep -F "[ladybird-bouchaud] WebContent lance pid=" serie-ladybird-browser.log
          grep -F "[ladybird-bouchaud] WEBCONTENT_READY" serie-ladybird-browser.log
          grep -F "[ladybird-bouchaud] M8_BOOTSTRAP" serie-ladybird-browser.log
          grep -F "[ladybird-bouchaud] M8_LOCAL_HTML_RENDERED" serie-ladybird-browser.log
          grep -F "[ladybird-bouchaud] M8_CAPTURE_MATCH" serie-ladybird-browser.log
          grep -F "gui: client pid=" serie-ladybird-browser.log | grep -F "parle le protocole v1"
          grep -F "gui: premiere trame du client pid=" serie-ladybird-browser.log
          grep -F "[ladybird-bouchaud] M8_WEBCONTENT_EXIT_OK" serie-ladybird-browser.log
          grep -F "[ladybird-bouchaud] RESULTAT : M8 HTML local dans fenetre Bouchaud OK" serie-ladybird-browser.log

      - name: Journal Ladybird M8
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-native-browser-serie
          path: serie-ladybird-browser.log
          if-no-files-found: warn

  qemu-m9:
    name: M9-HTTP-RequestServer-fenetre-Bouchaud
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Installer QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Cache cargo noyau
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Construire le noyau
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo install bootimage --locked
          cargo bootimage

      - uses: actions/download-artifact@v4
        with:
          name: bouchaud-ladybird-native-browser
          path: native-browser

      - name: Demarrer fixture HTTP M9
        run: |
          python3 tools/health/fixture_server.py --port 18080 > fixture-m9.log 2>&1 &
          echo $! > fixture-m9.pid
          sleep 1
          kill -0 "$(cat fixture-m9.pid)"

      - name: Fabriquer le disque Ladybird M9
        run: |
          set -e
          MAX_DATA_DISK=$((768 * 1024 * 1024))

          test -f native-browser/WebContent
          test -f native-browser/RequestServer
          test -f native-browser/webcontent-bootstrap
          test -f native-browser/M9_CAPABLE

          mkdir -p scenario-m9/usr/libexec/ladybird scenario-m9/usr/share/ladybird
          cp native-browser/WebContent scenario-m9/usr/libexec/ladybird/WebContent
          cp native-browser/RequestServer scenario-m9/usr/libexec/ladybird/RequestServer
          cp native-browser/webcontent-bootstrap scenario-m9/usr/libexec/ladybird/webcontent-bootstrap
          cp native-browser/webcontent-bootstrap scenario-m9/bo-navigateur
          chmod 755 scenario-m9/bo-navigateur scenario-m9/usr/libexec/ladybird/*

          if [ -d native-browser/resources ]; then
            cp -a native-browser/resources/. scenario-m9/usr/share/ladybird/
          fi

          cat > scenario-m9/autorun <<'SCENARIO'
          uname
          df
          echo "=== Ladybird M9 : HTTP distant via RequestServer ==="
          export BO_AUTOSTART_BROWSER=1
          export BOUCHAUD_M9=1
          export BOUCHAUD_M9_TEST=1
          # L'URL est citee comme le fait `run.ps1`, et non laissee nue : c'est
          # la difference entre les deux qui a masque le defaut de suppression
          # de guillemets du shell. Une variable que l'integration continue pose
          # autrement que la machine de developpement ne teste pas la machine de
          # developpement.
          export BOUCHAUD_M9_URL='http://10.0.2.2:18080/m9.html'
          desktop
          SCENARIO

          (cd tools/userland && IMAGE="$GITHUB_WORKSPACE/ladybird-m9.img" ./mkdisk.sh "$GITHUB_WORKSPACE/scenario-m9")
          DISK_SIZE=$(stat -c '%s' ladybird-m9.img)
          echo "hdb Ladybird M9: $DISK_SIZE octets"
          test "$DISK_SIZE" -le "$MAX_DATA_DISK"

      - name: Executer M9 en ring3
        run: |
          set -u
          LOG=serie-ladybird-m9.log
          SUCCESS='[ladybird-bouchaud] RESULTAT : M9 HTTP distant dans fenetre Bouchaud OK'
          DEADLINE=$((SECONDS + 300))
          : > "$LOG"

          qemu-system-x86_64 \
            -drive format=raw,file=target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin \
            -drive format=raw,file=ladybird-m9.img \
            -m 4096 -display none -no-reboot \
            -netdev user,id=net0 -device e1000,netdev=net0 \
            -audiodev none,id=muet -device AC97,audiodev=muet \
            -serial file:"$LOG" &
          QEMU_PID=$!
          echo "qemu: pid $QEMU_PID"

          SUCCESS_SEEN=0
          while kill -0 "$QEMU_PID" 2>/dev/null; do
            if grep -Fq "$SUCCESS" "$LOG" 2>/dev/null; then
              SUCCESS_SEEN=1
              echo "qemu: succes M9 detecte, arret anticipe"
              kill -TERM "$QEMU_PID" 2>/dev/null || true
              break
            fi
            if (( SECONDS >= DEADLINE )); then
              echo "qemu: timeout M9 apres 300 s"
              kill -TERM "$QEMU_PID" 2>/dev/null || true
              break
            fi
            sleep 0.25
          done

          for _ in $(seq 1 20); do
            kill -0 "$QEMU_PID" 2>/dev/null || break
            sleep 0.1
          done
          if kill -0 "$QEMU_PID" 2>/dev/null; then
            kill -KILL "$QEMU_PID" 2>/dev/null || true
          fi

          set +e
          wait "$QEMU_PID"
          QEMU_CODE=$?
          set -e
          echo "qemu: code $QEMU_CODE success=$SUCCESS_SEEN"
          cat "$LOG"
          echo "=== fixture ==="
          cat fixture-m9.log

      - name: Verdict M9
        run: |
          grep -F "tar: hdb deplie ->" serie-ladybird-m9.log
          grep -F "fichiers paresseux" serie-ladybird-m9.log
          ! grep -Fq "[ARCHIVE TRONQUEE]" serie-ladybird-m9.log

          grep -F "[ladybird-bouchaud] M9_REQUESTSERVER_LAUNCHED" serie-ladybird-m9.log
          grep -F "[ladybird-bouchaud] M9_REQUESTSERVER_READY" serie-ladybird-m9.log
          grep -F "[ladybird-bouchaud] M9_REQUESTSERVER_CONNECTED" serie-ladybird-m9.log
          grep -F "[ladybird-bouchaud] M9_NAVIGATION_BEGIN" serie-ladybird-m9.log
          grep -F "[ladybird-bouchaud] M9_NAVIGATION_COMMITTED" serie-ladybird-m9.log
          grep -F "[ladybird-bouchaud] M9_DOCUMENT_LOADED" serie-ladybird-m9.log
          grep -F "[ladybird-bouchaud] M9_CAPTURE_MATCH" serie-ladybird-m9.log
          grep -F "[ladybird-bouchaud] M9_CPU_SCREENSHOT_RENDERED" serie-ladybird-m9.log
          grep -F "[ladybird-bouchaud] M9_GUI_HANDSHAKE_OK" serie-ladybird-m9.log
          grep -F "[ladybird-bouchaud] M9_FRAME_READY_OK" serie-ladybird-m9.log
          grep -F "[ladybird-bouchaud] M9_WEBCONTENT_EXIT_OK" serie-ladybird-m9.log
          grep -F "[ladybird-bouchaud] RESULTAT : M9 HTTP distant dans fenetre Bouchaud OK" serie-ladybird-m9.log

          grep -F "M9_FIXTURE_HTTP_OK path=/m9.html" fixture-m9.log

      - name: Journaux Ladybird M9
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-m9-http-serie
          path: |
            serie-ladybird-m9.log
            fixture-m9.log
          if-no-files-found: warn

  qemu-m12:
    name: M12-HTTPS-fenetre-Bouchaud
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Installer QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Cache cargo noyau
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Construire le noyau
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo install bootimage --locked
          cargo bootimage

      - uses: actions/download-artifact@v4
        with:
          name: bouchaud-ladybird-native-browser
          path: native-browser

      # Une autorite locale, fabriquee a chaque execution. La CI ne depend
      # d'aucun site externe — contrainte tenue depuis le debut du projet — et
      # la verification TLS est pourtant **reelle** : la chaine est validee
      # contre cette autorite, que l'image Bouchaud embarque.
      #
      # Le certificat porte `IP:10.0.2.2` en SAN, parce que c'est l'adresse de
      # l'hote vue depuis QEMU et qu'un certificat pour un nom ne vaudrait rien
      # ici : la verification du nom fait partie de ce qu'on veut prouver.
      # Magasin d'autorites **publiques**, pour joindre l'Internet reel.
      #
      # Il vient du paquet `ca-certificates` du runner, deja installe : aucun
      # telechargement, donc aucun hote tiers a l'instant ou l'on teste. Meme
      # lecon que le 403 de `dbus` — un paquet qu'on ne demande pas ne peut pas
      # tomber.
      #
      # Il est verifie plutot que suppose : on compte les certificats et on
      # exige une racine connue. Un fichier tronque passerait autrement
      # inapercu jusqu'a une poignee de main TLS incomprehensible.
      #
      # L'empreinte est journalisee. Epingler une empreinte figee casserait a la
      # premiere mise a jour de securite du paquet — un faux epinglage, qui
      # donnerait l'illusion du controle.
      - name: Preparer le magasin d'autorites publiques
        run: |
          set -e
          SRC=/etc/ssl/certs/ca-certificates.crt
          test -s "$SRC"
          mkdir -p tls
          cp "$SRC" tls/public-ca.crt
          NB=$(grep -c 'BEGIN CERTIFICATE' tls/public-ca.crt)
          echo "autorites publiques : $NB certificats"
          test "$NB" -ge 100
          openssl crl2pkcs7 -nocrl -certfile tls/public-ca.crt \
            | openssl pkcs7 -print_certs -noout \
            | grep -q 'ISRG Root X1'
          echo "  racine temoin presente : ISRG Root X1"
          sha256sum tls/public-ca.crt

      - name: Fabriquer l'autorite et le certificat locaux
        run: |
          set -e
          mkdir -p tls
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout tls/ca.key -out tls/ca.crt -days 3650 \
            -subj "/CN=Bouchaud Test CA"
          openssl req -newkey rsa:2048 -nodes \
            -keyout tls/srv.key -out tls/srv.csr -subj "/CN=10.0.2.2"
          printf "subjectAltName=IP:10.0.2.2,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n" > tls/ext.cnf
          openssl x509 -req -in tls/srv.csr -CA tls/ca.crt -CAkey tls/ca.key \
            -CAcreateserial -out tls/srv.crt -days 3650 -extfile tls/ext.cnf
          openssl x509 -in tls/srv.crt -noout -subject -ext subjectAltName

      - name: Demarrer fixture HTTPS M12
        run: |
          python3 tools/health/fixture_server.py --port 18443 \
            --cert tls/srv.crt --key tls/srv.key > fixture-m12.log 2>&1 &
          echo $! > fixture-m12.pid
          sleep 1
          kill -0 "$(cat fixture-m12.pid)"
          # La fixture doit repondre a une vraie verification de chaine avant
          # qu'on demande la meme chose a Bouchaud. Si elle echoue ici, le
          # defaut est dans la fixture, pas dans le systeme teste.
          curl -sSf --cacert tls/ca.crt https://10.0.2.2:18443/m12.html \
            --resolve 10.0.2.2:18443:127.0.0.1 -o /dev/null
          echo "fixture TLS validee depuis l'hote"

      - name: Fabriquer le disque Ladybird M12
        run: |
          set -e
          MAX_DATA_DISK=$((768 * 1024 * 1024))

          test -f native-browser/WebContent
          test -f native-browser/RequestServer
          test -f native-browser/webcontent-bootstrap
          test -f native-browser/M9_CAPABLE

          mkdir -p scenario-m12/usr/libexec/ladybird scenario-m12/usr/share/ladybird
          cp native-browser/WebContent scenario-m12/usr/libexec/ladybird/WebContent
          cp native-browser/RequestServer scenario-m12/usr/libexec/ladybird/RequestServer
          cp native-browser/webcontent-bootstrap scenario-m12/usr/libexec/ladybird/webcontent-bootstrap
          cp native-browser/webcontent-bootstrap scenario-m12/bo-navigateur
          chmod 755 scenario-m12/bo-navigateur scenario-m12/usr/libexec/ladybird/*

          if [ -d native-browser/resources ]; then
            cp -a native-browser/resources/. scenario-m12/usr/share/ladybird/
          fi

          # L'autorite locale, la ou `webcontent-bootstrap` la cherche. Sans ce
          # fichier il ne passe pas `--certificate`, RequestServer retombe sur
          # le chemin compile — inexistant sous Bouchaud — et toute connexion
          # TLS echoue a la verification.
          # Les deux autorites concatenees : la locale, qui signe la fixture, et
          # les publiques, qui ouvrent l'Internet reel. C'est le seul moyen de
          # valider les deux sans jamais relacher la verification.
          mkdir -p scenario-m12/etc/ssl/certs
          cat tls/ca.crt tls/public-ca.crt > scenario-m12/etc/ssl/certs/ca-certificates.crt
          grep -c 'BEGIN CERTIFICATE' scenario-m12/etc/ssl/certs/ca-certificates.crt

          cat > scenario-m12/autorun <<'SCENARIO'
          uname
          df
          echo "=== Ladybird M12 : HTTPS distant, certificat verifie ==="
          export BO_AUTOSTART_BROWSER=1
          export BOUCHAUD_M9=1
          export BOUCHAUD_M9_TEST=1
          export BOUCHAUD_M9_URL='https://10.0.2.2:18443/m12.html'
          desktop
          SCENARIO

          (cd tools/userland && IMAGE="$GITHUB_WORKSPACE/ladybird-m12.img" ./mkdisk.sh "$GITHUB_WORKSPACE/scenario-m12")
          DISK_SIZE=$(stat -c '%s' ladybird-m12.img)
          echo "hdb Ladybird M9: $DISK_SIZE octets"
          test "$DISK_SIZE" -le "$MAX_DATA_DISK"

      - name: Executer M12 en ring3
        run: |
          set -u
          LOG=serie-ladybird-m12.log
          SUCCESS='[ladybird-bouchaud] RESULTAT : M9 HTTP distant dans fenetre Bouchaud OK'
          DEADLINE=$((SECONDS + 300))
          : > "$LOG"

          qemu-system-x86_64 \
            -drive format=raw,file=target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin \
            -drive format=raw,file=ladybird-m12.img \
            -m 4096 -display none -no-reboot \
            -netdev user,id=net0 -device e1000,netdev=net0 \
            -audiodev none,id=muet -device AC97,audiodev=muet \
            -serial file:"$LOG" &
          QEMU_PID=$!
          echo "qemu: pid $QEMU_PID"

          SUCCESS_SEEN=0
          while kill -0 "$QEMU_PID" 2>/dev/null; do
            if grep -Fq "$SUCCESS" "$LOG" 2>/dev/null; then
              SUCCESS_SEEN=1
              echo "qemu: succes M9 detecte, arret anticipe"
              kill -TERM "$QEMU_PID" 2>/dev/null || true
              break
            fi
            if (( SECONDS >= DEADLINE )); then
              echo "qemu: timeout M9 apres 300 s"
              kill -TERM "$QEMU_PID" 2>/dev/null || true
              break
            fi
            sleep 0.25
          done

          for _ in $(seq 1 20); do
            kill -0 "$QEMU_PID" 2>/dev/null || break
            sleep 0.1
          done
          if kill -0 "$QEMU_PID" 2>/dev/null; then
            kill -KILL "$QEMU_PID" 2>/dev/null || true
          fi

          set +e
          wait "$QEMU_PID"
          QEMU_CODE=$?
          set -e
          echo "qemu: code $QEMU_CODE success=$SUCCESS_SEEN"
          cat "$LOG"
          echo "=== fixture ==="
          cat fixture-m12.log

      - name: Verdict M12
        run: |
          grep -F "tar: hdb deplie ->" serie-ladybird-m12.log
          grep -F "fichiers paresseux" serie-ladybird-m12.log
          ! grep -Fq "[ARCHIVE TRONQUEE]" serie-ladybird-m12.log

          grep -F "[ladybird-bouchaud] M9_REQUESTSERVER_LAUNCHED" serie-ladybird-m12.log
          grep -F "[ladybird-bouchaud] M9_REQUESTSERVER_READY" serie-ladybird-m12.log
          grep -F "[ladybird-bouchaud] M9_REQUESTSERVER_CONNECTED" serie-ladybird-m12.log
          grep -F "[ladybird-bouchaud] M9_NAVIGATION_BEGIN" serie-ladybird-m12.log
          grep -F "[ladybird-bouchaud] M9_NAVIGATION_COMMITTED" serie-ladybird-m12.log
          grep -F "[ladybird-bouchaud] M9_DOCUMENT_LOADED" serie-ladybird-m12.log
          grep -F "[ladybird-bouchaud] M9_CAPTURE_MATCH" serie-ladybird-m12.log
          grep -F "[ladybird-bouchaud] M9_CPU_SCREENSHOT_RENDERED" serie-ladybird-m12.log
          grep -F "[ladybird-bouchaud] M9_GUI_HANDSHAKE_OK" serie-ladybird-m12.log
          grep -F "[ladybird-bouchaud] M9_FRAME_READY_OK" serie-ladybird-m12.log
          grep -F "[ladybird-bouchaud] M9_WEBCONTENT_EXIT_OK" serie-ladybird-m12.log
          grep -F "[ladybird-bouchaud] RESULTAT : M9 HTTP distant dans fenetre Bouchaud OK" serie-ladybird-m12.log

          # Les marqueurs M9_* sont attendus : M12 rejoue **le meme temoin**, et
          # c'est voulu — seul le schema change. Ce qui distingue M12 tient aux
          # deux lignes suivantes.
          grep -F "[ladybird-bouchaud] M12_CA_BUNDLE /etc/ssl/certs/ca-certificates.crt" serie-ladybird-m12.log
          grep -F "[ladybird-bouchaud] M12_DNS_SERVER 10.0.2.3 port=53 tls=false" serie-ladybird-m12.log
          grep -F "M12_FIXTURE_HTTPS_OK path=/m12.html" fixture-m12.log
          # Et la preuve negative : aucune page n'a ete servie en clair.
          ! grep -Fq "M9_FIXTURE_HTTP_OK" fixture-m12.log

      - name: Journaux Ladybird M12
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-m12-https-serie
          path: |
            serie-ladybird-m12.log
            fixture-m12.log
          if-no-files-found: warn

  qemu-internet:
    name: Internet-reel-example.com (informatif)
    runs-on: ubuntu-latest
    needs: build
    # Informatif, et il doit le rester. Une panne d'un site tiers ne peut pas
    # rendre rouge une CI dont le role est de mesurer Bouchaud. Le resultat se
    # lit ; il ne bloque pas. C'est la separation demandee entre invariants
    # deterministes et essais reels.
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Installer QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Cache cargo noyau
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Construire le noyau
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo install bootimage --locked
          cargo bootimage

      - uses: actions/download-artifact@v4
        with:
          name: bouchaud-ladybird-native-browser
          path: native-browser

      - name: Preparer le magasin d'autorites publiques
        run: |
          set -e
          mkdir -p tls
          cp /etc/ssl/certs/ca-certificates.crt tls/public-ca.crt
          test -s tls/public-ca.crt
          sha256sum tls/public-ca.crt

      - name: Fabriquer le disque Internet
        run: |
          set -e
          MAX_DATA_DISK=$((768 * 1024 * 1024))

          mkdir -p scenario-net/usr/libexec/ladybird scenario-net/usr/share/ladybird
          cp native-browser/WebContent scenario-net/usr/libexec/ladybird/WebContent
          cp native-browser/RequestServer scenario-net/usr/libexec/ladybird/RequestServer
          cp native-browser/webcontent-bootstrap scenario-net/usr/libexec/ladybird/webcontent-bootstrap
          cp native-browser/webcontent-bootstrap scenario-net/bo-navigateur
          chmod 755 scenario-net/bo-navigateur scenario-net/usr/libexec/ladybird/*

          if [ -d native-browser/resources ]; then
            cp -a native-browser/resources/. scenario-net/usr/share/ladybird/
          fi

          # Uniquement les autorites publiques : la cible est un vrai site, et
          # l'autorite de test n'aurait rien a y faire.
          mkdir -p scenario-net/etc/ssl/certs
          cp tls/public-ca.crt scenario-net/etc/ssl/certs/ca-certificates.crt

          cat > scenario-net/autorun <<'SCENARIO'
          uname
          df
          ifconfig
          echo "=== Ladybird : Internet reel, https://example.com ==="
          export BO_AUTOSTART_BROWSER=1
          export BOUCHAUD_M9=1
          export BOUCHAUD_M9_TEST=1
          export BOUCHAUD_M9_URL='https://example.com/'
          desktop
          SCENARIO

          (cd tools/userland && IMAGE="$GITHUB_WORKSPACE/ladybird-net.img" ./mkdisk.sh "$GITHUB_WORKSPACE/scenario-net")
          DISK_SIZE=$(stat -c '%s' ladybird-net.img)
          echo "hdb Internet: $DISK_SIZE octets"
          test "$DISK_SIZE" -le "$MAX_DATA_DISK"

      - name: Executer l'essai Internet en ring3
        run: |
          set -u
          LOG=serie-ladybird-net.log
          SUCCESS='[ladybird-bouchaud] RESULTAT : M9 HTTP distant dans fenetre Bouchaud OK'
          DEADLINE=$((SECONDS + 300))
          : > "$LOG"

          qemu-system-x86_64 \
            -drive format=raw,file=target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin \
            -drive format=raw,file=ladybird-net.img \
            -m 4096 -display none -no-reboot \
            -netdev user,id=net0 -device e1000,netdev=net0 \
            -audiodev none,id=muet -device AC97,audiodev=muet \
            -serial file:"$LOG" &
          QEMU_PID=$!
          echo "qemu: pid $QEMU_PID"

          SUCCESS_SEEN=0
          while kill -0 "$QEMU_PID" 2>/dev/null; do
            if grep -Fq "$SUCCESS" "$LOG" 2>/dev/null; then
              SUCCESS_SEEN=1
              echo "qemu: succes M9 detecte, arret anticipe"
              kill -TERM "$QEMU_PID" 2>/dev/null || true
              break
            fi
            if (( SECONDS >= DEADLINE )); then
              echo "qemu: timeout M9 apres 300 s"
              kill -TERM "$QEMU_PID" 2>/dev/null || true
              break
            fi
            sleep 0.25
          done

          for _ in $(seq 1 20); do
            kill -0 "$QEMU_PID" 2>/dev/null || break
            sleep 0.1
          done
          if kill -0 "$QEMU_PID" 2>/dev/null; then
            kill -KILL "$QEMU_PID" 2>/dev/null || true
          fi

          set +e
          wait "$QEMU_PID"
          QEMU_CODE=$?
          set -e
          echo "qemu: code $QEMU_CODE success=$SUCCESS_SEEN"
          cat "$LOG"

          # Pas de `cat fixture-m12.log` ici : la fixture TLS appartient au job
          # M12, qui tourne ailleurs. Le lire depuis ce job faisait echouer
          # l'etape sous `set -e` a *chaque* execution complete, et sautait
          # silencieusement le verdict qui suit — les assertions DNS/TLS que ce
          # job existe pour porter n'etaient donc jamais evaluees. L'essai
          # Internet n'a pas de fixture : c'est tout son objet.

      - name: Verdict Internet
        run: |
          # Ce job est informatif : quand il echoue, ce qu'on veut savoir n'est
          # pas *qu'il* a echoue mais **jusqu'ou** la chaine est allee. Les
          # `grep` d'assertion qui suivent ne peuvent pas le dire : sous
          # `set -e`, le premier qui manque coupe l'etape, et tout ce qui aurait
          # situe l'arret reste dans un journal que personne n'ouvre. On imprime
          # donc la trace d'abord, assertions ensuite.
          echo "--- analyse d'URL, navigation, RequestServer, DNS ---"
          # `M1[5-9]_` et non la liste des marqueurs un par un. La liste avait
          # deja coute une conclusion fausse : `M17_RING` n'y figurait pas —
          # seul `M17_UDP_` y etait — et son absence a l'ecran a ete lue comme
          # l'absence de la mesure elle-meme. Un filtre qui ne peut pas montrer
          # ce qu'on cherche est pire que pas de filtre : il repond « rien »
          # avec la meme assurance que s'il avait regarde.
          grep -E "M1[5-9]_|M9_URL_INVALID|M9_NAVIGATION_|M9_RS_|M13_DNS_|M14_DNS_" \
              serie-ladybird-net.log || echo "(aucun de ces marqueurs)"
          # La derniere ligne de charge par processus. Elle dit qui prend le
          # processeur, et c'est la seule mesure qui distingue « la machine
          # attend » de « la machine tourne a vide » — les deux se ressemblent
          # dans un journal, et pas du tout dans une main sur le ventilateur.
          echo "--- charge par processus (dernier releve) ---"
          grep -F "[ps]" serie-ladybird-net.log | tail -2 || echo "(aucun releve)"
          echo "--- assertions ---"
          grep -F "[ladybird-bouchaud] M12_CA_BUNDLE /etc/ssl/certs/ca-certificates.crt" serie-ladybird-net.log
          grep -F "[ladybird-bouchaud] M12_DNS_SERVER 10.0.2.3 port=53 tls=false" serie-ladybird-net.log
          # Les preuves qui comptent : un **nom** a ete resolu par DNS, une
          # chaine **publique** validee, et le document distant commite.
          grep -F "[ladybird-bouchaud] M9_NAVIGATION_COMMITTED" serie-ladybird-net.log
          grep -F "[ladybird-bouchaud] M9_DOCUMENT_LOADED" serie-ladybird-net.log
          grep -F "https://example.com/" serie-ladybird-net.log

      - name: Journaux Internet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-internet-serie
          path: serie-ladybird-net.log
          if-no-files-found: warn
