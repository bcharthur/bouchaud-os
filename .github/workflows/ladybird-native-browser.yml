  # ==========================================================================
  # BOUCHAUD_C44_DEUX_STATUTS_REELS
  # ==========================================================================
  #
  # `BOUCHAUD_C32_DEUX_VERDICTS` avait separe les deux verdicts dans la SORTIE
  # du banc, mais un seul travail les portait -- et il ne bloquait que sur le
  # fonctionnel. `BO_SMOKE_PERF_BLOQUANT` n'etait defini par aucun workflow :
  # une regression de performance laissait la CI verte.
  #
  # Deux travaux, donc deux statuts que GitHub affiche et bloque separement.
  # UN SEUL demarrage QEMU : ce travail ne relance rien, il relit le journal
  # que le precedent a publie.
  #
  # `needs: browser-host-smoke` sans `if: always()` est VOULU : si le navigateur ne
  # fonctionne pas, ses chiffres de performance ne veulent rien dire, et un
  # rouge de performance par-dessus un rouge fonctionnel n'informe personne.
  performance:
    name: ladybird / performance
    needs: browser-host-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ladybird-browser-host-smoke-logs
          path: .
      - name: Budgets de performance
        run: tools/ci/verifie_ladybird_perf.sh serie-browser-host.log

  # ==========================================================================
  # BOUCHAUD_C68 : le job `variante-elf` a ete RETIRE, et pourquoi
  # ==========================================================================
  #
  # Il comparait deux formes d'edition de liens de WebWorker pour tester si
  # les ~405 000 relocations de demarrage expliquaient le segment
  # `exec_fin -> main`. Le run 35944547625 a tranche la question autrement,
  # et definitivement :
  #
  #     WebWorker #1 (froid)   user_ms=724   sys_ms=113594
  #
  # `_dl_relocate_static_pie` s'execute en espace UTILISATEUR. Toute la vie
  # utilisateur de ce processus tient dans 724 ms. Les relocations ne peuvent
  # pas couter davantage -- quel que soit leur nombre.
  #
  # Faire tourner vingt-cinq minutes de CI, deux demarrages froids, pour un
  # effet borne par 724 ms sur un probleme de 113 s serait du gaspillage. Et
  # laisser le job rouge pour une experience qu'on a decide de ne pas mener
  # polluerait le signal exactement comme un rouge masque.
  #
  # Ce qui reste dans l'arbre : `build-variante-relr.sh`, la bascule
  # `BOUCHAUD_HELPER_RELR` et son garde-fou `verifie-bascule-relr.py`. Si le
  # temps utilisateur redevient un jour la cible, l'outil est la, teste.

  ordre-worker:
    name: ladybird / ordre worker (diagnostic)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: QEMU + outils
        run: |
          tools/ci/apt-installe.sh qemu-system-x86 file socat netcat-openbsd
      - name: Bootimage
