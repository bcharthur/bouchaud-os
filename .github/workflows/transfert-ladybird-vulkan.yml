name: Transfert de l'artefact Ladybird Vulkan
on:
  push:
    branches: [codex/p10-vulkan-artifact-44731438812]
permissions:
  actions: read
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Vérifier et découper le ZIP publié
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/bcharthur/bouchaud-os/actions/artifacts/14631118879/zip > ladybird.zip
          echo 'f3be070ceb6eda60d616156ecd1751c5948a4044c0dd282b7ff3410a4c0efc8b  ladybird.zip' | sha256sum -c
          split -b 24MiB -d -a 2 ladybird.zip partie-
          test "$(find . -maxdepth 1 -name 'partie-*' | wc -l)" = 16
      - uses: actions/upload-artifact@v4
        with:
          name: ladybird-vulkan-partie-00
          path: partie-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: ladybird-vulkan-partie-01
          path: partie-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
