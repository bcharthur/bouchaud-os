name: Transfert de l'artefact Ladybird CPU #357
on:
  push:
    branches: [codex/p10-vulkan-artifact-44762232542]
permissions:
  actions: read
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Vérifier et découper le ZIP publié
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          depot="$GITHUB_REPOSITORY"
          run=44828956696
          for tentative in $(seq 1 210); do
            etat=$(gh api "repos/$depot/actions/runs/$run")
            jq -e '.head_sha == "77aa1d89a643918dabb1274b8d798c2cf71084b3"' <<< "$etat" >/dev/null
            if [[ $(jq -r .status <<< "$etat") == completed ]]; then break; fi
            sleep 30
          done
          jq -e '.status == "completed" and .event == "workflow_dispatch"' <<< "$etat" >/dev/null
          gh api "repos/$depot/actions/runs/$run/jobs" | jq -e '
            any(.jobs[]; .id == 136626017638 and .name == "ladybird / build once" and .conclusion == "success")' >/dev/null
          artefact=$(gh api "repos/$depot/actions/runs/$run/artifacts" | jq -cer '
            [.artifacts[] | select(.name == "bouchaud-ladybird-native-browser" and .expired == false)]
            | if length == 1 then .[0] else error("archive Vulkan non unique ou absente") end')
          aid=$(jq -r .id <<< "$artefact")
          test "$aid" = 14682106312
          digest=$(jq -er '.digest | sub("^sha256:"; "") | select(test("^[0-9a-f]{64}$"))' <<< "$artefact")
          test "$digest" = add9d9ff201e3bccaadf7bea03543d2ce138bda5c8aa86b7b19ac32d6f6143e3
          gh api "repos/$depot/actions/artifacts/$aid/zip" > ladybird.zip
          echo "$digest  ladybird.zip" | tee "$RUNNER_TEMP/ladybird.sha256" | sha256sum -c
          octets=$(stat -c %s ladybird.zip)
          tranche=$(((octets + 15) / 16))
          test "$tranche" -lt $((30 * 1024 * 1024))
          split -b "$tranche" -d -a 2 ladybird.zip partie-
          test "$(find . -maxdepth 1 -name 'partie-*' | wc -l)" = 16
      - uses: actions/upload-artifact@v4
        with:
          name: ladybird-vulkan-partie-00
          path: partie-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: ladybird-vulkan-partie-01
          path: partie-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
