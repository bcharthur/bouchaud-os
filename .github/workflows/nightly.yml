name: Nightly Full

# Campagne lourde: jamais sur chaque commit. Elle valide le noyau courant de
# main et le dernier artefact Ladybird canonique reussi de main.
# No costly automatic Nightly on gate-only changes; preserve schedule/dispatch.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      ladybird_run_id:
        description: 'Run Ladybird a utiliser; vide = dernier succes sur main'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-full
  cancel-in-progress: true

jobs:
  kernel-build:
    name: nightly / kernel once
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: nightly-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            nightly-cargo-${{ runner.os }}-
            cargo-${{ runner.os }}-
      - run: tools/ci/build_kernel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-bootimage
          path: target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
          if-no-files-found: error
          retention-days: 14

  qemu-core:
    name: nightly / qemu core
    needs: kernel-build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        suite: [health, primitives, mm]
    steps:
      - uses: actions/checkout@v4
      - name: Dependances
        run: |
          tools/ci/apt-installe.sh qemu-system-x86 curl musl-tools build-essential file
      - uses: actions/download-artifact@v4
        with:
          name: nightly-bootimage
          path: image
      - name: Executer ${{ matrix.suite }}
        run: |
          case '${{ matrix.suite }}' in
            health) tools/ci/run_system_health.sh image/bootimage-bouchaud-os.bin ;;
            primitives) tools/ci/run_os_primitives.sh image/bootimage-bouchaud-os.bin ;;
            mm) tools/ci/run_mm_ng6.sh image/bootimage-bouchaud-os.bin ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-${{ matrix.suite }}-logs
          path: |
            health.log
            health-report.json
            fixture.log
            serie-primitives.log
            mm-ng6.log
            mmstress.readelf.txt
            mmstress.sha256
          if-no-files-found: ignore

  dns:
    name: nightly / dns ring3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: QEMU
        run: |
          tools/ci/apt-installe.sh qemu-system-x86
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-dns-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            nightly-dns-${{ runner.os }}-
            cargo-${{ runner.os }}-
      - run: tools/net/verifie-dns.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-dns-log
          path: target/verifie-dns/serie.log
          if-no-files-found: warn

  resolve-ladybird:
    # BOUCHAUD_LADYBIRD_PRODUCTION_V1 : selection STRICTE. Le run le plus
    # recent portant un artefact n'est pas celui de ce SHA ; on retient le
    # build reel dont l'empreinte, recalculee depuis git, est celle du HEAD
    # (tools/ci/ladybird_provenance.py), ou la production en cours de cette
    # empreinte. Un run demande a la main reste possible : la verification
    # `entrees` du smoke le juge comme les autres.
    name: nightly / resolve Ladybird
    runs-on: ubuntu-latest
    timeout-minutes: 250
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.resolve.outputs.source_run }}
      found: ${{ steps.resolve.outputs.found }}
    steps:
      - uses: actions/checkout@v4
      - name: Trouver l'artefact de l'empreinte du HEAD
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REQUESTED: ${{ inputs.ladybird_run_id }}
          GRACE_ATTENTE: '0'
          DELAI_ATTENTE: '14400'
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            if ! [[ "$REQUESTED" =~ ^[0-9]+$ ]]; then
              echo "Identifiant Ladybird invalide: $REQUESTED" >&2
              exit 2
            fi
            echo "source_run=$REQUESTED" >> "$GITHUB_OUTPUT"
          elif ! python3 tools/ci/ladybird_provenance.py attends; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::error::Aucun artefact Ladybird de l'empreinte du HEAD. Produire le binaire (ladybird-native-browser) avant le Nightly."
            exit 1
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

  ladybird-smoke:
    name: nightly / Ladybird product
    needs: [kernel-build, resolve-ladybird]
    if: needs.resolve-ladybird.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: QEMU + file + moniteur (socat) + second site (nc)
        # BOUCHAUD_BANC_PREREQUIS_V1 : sans socat, aucune molette n'etait
        # envoyee et le smoke accusait `wm_vers_navigateur` (38378134772).
        run: |
          tools/ci/apt-installe.sh qemu-system-x86 file socat netcat-openbsd
      - uses: actions/download-artifact@v4
        with:
          name: nightly-bootimage
          path: image
      - uses: actions/download-artifact@v4
        with:
          name: bouchaud-ladybird-native-browser
          path: native-browser
          run-id: ${{ needs.resolve-ladybird.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verifier la provenance de l'artefact et les entrees du SHA
        run: tools/ci/verifie_artefact_ladybird.sh entrees native-browser
      - run: tools/ci/run_ladybird_browser_host.sh image/bootimage-bouchaud-os.bin native-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-ladybird-logs
          path: |
            serie-browser-host.log
            fixture-browser-host.log
          if-no-files-found: warn

  # Dette historique Windows : visible a chaque nightly, sans rendre une PR
  # sans changement .ps1 artificiellement rouge.
  windows-debt:
    name: nightly / Windows scripts debt
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      ascii: ${{ steps.ascii.outcome }}
      syntax: ${{ steps.syntax.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: ASCII strict global
        id: ascii
        continue-on-error: true
        run: python3 tools/verifie-scripts-windows.py

      - name: Syntaxe PowerShell globale
        id: syntax
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $echecs = 0
          foreach ($chemin in (git ls-files '*.ps1')) {
            $erreurs = $null
            $jetons = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $chemin),
              [ref]$jetons,
              [ref]$erreurs
            ) | Out-Null

            if ($erreurs -and $erreurs.Count) {
              $echecs++
              Write-Host "ECHEC $chemin"
              $erreurs | Select-Object -First 5 | ForEach-Object {
                Write-Host $_.Message
              }
            }
          }
          if ($echecs) { exit 1 }

      - name: Resume dette Windows
        if: always()
        env:
          ASCII: ${{ steps.ascii.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
        run: |
          {
            echo '## Dette PowerShell historique'
            echo
            echo "- ASCII strict: $ASCII"
            echo "- Syntaxe: $SYNTAX"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ASCII" = "failure" ] || [ "$SYNTAX" = "failure" ]; then
            echo "::warning::Dette PowerShell historique detectee. CI Fast ne bloque que les .ps1 modifies par la PR."
          fi

  nightly-gate:
    name: nightly-gate
    if: always()
    needs: [kernel-build, qemu-core, dns, resolve-ladybird, ladybird-smoke, windows-debt]
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        env:
          KERNEL: ${{ needs.kernel-build.result }}
          CORE: ${{ needs.qemu-core.result }}
          DNS: ${{ needs.dns.result }}
          RESOLVE: ${{ needs.resolve-ladybird.result }}
          LADYBIRD: ${{ needs.ladybird-smoke.result }}
          WINDOWS_ASCII: ${{ needs.windows-debt.outputs.ascii }}
          WINDOWS_SYNTAX: ${{ needs.windows-debt.outputs.syntax }}
        run: |
          printf '%-12s %s\n' kernel "$KERNEL" core "$CORE" dns "$DNS" resolve "$RESOLVE" ladybird "$LADYBIRD"
          printf '%-12s %s\n' win-ascii "$WINDOWS_ASCII" win-syntax "$WINDOWS_SYNTAX"

          # Aucune validation facultative ou skipped : sans artefact
          # Ladybird compatible, Nightly DOIT rester rouge (fail-closed).
          for r in "$KERNEL" "$CORE" "$DNS" "$RESOLVE" "$LADYBIRD"; do
            [ "$r" = success ] || { echo "::error::Nightly invalide : resultat=$r"; exit 1; }
          done

          # La dette Windows est reportee, pas bloquante pour ce nightly.
          echo NIGHTLY_GATE_OK
