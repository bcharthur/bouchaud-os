name: C22 analyser - tests rapides
on:
  push:
    branches: ['diag/c22-categories-fast-20261030']
    paths:
      - 'tools/ci/c22_rss_forensic.py'
      - 'tools/ci/reliability/test_c22_rss_forensic.py'
      - '.github/workflows/c22-analyser-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tools/ci/reliability -p test_c22_rss_forensic.py -v
