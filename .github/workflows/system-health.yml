name: system-health (debug)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-health-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: QEMU + curl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 curl
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: health-debug-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            health-debug-${{ runner.os }}-
            cargo-${{ runner.os }}-
      - name: Bootimage
        run: tools/ci/build_kernel.sh
      - name: Sante systeme
        run: tools/ci/run_system_health.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
      - name: Verifier les couches separement
        run: |
          for check in foundation resource memory storage abi osi-l1 osi-l2 osi-l3 osi-l4 osi-l5-6 osi-l7; do
            echo "=== $check ==="
            python3 tools/health/verify_health.py --log health.log --check "$check"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-health-debug
          path: |
            health.log
            health-report.json
            fixture.log
          if-no-files-found: warn
