name: C22 runtime purge - REUSE binaire natif + noyau actuel
# Ne recompile JAMAIS Ladybird. Le binaire WebContent provient du
# run 41077304303, SHA b726cfb0; verifie l'empreinte de ses sources
# contre le SHA de ce run. Ne compile que le noyau puis 6x6 + Nightly.
# Heavy C22 6x6 campaign runs ONLY when a verified fresh native producer is supplied.
# An automatic push/PR run has no safe native_run_id and must never use an obsolete binary.
on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: 'Successful ladybird-native-browser run containing native binary to test'
        required: true
        type: string
permissions:
  contents: read
  actions: read

jobs:
  preflight-producer:
    name: C22 / validate native producer BEFORE any KVM or kernel build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require a successful native Ladybird build with a real artifact
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NATIVE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Missing numeric native_run_id"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN_ID" > "$RUNNER_TEMP/c22-native-run.json"
          python3 - "$RUNNER_TEMP/c22-native-run.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1], encoding='utf-8'))
          if r.get('name') != 'ladybird-native-browser' or r.get('status') != 'completed' or r.get('conclusion') != 'success':
              raise SystemExit('C22_NATIVE_PRODUCTEUR_NON_QUALIFIE: need completed successful native run')
          print('C22_NATIVE_PRODUCTEUR_OK run='+str(r['id'])+' sha='+r['head_sha'])
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/c22-native-artifacts.json"
          python3 - "$RUNNER_TEMP/c22-native-artifacts.json" <<'PY'
          import json, sys
          artifacts = json.load(open(sys.argv[1], encoding='utf-8')).get('artifacts', [])
          if not any(a.get('name') == 'bouchaud-ladybird-native-browser' and not a.get('expired') for a in artifacts):
              raise SystemExit('C22_NATIVE_ARTIFACT_ABSENT')
          print('C22_NATIVE_ARTIFACT_OK')
          PY

  memoire-onglets:
    # BOUCHAUD_MEMOIRE_ONGLETS_V1 -- deux repetitions de mesure intactes.
    # Si elles sont rouges, une troisieme repetition active dump_graph() uniquement
    # pour attribuer la retention, sans contaminer M0/M1/M2 des deux mesures.
    # BOUCHAUD_MEMOIRE_ONGLETS_V1 -- DIAGNOSTIC (hors verdict de convergence
    # tant que le banc n'a pas fait ses preuves). Deux phases identiques de 10
    # onglets autre site ouverts puis fermes : fuite (croissance en phase 2
    # comme en phase 1) ou cache borne ? Et les objets vivants du Compositor.
    name: C22 / memoire contractuelle 6x6, temoin historique
    needs: [preflight-producer]
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - name: Preflight - politique mimalloc du navigateur produit
        run: python3 -m unittest discover -s tools/ci/reliability -p test_c22_purge_runtime.py -v
      - name: QEMU + outils
        run: |
          tools/ci/apt-installe.sh qemu-system-x86 file netcat-openbsd
      - name: Bootimage
        run: tools/ci/build_kernel.sh
      - uses: actions/download-artifact@v4
        with:
          name: bouchaud-ladybird-native-browser
          path: native-browser
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
      - name: Verifier le manifeste et les entrees natives inchangees
        run: tools/ci/verifie_artefact_ladybird.sh entrees native-browser
      - name: Acces a /dev/kvm
        run: |
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Verifier le SHA exact du code teste
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "C22_PROVENANCE_SHA sha=${{ github.sha }}"
      - name: C22 -- validation, 6 repetitions correctif puis 6 temoin (meme binaire)
        env:
          BO_QEMU_KVM: "1"
        run: |
          for bras in correctif temoin; do
            for essai in 1 2 3 4 5 6; do
              t=0; [ "$bras" = temoin ] && t=1
              BO_C22_TEMOIN=$t tools/ci/run_ladybird_memoire.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin native-browser 10 > "memoire-$bras-$essai.sortie" 2>&1 && rc=0 || rc=$?
              cp serie-memoire.log "serie-memoire-$bras-$essai.log"
              {
                echo "=== $bras $essai rc=$rc ==="
                grep -h 'MEMOIRE_PROCESSUS .*image=WebContent\|MEMOIRE_BORNEE\|MEMOIRE_CROISSANCE\|MEMOIRE_INCONCLUSIF\|MEMOIRE_[A-Z_]*ECHEC' "memoire-$bras-$essai.sortie" || true
                echo "LB_C22 lignes=$(grep -ac '\[LB:C22\] collecte' serie-memoire.log) partitions=$(grep -ao '\[LB:C22\] collecte partitions=[0-9]* temoin=[01]' serie-memoire.log | sort | uniq -c | tr -s ' ' | tr '\n' ';')"
                echo "C22_ESSAI bras=$bras essai=$essai rc=$rc"
              } >> c22-validation.txt
              { echo "=== chronologie $bras $essai rc=$rc ==="; python3 tools/ci/c22_chronologie.py serie-memoire.log 70 || true; } >> c22-chronologie.txt
              # Un candidat ROUGE ne sera jamais qualifie par un meilleur temoin.
              # Arreter immediatement pour ne pas gaspiller les autres essais
              # ni les 6 tests negatifs. Les journaux deja produits sont
              # conserves par upload-artifact if:always() ci-dessous.
              if [ "$bras" = correctif ] && [ "$rc" -ne 0 ]; then
                echo "::error::C22_CANDIDAT_ECHEC_PRECOCE essai=$essai rc=$rc"
                grep -E 'MEMOIRE_PROCESSUS .*image=WebContent|MEMOIRE_CROISSANCE|MEMOIRE_INCONCLUSIF|LADYBIRD_MEMOIRE_ECHEC' "memoire-$bras-$essai.sortie" || true
                cat c22-validation.txt
                exit 1
              fi
            done
          done
          cat c22-chronologie.txt
          cat c22-validation.txt
          # BOUCHAUD_C22_AB_RETENTION_APPARIEE_V1
          # Produit: les 6/6 candidats doivent reussir analyse_memoire.py
          # sans changer le seuil 1024 Kio. Temoin: 6 essais reels, verifies
          # avec swaps natifs, mode historique et comparaison M0 -> M2.
          # Le cas de cache plateau est identifie comme RETENTION, pas FUITÉ.
          python3 tools/ci/c22_ab_verdict.py --results . --repetitions 6 --n-par-phase 10 --json c22-ab-verdict.json
          echo "C22_CONTRACTUEL_6X6_OK sha=${{ github.sha }}"
      - name: Journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-memoire
          path: |
            serie-memoire*.log
            fixture-memoire*.log
            memoire-*.sortie
            c22-validation.txt
            c22-ab-verdict.json
            c22-chronologie.txt
            serie-gc-retention.log
            fixture-gc-retention.log
            gc-retention.sortie
          if-no-files-found: warn


  nightly-smoke:
    name: Nightly / produit Ladybird du SHA C22
    needs: [preflight-producer]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prerequis produit Nightly
        run: tools/ci/apt-installe.sh qemu-system-x86 file socat netcat-openbsd
      - name: Cache Cargo noyau
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: c22-nightly-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock','rust-toolchain.toml') }}
          restore-keys: |
            diag-c22-rust-${{ runner.os }}-
            nightly-cargo-${{ runner.os }}-
            cargo-${{ runner.os }}-
      - name: Compiler uniquement le noyau du SHA de ce run
        run: tools/ci/build_kernel.sh
      - name: Recuperer Ladybird produit dans ce meme run
        uses: actions/download-artifact@v4
        with:
          name: bouchaud-ladybird-native-browser
          path: native-browser
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
      - name: Verifier le manifeste et le HEAD exact
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          tools/ci/verifie_artefact_ladybird.sh entrees native-browser
      - name: Smoke du produit Ladybird Nightly
        run: tools/ci/run_ladybird_browser_host.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin native-browser
      - name: Preuves produit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c22-nightly-produit
          path: |
            serie-browser-host.log
            fixture-browser-host.log
          if-no-files-found: warn

  c22-runtime-verdict:
    name: Gate C22 + Nightly / SHA unique / artefact lie
    if: always()
    needs: [preflight-producer, memoire-onglets, nightly-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Fail-closed sur les trois emplois
        env:
          PREFLIGHT: ${{ needs.preflight-producer.result }}
          C22: ${{ needs.memoire-onglets.result }}
          NIGHTLY: ${{ needs.nightly-smoke.result }}
          SHA: ${{ github.sha }}
        run: |
          echo "P13_ETATS c22=$C22 nightly=$NIGHTLY sha=$SHA"
          test "$PREFLIGHT" = success
          test "$C22" = success
          test "$NIGHTLY" = success
          echo "P13_C22_NIGHTLY_SAME_SHA_OK sha=$SHA"
          echo "P13_QUALIFICATION_STRICTE_ENCORE_REQUISE sha=$SHA"
