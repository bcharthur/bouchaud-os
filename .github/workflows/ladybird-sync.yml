name: ladybird-sync

# Suivi upstream: leger, jamais de gros build automatique.
on:
  pull_request:
    paths:
      - 'third_party/UPSTREAM.md'
      - 'tools/ladybird/**'
      - '.github/workflows/ladybird-sync.yml'
  push:
    branches: [main]
    paths:
      - 'third_party/UPSTREAM.md'
      - 'tools/ladybird/**'
      - '.github/workflows/ladybird-sync.yml'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ladybird-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pinned:
    name: upstream / pinned sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Recuperer le SHA epingle
        run: ./tools/ladybird/fetch.sh
      - name: Verifier le SHA
        run: ./tools/ladybird/fetch.sh --verifie
      - name: Licence et forme minimale
        run: |
          set -e
          for path in AK Libraries/LibCore Libraries/LibGC Libraries/LibJS Libraries/LibIPC Services/WebContent vcpkg.json LICENSE; do
            test -e "third_party/ladybird/$path" || { echo "absent: $path" >&2; exit 1; }
          done
          diff -q third_party/ladybird/LICENSE THIRD_PARTY_LICENSES/ladybird-BSD-2-Clause.txt

  upstream-head:
    name: upstream / head info
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Comparer a HEAD upstream
        run: |
          EPINGLE=$(grep -m1 -E '^\s+sha\s+[0-9a-f]{40}' third_party/UPSTREAM.md | awk '{print $2}')
          AMONT=$(git ls-remote https://github.com/LadybirdBrowser/ladybird HEAD | cut -f1)
          echo "epingle=$EPINGLE"
          echo "amont=$AMONT"
          if [ "$EPINGLE" = "$AMONT" ]; then
            echo 'Ladybird est a jour.'
          else
            echo 'Un SHA plus recent existe. Aucun changement automatique n est effectue.'
          fi
