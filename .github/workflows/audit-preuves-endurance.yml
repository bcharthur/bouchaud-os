name: Attribuer tous les réveils archivés SMP4 et SMP8
on:
  push:
    branches: [codex/audit-preuves-endurance]
permissions:
  actions: read
  contents: read
jobs:
  lecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d0c0f43c253f412b3e1efe5664b3a8e4a2c6accf
          path: diagnostic-source
          persist-credentials: false
      - name: Refaire le rapprochement à partir des archives vérifiées
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir sources
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15272179792/zip" > hote.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15273190318/zip" > invites.zip
          sha256sum -c <<'EOF_HASH'
          9b0412c64119447400ac55c5160e252cb63e8e44c0c0381cb5c138c4beb5a44b  hote.zip
          69c032c528ed44b3d8cfb563fe86353e5d6e70a9a6008105d9521de86a2d4a2a  invites.zip
          EOF_HASH
          unzip -q invites.zip -d sources
          PYTHONPATH=diagnostic-source/tools/ci python3 tools/ci/audit_reveils_hote.py hote.zip sources preuves
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attribution-integrale-des-reveils
          path: preuves/
          if-no-files-found: error
