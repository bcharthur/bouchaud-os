name: Auditer les champs ftrace du diagnostic SMP
on:
  push:
    branches: [codex/audit-preuves-endurance]
permissions:
  actions: read
  contents: read
jobs:
  lecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Relire la trace GitHub publiée
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15271214091/zip" > traces.zip
          printf '%s  %s\n' 6e70d094056a09d0f85d2a7e6b82461b8180b5573d4bee6c5388e288bc74896d traces.zip | sha256sum -c -
          mkdir preuves
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import gzip, re, zipfile

          with zipfile.ZipFile('traces.zip') as archive:
              for member in archive.namelist():
                  if not member.endswith('.trace.gz'):
                      continue
                  bras = Path(member).parent.name
                  print(bras, archive.getinfo(member).file_size)
                  with archive.open(member) as fichier, gzip.open(fichier, 'rt') as trace:
                      traces = []
                      comptes = Counter()
                      for i, ligne in enumerate(trace):
                          if i < 7 or re.search(r'\b(sys_(?:enter_)?writev?)\b', ligne):
                              traces.append(ligne)
                          m = re.search(r'\d\.\d+: (\w+)', ligne)
                          if m:
                              comptes[m[1]] += 1
                      (Path('preuves') / f'{bras}.txt').write_text(''.join(traces) + str(comptes) + '\n')
                  if bras in {'smp4-1-hote4', 'smp4-4-hote4'}:
                      (Path('preuves') / f'{bras}.trace.gz').write_bytes(archive.read(member))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: extrait-ftrace
          path: preuves/
          if-no-files-found: error
