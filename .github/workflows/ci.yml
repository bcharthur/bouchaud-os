name: CI Fast

# Barriere courte. Une branche avec PR n'est testee qu'une fois via pull_request.
# Les pushes directs ne relancent cette barriere que sur main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: classify-changes
    runs-on: ubuntu-latest
    outputs:
      workflow: ${{ steps.classify.outputs.workflow }}
      kernel: ${{ steps.classify.outputs.kernel }}
      browser_engine: ${{ steps.classify.outputs.browser_engine }}
      ladybird: ${{ steps.classify.outputs.ladybird }}
      userland: ${{ steps.classify.outputs.userland }}
      windows: ${{ steps.classify.outputs.windows }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classer les changements
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            python3 tools/ci/classify_changes.py --head "$HEAD_SHA" --all
          else
            python3 tools/ci/classify_changes.py --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

  kernel-fast:
    name: kernel / compile + invariants
    needs: changes
    if: needs.changes.outputs.kernel == 'true' || needs.changes.outputs.userland == 'true' || needs.changes.outputs.ladybird == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fast-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            fast-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            fast-cargo-${{ runner.os }}-
            cargo-${{ runner.os }}-
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
      - name: Compiler le noyau
        run: cargo build

      # Clippy n'est PAS un controle de style ici : les 220 avertissements de
      # confort ne font rien echouer. Ce qui echoue, ce sont ses lints
      # « deny par defaut » -- les fautes de correction, comme une comparaison
      # dont un cote est toujours faux. Le depot en portait deux.
      #
      # `cargo fmt --check` n'est deliberement PAS ici : l'arbre en est a
      # 25 000 lignes d'ecart, et le rendre vert demanderait un reformatage
      # massif qui detruirait une mise en page voulue et tout le `git blame`.
      # Un controle qu'on ne peut pas rendre vert sans casser le depot n'est
      # pas une barriere, c'est une alarme qu'on apprend a ignorer.
      - name: Lints de correction (clippy)
        run: |
          rustup component add clippy
          cargo clippy

      # DECOUVERTS, pas enumeres. Cinq garde-fous avaient cesse de fonctionner
      # sans que personne le voie, parce que la liste du workflow ne suivait
      # pas celle du depot. Une regle ajoutee est desormais executee le jour
      # meme.
      - name: Garde-fous d'architecture
        run: tools/ci/run_architecture_guards.sh

      - name: Suites de tests hote
        run: tools/ci/run_host_tests.sh

      # Ce qui a ete gagne ne doit pas se reperdre : un site d'acquisition du
      # gros verrou rajoute dans un sous-systeme qu'on venait d'alleger
      # n'echoue a aucun test, et annule pourtant le travail.
      - name: Budgets d'architecture
        run: python3 tools/ci/check_budgets.py

      - name: Ownership des entrees Ladybird
        run: tools/ladybird/test-input-ownership.sh

      # Le service ring 3 est freestanding : le compiler ici coute quelques
      # secondes et attrape ce qu'aucun test hote ne verra -- un en-tete qui ne
      # compile plus pour la cible ring 3, une charge utile dont la taille a
      # bouge d'un cote seulement. Le tranchant complet tourne sous QEMU dans
      # `native-ipc-runtime`.
      - name: Compositeur ring 3 (compilation freestanding)
        run: bash userland/services/composited/build.sh

  browser-engine:
    name: browser / engine tests
    needs: changes
    if: needs.changes.outputs.browser_engine == 'true' || needs.changes.outputs.userland == 'true' || needs.changes.outputs.ladybird == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependances de verification
        run: python -m pip install --upgrade pillow cryptography cffi
      - name: Cache QuickJS
        uses: actions/cache@v4
        with:
          path: |
            tools/userland/build-quickjs
            tools/userland/out-quickjs
          key: quickjs-${{ runner.os }}-${{ hashFiles('tools/userland/build-quickjs.sh') }}
      - name: QuickJS
        run: tools/userland/build-quickjs.sh
      - name: Tests moteur
        env:
          BO_AUDIT_PRIVILEGES: tools/userland/navigateur/tests/audit-privileges.json
        run: tools/userland/test-moteur.sh
      - name: Audit privileges stable
        run: git diff --exit-code -- tools/userland/navigateur/tests/audit-privileges.json
      - name: Jalons sans regression
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          path = 'tools/userland/navigateur/tests/jalons.json'
          courant = json.load(open(path, encoding='utf-8'))
          reference = json.loads(subprocess.run(
              ['git', 'show', f'HEAD:{path}'], capture_output=True, text=True, check=True
          ).stdout)
          recules = sorted(n for n, ok in reference.items() if ok and not courant.get(n))
          if recules:
              sys.exit('jalons perdus: ' + ', '.join(recules))
          print(f'{len(courant)} jalons, aucune regression')
          PY

  windows-scripts:
    name: windows / scripts
    needs: changes
    if: needs.changes.outputs.windows == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Selectionner les scripts PowerShell a verifier
        id: ps1
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Sur pull_request, github.sha est le merge commit synthetique.
          # Pour mesurer exactement la PR, on compare avec son vrai head SHA.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          : > .ci-powershell-files

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMR \
              "$BASE_SHA...$HEAD_SHA" -- '*.ps1' > .ci-powershell-files
          else
            # Push main et workflow_dispatch restent des controles globaux.
            git ls-files '*.ps1' > .ci-powershell-files
          fi

          echo "Scripts PowerShell a verifier :"
          cat .ci-powershell-files
          count=$(grep -cve '^[[:space:]]*$' .ci-powershell-files || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "count=$count"

      - name: ASCII strict
        if: steps.ps1.outputs.count != '0'
        run: python3 tools/verifie-scripts-windows.py --files-from .ci-powershell-files

      - name: Syntaxe PowerShell
        if: steps.ps1.outputs.count != '0'
        shell: pwsh
        run: |
          $echecs = 0
          $fichiers = Get-Content -LiteralPath .ci-powershell-files |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

          foreach ($chemin in $fichiers) {
            $erreurs = $null
            $jetons = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $chemin),
              [ref]$jetons,
              [ref]$erreurs
            ) | Out-Null

            if ($erreurs -and $erreurs.Count) {
              $echecs++
              Write-Host "ECHEC $chemin"
              $erreurs | Select-Object -First 5 | ForEach-Object {
                Write-Host $_.Message
              }
            }
          }

          if ($echecs) { exit 1 }

      - name: Aucun script PowerShell modifie
        if: steps.ps1.outputs.count == '0'
        run: echo 'Aucun .ps1 modifie par cette PR ; dette historique non bloquante ici.'

  policy:
    name: ci / policy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Regles CI v2
        run: python3 tools/ci/check_pipeline_policy.py

  fast-gate:
    name: fast-gate
    if: always()
    needs: [changes, kernel-fast, browser-engine, windows-scripts, policy]
    runs-on: ubuntu-latest
    steps:
      - name: Verdict unique pour branch protection
        env:
          CHANGES: ${{ needs.changes.result }}
          KERNEL: ${{ needs.kernel-fast.result }}
          BROWSER: ${{ needs.browser-engine.result }}
          WINDOWS: ${{ needs.windows-scripts.result }}
          POLICY: ${{ needs.policy.result }}
        run: |
          printf '%-12s %s\n' changes "$CHANGES" kernel "$KERNEL" browser "$BROWSER" windows "$WINDOWS" policy "$POLICY"
          for r in "$CHANGES" "$KERNEL" "$BROWSER" "$WINDOWS" "$POLICY"; do
            [ "$r" != failure ] && [ "$r" != cancelled ] || exit 1
          done
          echo FAST_GATE_OK
