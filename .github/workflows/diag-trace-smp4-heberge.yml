name: Réveils TCG SMP4/SMP8 et contention hôte appariée
on:
  push:
    branches: [codex/trace-smp4-heberge]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Installer les dépendances Ubuntu signées
        run: |
          args=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Update::Error-Mode=any -o Acquire::Retries=3)
          sudo apt-get "${args[@]}" update
          sudo apt-get "${args[@]}" install -y --no-install-recommends qemu-system-x86 musl-tools build-essential
      - name: Construire le BIOS instrumenté et le scénario
        run: |
          mkdir preuves
          {
            git rev-parse HEAD
            lscpu
            lscpu -e=CPU,CORE,SOCKET,ONLINE
            taskset -pc $$
            qemu-system-x86_64 --version
            cat /proc/self/cgroup
            cat /sys/fs/cgroup/cpu.max /proc/pressure/cpu
            qemu-system-x86_64 -trace help
          } > preuves/hote.txt
          cargo bootimage --version || cargo install bootimage --locked
          BOUCHAUD_BUILD_COMMIT="$(git rev-parse --short=12 HEAD)" cargo bootimage --features diag-trace-reveil
          tools/ci/fabrique-scenario-endurance.sh scenario
          sed -i '1i export BO_ORDO_TRACE_FILE=/ordo-trace.txt' scenario/scenario/autorun
          for copie in 1 2 3; do
            printf 'echo TRACE_EXPORT_COPIE_%s\ncat /ordo-trace.txt\n' "$copie"
          done >> scenario/scenario/autorun
          printf 'echo TRACE_EXPORT_FIN\n' >> scenario/scenario/autorun
          touch scenario/scenario/garde-vm-vivante
          (cd tools/userland && IMAGE="$GITHUB_WORKSPACE/scenario/endurance.img" ./mkdisk.sh "$GITHUB_WORKSPACE/scenario/scenario")
          sha256sum target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin scenario/endurance.img > preuves/inputs.sha256
      - name: Alterner les mêmes boots avec quatre et deux CPU Linux
        run: |
          set -uo pipefail
          target=target/x86_64-bouchaud_os/debug
          if ! sudo -n test -r /sys/kernel/tracing/events/sched/sched_switch/enable; then
            sudo -n mount -t tracefs nodev /sys/kernel/tracing
          fi
          rc=0
          for smp in 4 8; do
            serie=0
            for cpus in 4 2 2 4; do
              serie=$((serie + 1))
              dir="preuves/smp$smp-$serie-hote$cpus"
              mkdir "$dir"
              if python3 tools/ci/capture_trace_reveil_qemu.py "$target/bouchaud-os" \
                   "$target/bootimage-bouchaud-os.bin" scenario/endurance.img "$dir" \
                   --smp "$smp" --hote-cpus "$cpus" --trace-hote &&
                 python3 tools/ci/analyse_trace_reveil.py "$dir/BO_TRACE_REVEIL_TOTAL" \
                   "$dir/BO_TRACE_REVEIL" "$dir/echantillons.txt" "$dir/quantiles.csv" \
                   --file "$dir/BO_TRACE_FILE_TOTAL" "$dir/BO_TRACE_FILE" --horloge "$dir" &&
                 python3 tools/ci/trace_hote_reveil.py "$dir"; then
                printf '%s COLLECTE_OK\n' "$dir" | tee -a preuves/collecte.txt
              else
                printf '%s COLLECTE_INCOMPLETE\n' "$dir" | tee -a preuves/collecte.txt
                rc=1
                # Si le traceur ne démarre pas, répéter le même refus ne
                # produit aucune information.
                if [ ! -s "$dir/serial.log" ]; then break 2; fi
              fi
              if [ -f "$dir/hote.trace" ]; then gzip -1 "$dir/hote.trace"; fi
            done
          done
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attribution-reveils-tcg
          path: |
            preuves/
            !preuves/**/*.trace.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-linux-reveils-tcg
          path: preuves/**/*.trace.gz
          if-no-files-found: ignore
