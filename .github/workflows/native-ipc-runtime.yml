name: Native IPC Runtime

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-ipc-runtime:
    name: native-ipc-runtime
    runs-on: ubuntu-24.04
    # 30 min, plus le bureau ring 3 (deux demarrages QEMU, ~3 min sous TCG)
    # et ses entrees (un demarrage, ~4 min sous TCG), et le bureau utilisable
    # (un demarrage, ~5 min sous TCG).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: native-ipc-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            native-ipc-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-

      - name: QEMU + toolchains de sondes
        run: |
          tools/ci/apt-installe.sh \
            qemu-system-x86 \
            musl-tools \
            build-essential \
            binutils \
            file

      - name: Construire Bouchaud OS
        run: tools/ci/build_kernel.sh

      - name: Preuve ABI/IPC native depuis ring3
        run: |
          bash tools/ci/run_native_ipc_probe.sh \
            target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin

      # BOUCHAUD_BUREAU_RING3_2A : une application BOGU ordinaire (mire-gpu,
      # son propre processus) composee par `composited` ring 3 ; capture QEMU
      # decodee au pixel, refus de securite du pont, bureau noyau refuse, client
      # tue par une faute de page, A/B avec le bureau noyau sur le meme client.
      - name: Bureau ring 3 -- une vraie fenetre composee par composited (TCG)
        run: |
          bash tools/ci/run_bureau_ring3.sh \
            target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin target/bureau-ring3

      # BOUCHAUD_ENTREES_RING3_V1 : de vrais gestes QEMU (moniteur) routes par
      # composited ring 3 -- clic -> foyer -> l'application recoit appui et
      # relachement ; glisser de la barre ; frappes a la fenetre active ; une
      # application plante (faute de page) et les entrees continuent ; case de
      # fermeture ; 9 refus de `bo_fenetre_entree`.
      - name: Bureau ring 3 -- entrees souris/clavier routees par composited (TCG)
        run: |
          python3 tools/ci/banc_bureau_ring3_entrees.py \
            --boot target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin \
            --sortie target/bureau-ring3-entrees

      # BOUCHAUD_BUREAU_UTILISABLE_V1 : une image de test complete SANS bureau
      # noyau. Dock -> la calculatrice (application ring 3) s'ouvre ; calcul a
      # la souris et au clavier ; deplacer, redimensionner, fermer, rouvrir ;
      # une autre application plante ; le compositeur plante et le noyau le
      # relance. Captures PNG dans l'artefact.
      - name: Bureau ring 3 utilisable -- dock, calculatrice, reprise du compositeur (TCG)
        run: |
          python3 tools/ci/banc_bureau_utilisable.py \
            --boot target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin \
            --sortie target/bureau-utilisable

      # BOUCHAUD_CALCULATRICE_RING3_V1 : le BUREAU NOYAU ouvre la Calculatrice
      # par son chemin reel ; c'est le processus ring 3 /bin/calculatrice-gui
      # (src/gui/apps/calculator.rs est supprime), et il calcule au clavier.
      - name: Bureau noyau -- la Calculatrice est l'application ring 3 (TCG)
        run: |
          python3 tools/ci/banc_calculatrice_bureau_noyau.py \
            --boot target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin \
            --sortie target/calculatrice-bureau-noyau

      # BOUCHAUD_NOTES_RING3_V1 : Notes est l'application ring 3
      # /bin/notes-gui, dessinee avec la police d'Atelier publiee par le noyau ;
      # saisie, F2 (fsync), F3 (relecture) dans le vrai bureau.
      - name: Bureau noyau -- Notes est l'application ring 3 (TCG)
        run: |
          python3 tools/ci/banc_notes_bureau.py \
            --boot target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin \
            --sortie target/notes-bureau

      # BOUCHAUD_JOURNAL_RING3_V1 : le Journal est l'application ring 3
      # /bin/journal-gui ; le noyau ne fait que publier la trace
      # (/proc/bouchaud/journal, capacite DEBUG). Filtre et recapture au
      # clavier dans le vrai bureau.
      - name: Bureau noyau -- le Journal est l'application ring 3 (TCG)
        run: |
          python3 tools/ci/banc_journal_bureau.py \
            --boot target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin \
            --sortie target/journal-bureau

      # BOUCHAUD_NATIVE_SERVICES_V1 : service ring 3 supervise (spawn natif,
      # crash injecte, hang, budget, arret, fuite de handles) et refus des
      # cycles d'objets natifs. SMP1 et SMP4 sur le MEME noyau.
      - name: Services natifs supervises (SMP4 puis SMP1)
        run: |
          B=target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
          OUT=target/native-services-ci bash tools/ci/run_native_services.sh "$B" 4
          OUT=target/native-services-ci bash tools/ci/run_native_services.sh "$B" 1

      # BOUCHAUD_PERSIST_COUPURE_V1 : coupures SIGKILL pendant ecrire/fsync/
      # rename/fsync(rep) ; ancienne OU nouvelle version, jamais un melange,
      # jamais plus ancienne que la derniere version acquittee.
      - name: Coupures d'alimentation pendant l'ecriture atomique (8 cycles)
        run: |
          B=target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
          COUPURE_SORTIE=target/coupure-persistance bash tools/ci/run_coupure_persistance.sh "$B" 8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ipc-runtime-proof
          path: |
            target/native-ipc-runtime-ci/native-ipc-runtime.log
            target/native-services-ci/native-services-smp*.log
            target/coupure-persistance/boot-*.log
            target/bureau-ring3/*/serie.log
            target/bureau-ring3/*/*.ppm
            target/bureau-ring3-entrees/serie.log
            target/bureau-utilisable/serie.log
            target/bureau-utilisable/*.png
            target/calculatrice-bureau-noyau/serie.log
            target/calculatrice-bureau-noyau/*.png
          if-no-files-found: error
          retention-days: 14

  ab-rollback:
    uses: ./.github/workflows/system-update.yml

  native-ipc-verdict:
    # BOUCHAUD_CI_UN_BUILD_PAR_SHA_V2 : le verdict, jamais saute -- execute ici,
    # ou reflete du run push du meme arbre.
    name: native-ipc / verdict
    needs: [native-ipc-runtime, ab-rollback]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Verdict des preuves IPC et mise à jour
        env:
          R_RUNTIME: ${{ needs.native-ipc-runtime.result }}
          R_AB: ${{ needs.ab-rollback.result }}
        run: |
          [ "$R_RUNTIME" = success ] && [ "$R_AB" = success ] || exit 1
          echo NATIVE_IPC_VERDICT_OK
