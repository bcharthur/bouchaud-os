name: Native IPC Runtime

on:
  pull_request:
    paths:
      - 'src/arch/x86_64/usermode.rs'
      - 'src/kernel/native/**'
      - 'src/kernel/object/handle.rs'
      - 'tools/native/**'
      - 'tools/userland/native-ipc-probe.c'
      - 'tools/userland/native-ipc-ring3-probe.c'
      - 'userland/services/composited/**'
      - 'tools/userland/build-native-ipc-ring3-probe.sh'
      - 'tools/ci/run_native_ipc_probe.sh'
      - 'tools/ci/reliability/**'
      - '.github/workflows/native-ipc-runtime.yml'
  push:
    branches: [main, 'claude/**', 'feat/**']
    paths:
      - 'src/arch/x86_64/usermode.rs'
      - 'src/kernel/native/**'
      - 'src/kernel/object/handle.rs'
      - 'tools/native/**'
      - 'tools/userland/native-ipc-probe.c'
      - 'tools/userland/native-ipc-ring3-probe.c'
      - 'userland/services/composited/**'
      - 'tools/userland/build-native-ipc-ring3-probe.sh'
      - 'tools/ci/run_native_ipc_probe.sh'
      - '.github/workflows/native-ipc-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ipc-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dedoublonne:
    # BOUCHAUD_CI_UN_BUILD_PAR_SHA_V1 : le run PR d'une branche de ce depot
    # refait-il le run push du MEME arbre (tete = fusion, run push vivant) ?
    # Voir tools/ci/dedoublonne_pr.py. Les jobs racines en dependent et
    # tournent si la decision manque (`!cancelled()`). Pas sur les workflows
    # dont un gate est un check requis de `main` (configure_protection.ps1) :
    # un job saute y compterait comme reussi.
    name: dedoublonne push/PR
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      doublon: ${{ steps.decision.outputs.doublon }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          sparse-checkout: tools/ci/dedoublonne_pr.py
          sparse-checkout-cone-mode: false
      - id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          EVENEMENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          DEPOT: ${{ github.repository }}
          DEPOT_TETE: ${{ github.event.pull_request.head.repo.full_name }}
          TETE: ${{ github.event.pull_request.head.sha }}
          FUSION: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          if [ "$EVENEMENT" = pull_request ]; then
            python3 tools/ci/dedoublonne_pr.py
          else
            echo "DEDOUBLONNE doublon=false raison=evenement $EVENEMENT"
            echo doublon=false >> "$GITHUB_OUTPUT"
          fi

  native-ipc-runtime:
    needs: dedoublonne
    if: ${{ !cancelled() && needs.dedoublonne.outputs.doublon != 'true' }}
    name: native-ipc-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: native-ipc-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            native-ipc-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-

      - name: QEMU + toolchains de sondes
        run: |
          tools/ci/apt-installe.sh \
            qemu-system-x86 \
            musl-tools \
            build-essential \
            binutils \
            file

      - name: Construire Bouchaud OS
        run: tools/ci/build_kernel.sh

      - name: Preuve ABI/IPC native depuis ring3
        run: |
          bash tools/ci/run_native_ipc_probe.sh \
            target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ipc-runtime-proof
          path: |
            target/native-ipc-runtime-ci/native-ipc-runtime.log
          if-no-files-found: error
          retention-days: 14
