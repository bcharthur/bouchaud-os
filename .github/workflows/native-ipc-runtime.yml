name: Native IPC Runtime

on:
  pull_request:
    paths:
      - 'src/kernel/process/**'
      - 'src/kernel/scheduler/**'
      - 'src/kernel/time/**'
      - 'src/arch/x86_64/idt/**'
      - 'src/arch/x86_64/idt.rs'
      - 'src/arch/x86_64/cpu_local.rs'
      - 'src/arch/x86_64/irq_context.rs'
      - 'src/arch/x86_64/smp.rs'
      - 'src/arch/x86_64/usermode.rs'
      - 'src/kernel/native/**'
      - 'src/kernel/object/handle.rs'
      - 'tools/native/**'
      - 'tools/userland/native-ipc-probe.c'
      - 'tools/userland/native-ipc-ring3-probe.c'
      - 'userland/services/composited/**'
      - 'userland/services/**'
      - 'userland/libs/**'
      - 'userland/tests/**'
      - 'tools/ci/run_native_services.sh'
      - 'tools/ci/verifie_sdk_abi.py'
      - 'tools/native/make_native_image.py'
      - 'tools/verifie-contrat-abi-v1.py'
      - 'tools/architecture/abi-v1-contract.json'
      - 'src/kernel/security/**'
      - 'tools/userland/build-native-ipc-ring3-probe.sh'
      - 'tools/ci/run_native_ipc_probe.sh'
      - 'tools/ci/reliability/**'
      - 'system/update-core/**'
      - 'src/kernel/update/**'
      - 'tools/update/**'
      - 'tools/reference/uefi-preboot-probe/**'
      - 'tools/reference/uefi-image-builder/**'
      - 'tools/ci/run_ab_rollback.sh'
      - 'src/drivers/usb/**'
      - 'src/drivers/api/bloc.rs'
      - 'src/platform/pc/stage2.rs'
      - 'src/boot/**'
      - 'src/fs/persistance/**'
      - 'src/compat/linux/mod.rs'
      - 'tools/userland/persist-coupure-probe.c'
      - 'tools/ci/run_coupure_persistance.sh'
      - '.github/workflows/native-ipc-runtime.yml'
  push:
    branches: [main, 'claude/**', 'feat/**', 'audit/p13-console-sync-ci-20261024']
    paths:
      - 'src/kernel/process/**'
      - 'src/kernel/scheduler/**'
      - 'src/kernel/time/**'
      - 'src/arch/x86_64/idt/**'
      - 'src/arch/x86_64/idt.rs'
      - 'src/arch/x86_64/cpu_local.rs'
      - 'src/arch/x86_64/irq_context.rs'
      - 'src/arch/x86_64/smp.rs'
      - 'src/arch/x86_64/usermode.rs'
      - 'src/kernel/native/**'
      - 'src/kernel/object/handle.rs'
      - 'tools/native/**'
      - 'tools/userland/native-ipc-probe.c'
      - 'tools/userland/native-ipc-ring3-probe.c'
      - 'userland/services/composited/**'
      - 'userland/services/**'
      - 'userland/libs/**'
      - 'userland/tests/**'
      - 'tools/ci/run_native_services.sh'
      - 'tools/ci/verifie_sdk_abi.py'
      - 'tools/native/make_native_image.py'
      - 'tools/verifie-contrat-abi-v1.py'
      - 'tools/architecture/abi-v1-contract.json'
      - 'src/kernel/security/**'
      - 'tools/userland/build-native-ipc-ring3-probe.sh'
      - 'tools/ci/run_native_ipc_probe.sh'
      - 'system/update-core/**'
      - 'src/kernel/update/**'
      - 'tools/update/**'
      - 'tools/reference/uefi-preboot-probe/**'
      - 'tools/reference/uefi-image-builder/**'
      - 'tools/ci/run_ab_rollback.sh'
      - 'src/drivers/usb/**'
      - 'src/drivers/api/bloc.rs'
      - 'src/platform/pc/stage2.rs'
      - 'src/boot/**'
      - 'src/fs/persistance/**'
      - 'src/compat/linux/mod.rs'
      - 'tools/userland/persist-coupure-probe.c'
      - 'tools/ci/run_coupure_persistance.sh'
      - '.github/workflows/native-ipc-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ipc-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dedoublonne:
    # BOUCHAUD_CI_UN_BUILD_PAR_SHA_V2 : le run PR d'une branche de ce depot
    # peut-il REFLETER le run push du meme arbre au lieu de le refaire ? Voir
    # tools/ci/dedoublonne_pr.py. Les jobs racines en dependent et tournent si
    # la decision manque (`!cancelled()`). Le job de verdict, lui, n'est JAMAIS
    # saute : il attend la conclusion finale du run push et la reflete -- un
    # echec bloque, un run annule ou saute ne prouve rien. Pas sur les
    # workflows dont un gate est un check requis de `main`.
    name: dedoublonne push/PR
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      reutilise: ${{ steps.decision.outputs.reutilise }}
      source_run: ${{ steps.decision.outputs.source_run }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          sparse-checkout: tools/ci/dedoublonne_pr.py
          sparse-checkout-cone-mode: false
      - id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          EVENEMENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          DEPOT: ${{ github.repository }}
          DEPOT_TETE: ${{ github.event.pull_request.head.repo.full_name }}
          TETE: ${{ github.event.pull_request.head.sha }}
          FUSION: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          if [ "$EVENEMENT" = pull_request ]; then
            python3 tools/ci/dedoublonne_pr.py
          else
            echo "DEDOUBLONNE reutilise=false raison=evenement $EVENEMENT"
            echo reutilise=false >> "$GITHUB_OUTPUT"
          fi

  native-ipc-runtime:
    needs: dedoublonne
    if: ${{ !cancelled() && needs.dedoublonne.outputs.reutilise != 'true' }}
    name: native-ipc-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: native-ipc-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            native-ipc-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-

      - name: QEMU + toolchains de sondes
        run: |
          tools/ci/apt-installe.sh \
            qemu-system-x86 \
            musl-tools \
            build-essential \
            binutils \
            file

      - name: Construire Bouchaud OS
        run: tools/ci/build_kernel.sh

      - name: Preuve ABI/IPC native depuis ring3
        run: |
          bash tools/ci/run_native_ipc_probe.sh \
            target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin

      # BOUCHAUD_NATIVE_SERVICES_V1 : service ring 3 supervise (spawn natif,
      # crash injecte, hang, budget, arret, fuite de handles) et refus des
      # cycles d'objets natifs. SMP1 et SMP4 sur le MEME noyau.
      - name: Services natifs supervises (SMP4 puis SMP1)
        run: |
          B=target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
          OUT=target/native-services-ci bash tools/ci/run_native_services.sh "$B" 4
          OUT=target/native-services-ci bash tools/ci/run_native_services.sh "$B" 1

      # BOUCHAUD_PERSIST_COUPURE_V1 : coupures SIGKILL pendant ecrire/fsync/
      # rename/fsync(rep) ; ancienne OU nouvelle version, jamais un melange,
      # jamais plus ancienne que la derniere version acquittee.
      - name: Coupures d'alimentation pendant l'ecriture atomique (8 cycles)
        run: |
          B=target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
          COUPURE_SORTIE=target/coupure-persistance bash tools/ci/run_coupure_persistance.sh "$B" 8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ipc-runtime-proof
          path: |
            target/native-ipc-runtime-ci/native-ipc-runtime.log
            target/native-services-ci/native-services-smp*.log
            target/coupure-persistance/boot-*.log
          if-no-files-found: error
          retention-days: 14

  ab-rollback:
    # BOUCHAUD_LOADER_AB_V1 : le chargeur A/B sous OVMF, un QEMU par boot sur le
    # MEME disque, coupure SIGKILL a chaque boot. Candidat qui panique, candidat
    # qui gele, une copie META corrompue (chacune), les deux corrompues ; puis
    # le commit de sante par serviced (sante) et son refus quand un service
    # critique du candidat echoue (sante-ko) ; enfin la mise a jour de bout en
    # bout par `updated` en ring 3, refus de capacite compris (mise-a-jour) ;
    # la recovery : META illisible, touche R + rollback manuel, echecs repetes
    # du slot actif.
    needs: dedoublonne
    if: ${{ !cancelled() && needs.dedoublonne.outputs.reutilise != 'true' }}
    name: ab-rollback (${{ matrix.scenario }}, ${{ matrix.support }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scenario: [panique, gel, meta-0, meta-1, meta-2, sante, sante-ko, mise-a-jour, mise-a-jour-morts, sans-cle, recovery-requise, recovery-rollback, echecs-repetes]
        support: [nvme]
        # BOUCHAUD_USB_VIDANGE_REELLE_V1 / BOUCHAUD_USB_LIAISON_SUPPORT_V1 : le
        # disque A/B sur une cle USB. sante : commit accepte (vidange prouvee) ;
        # sans-vidange : temoin negatif, aucun commit ; seconde-cle : une
        # seconde cle qui refuse la vidange ne retire rien a la cle A/B.
        include:
          - scenario: sante
            support: usb
          - scenario: sans-vidange
            support: usb
          - scenario: seconde-cle
            support: usb-deux
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tools/reference/uefi-preboot-probe/target
          key: ab-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            ab-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-
      - name: QEMU + OVMF
        run: tools/ci/apt-installe.sh qemu-system-x86 ovmf
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-uefi
      - name: Rollback A/B (${{ matrix.scenario }}, ${{ matrix.support }})
        env:
          BO_AB_SUPPORT: ${{ matrix.support }}
        run: bash tools/ci/run_ab_rollback.sh "${{ matrix.scenario }}" target/ab-rollback
      # Diagnostic best-effort: ne modifie aucun verdict A/B ni aucune
      # assertion. L'analyse par boot ne fabrique jamais un lien causal.
      - name: Chronologie USB/SMP/A-B par boot (rapport facultatif)
        if: always()
        continue-on-error: true
        run: |
          if compgen -G 'target/ab-rollback/boot-*.log' >/dev/null; then
            python3 tools/health/incident_timeline.py target/ab-rollback \
              --output target/ab-rollback/incident-timeline.json
          else
            echo "AB_DIAG_NOTE aucun_log_disponible"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-rollback-${{ matrix.scenario }}-${{ matrix.support }}
          path: |
            target/ab-rollback/boot-*.log
            target/ab-rollback/incident-timeline.json
          if-no-files-found: error
          retention-days: 14

  native-ipc-verdict:
    # BOUCHAUD_CI_UN_BUILD_PAR_SHA_V2 : le verdict, jamais saute -- execute ici,
    # ou reflete du run push du meme arbre.
    name: native-ipc / verdict
    needs: [dedoublonne, native-ipc-runtime, ab-rollback]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        if: needs.dedoublonne.outputs.reutilise == 'true'
        with:
          sparse-checkout: tools/ci/dedoublonne_pr.py
          sparse-checkout-cone-mode: false
      - name: Verdict reflete du run push du meme arbre
        if: needs.dedoublonne.outputs.reutilise == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          TETE: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          SOURCE: ${{ needs.dedoublonne.outputs.source_run }}
        run: python3 tools/ci/dedoublonne_pr.py attend --run "$SOURCE" --job "native-ipc / verdict" --delai 6600 --pas 60
      - name: Verdict execute
        if: needs.dedoublonne.outputs.reutilise != 'true'
        env:
          R_RUNTIME: ${{ needs.native-ipc-runtime.result }}
          R_AB: ${{ needs.ab-rollback.result }}
          R_DEDOUBLONNE: ${{ needs.dedoublonne.result }}
        run: |
          echo "native-ipc-runtime=$R_RUNTIME ab-rollback=$R_AB dedoublonne=$R_DEDOUBLONNE"
          [ "$R_RUNTIME" = success ] || { echo "NATIVE_IPC_VERDICT_ECHEC runtime=$R_RUNTIME"; exit 1; }
          [ "$R_AB" = success ] || { echo "NATIVE_IPC_VERDICT_ECHEC ab-rollback=$R_AB"; exit 1; }
          echo NATIVE_IPC_VERDICT_OK
