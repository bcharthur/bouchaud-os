name: Reliability V3

on:
  # BOUCHAUD_GATE_TOUJOURS_PRODUIT_V1 : PAS de filtre de chemins sur les PR.
  # `reliability-gate` est un check REQUIS de `main` ; un workflow filtre ne
  # produit aucun check sur une PR documentaire, qui resterait bloquee en
  # attente pour toujours. Le job `changes` classe le diff : une PR strictement
  # documentaire (tools/ci/classify_changes.py, docs_only) ne lance aucun job
  # QEMU et le gate le DIT (RELIABILITY_GATE_DOCS_ONLY), au lieu de pretendre
  # avoir teste quoi que ce soit.
  pull_request:
  # NIVEAU B (BOUCHAUD_CI_TROIS_NIVEAUX_V1) : plus de push de branche de
  # travail, que le run PR refaisait sur le meme arbre (19 doublons sur 24 SHA
  # releves du 14 au 17/11). Apres fusion, `main` est requalifie par push.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/**'
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: reliability / classify-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENEMENT: ${{ github.event_name }}
        run: |
          if [ "$EVENEMENT" = pull_request ]; then
            python3 tools/ci/classify_changes.py --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            # push/schedule/dispatch : jamais de raccourci documentaire.
            echo docs_only=false >> "$GITHUB_OUTPUT"
          fi

  # BOUCHAUD_CI_TROIS_NIVEAUX_V1 : l'ancien job `reliability / host` relancait
  # EXACTEMENT les scripts de CI Fast (run_architecture_guards.sh,
  # run_host_tests.sh, check_budgets.py, check_pipeline_policy.py) sur le meme
  # SHA, push et PR : quatre executions des tests hote par commit. Ils restent
  # exiges avant fusion par `fast-gate` (check requis, publie sur la tete de la
  # PR par le push). Le binaire analyse par le garde de profondeur de pile est
  # desormais le noyau par defaut dans CI Fast, comme il l'etait ici.

  property-fuzz:
    name: reliability / property fuzz
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # DECOUVERTES, et non enumerees.
      #
      # Ce job ne connaissait qu'une suite : `test_rendezvous_property.rs`. En
      # ajouter une seconde demandait de modifier ce fichier, ce que personne
      # ne pense a faire -- et une suite de fuzzing qui n'est pas lancee ne
      # protege rien tout en donnant l'impression du contraire.
      #
      # Toute suite nommee `test_*_property.rs` ou `test_*_fuzz.rs` est
      # desormais compilee et rejouee sur soixante-quatre graines. La graine
      # d'un echec est imprimee : il se rejoue a l'identique.
      - name: 64 graines par suite de propriete
        run: |
          set -uo pipefail
          suites=$(find tools -name 'test_*_property.rs' -o -name 'test_*_fuzz.rs' | sort)
          if [ -z "$suites" ]; then
            echo "aucune suite de propriete : ce job ne verifie rien"
            exit 1
          fi
          echecs=0
          for source in $suites; do
            nom=$(basename "$source" .rs)
            echo "=== $nom"
            if ! rustc --edition 2021 --test -O -o "/tmp/$nom" "$source"; then
              echo "COMPILATION $nom"
              echecs=$((echecs + 1))
              continue
            fi
            for seed in $(seq 1 64); do
              if ! BOUCHAUD_PROP_SEED="$seed" "/tmp/$nom" --test-threads=1 >"/tmp/$nom.out" 2>&1; then
                echo "ECHEC $nom graine=$seed"
                echo "  rejouable par : BOUCHAUD_PROP_SEED=$seed /tmp/$nom"
                sed 's/^/    /' "/tmp/$nom.out" | awk 'NR<=30'
                echecs=$((echecs + 1))
                break
              fi
            done
            echo "  64 graines vertes"
          done
          echo
          echo "suites de propriete en echec : $echecs"
          [ "$echecs" -eq 0 ]

  build:
    name: reliability / bootimage
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: reliability-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            reliability-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-
      - name: Construire
        run: tools/ci/build_kernel.sh
      - name: Publication intermediaire
        run: |
          mkdir -p publication
          cp target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin publication/
          python3 tools/ci/release_manifest.py \
            publication/bootimage-bouchaud-os.bin \
            --sortie publication/release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: reliability-bootimage
          path: publication/
          if-no-files-found: error
          retention-days: 7

  smp:
    name: reliability / qemu SMP${{ matrix.cpu }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        cpu: [1, 2, 4, 8]
    steps:
      - uses: actions/checkout@v4
      - name: QEMU
        run: |
          tools/ci/apt-installe-ubuntu.sh qemu-system-x86
      - uses: actions/download-artifact@v4
        with:
          name: reliability-bootimage
          path: image
      - name: Boot + scan fail-closed
        run: |
          python3 tools/ci/reliability/qemu_matrix.py \
            image/bootimage-bouchaud-os.bin \
            --cpus ${{ matrix.cpu }} \
            --seconds 45 \
            --out-dir reliability-qemu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-smp${{ matrix.cpu }}
          path: reliability-qemu/
          if-no-files-found: error

  nightly-soak:
    name: reliability / hosted soak 20m
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: QEMU
        run: |
          tools/ci/apt-installe-ubuntu.sh qemu-system-x86
      - uses: actions/download-artifact@v4
        with:
          name: reliability-bootimage
          path: image
      - name: Soak SMP4
        run: |
          python3 tools/ci/reliability/soak.py \
            image/bootimage-bouchaud-os.bin \
            --cpus 4 \
            --duration-seconds 1200 \
            --cycle-seconds 120 \
            --out-dir reliability-soak
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-hosted-soak
          path: reliability-soak/
          if-no-files-found: error
          retention-days: 14

  reliability-gate:
    name: reliability-gate
    if: always()
    needs: [changes, property-fuzz, build, smp, nightly-soak]
    runs-on: ubuntu-24.04
    steps:
      - name: Verdict
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          EVENEMENT: ${{ github.event_name }}
          PROP: ${{ needs.property-fuzz.result }}
          BUILD: ${{ needs.build.result }}
          SMP: ${{ needs.smp.result }}
          SOAK: ${{ needs.nightly-soak.result }}
        run: |
          printf '%-10s %s\n' changes "$CHANGES" property "$PROP" build "$BUILD" smp "$SMP" soak "$SOAK"
          [ "$CHANGES" = success ] || exit 1
          if [ "$EVENEMENT" = pull_request ] && [ "$DOCS_ONLY" = true ]; then
            # Aucun fichier executable modifie : rien a qualifier, et le
            # verdict le dit. Ce n'est pas RELIABILITY_GATE_OK.
            echo RELIABILITY_GATE_DOCS_ONLY
            exit 0
          fi
          for r in "$PROP" "$BUILD" "$SMP"; do
            [ "$r" = success ] || exit 1
          done
          if [ "$SOAK" != skipped ] && [ "$SOAK" != success ]; then
            exit 1
          fi
          echo RELIABILITY_GATE_OK
