name: Endurance hebdomadaire

# LES QUATRE NIVEAUX DE CAMPAGNE, ET CE QUE CELUI-CI AJOUTE
#
#   1. PR courte     -- `ci.yml`, quelques minutes, bloquante ;
#   2. main          -- `integration.yml` + `reliability-v3.yml`, bloquantes ;
#   3. nightly       -- `nightly.yml`, une campagne plus longue chaque nuit ;
#   4. ENDURANCE     -- celui-ci, hebdomadaire.
#
# Le niveau 4 manquait sur les runners HEBERGES. `soak.yml` existe, et il est
# reserve a un runner auto-heberge : c'est le bon endroit pour 24 ou 72 heures,
# et cela veut dire qu'un depot sans ce runner n'a AUCUNE campagne longue.
#
# POURQUOI DES TRANCHES, ET PAS UN SEUL LONG JOB
#
# Un job GitHub heberge est coupe a six heures. Une campagne de huit heures
# ecrite en un seul job ne rend pas un echec : elle rend une ANNULATION, a
# l'heure exacte de la limite, tous les runs, ce qui ressemble a un blocage du
# noyau et n'en est pas un.
#
# La campagne est donc decoupee en TRANCHES independantes, chacune bien sous la
# limite. Chaque tranche est un run complet de `soak.py`, avec son propre
# verdict et ses propres artefacts ; l'agregat est la barriere.

on:
  schedule:
    # Dimanche 03:15 UTC : apres les nightly de la semaine, avant le lundi.
    - cron: '15 3 * * 0'
  workflow_dispatch:
    inputs:
      minutes_par_tranche:
        description: 'Duree de chaque tranche, en minutes'
        required: true
        default: '90'
        type: choice
        options: ['30', '60', '90', '150']

permissions:
  contents: read

concurrency:
  group: endurance-hebdomadaire
  cancel-in-progress: false

jobs:
  construire:
    name: endurance / noyau
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Construire le noyau
        run: tools/ci/build_kernel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: endurance-bootimage
          path: target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
          retention-days: 7

  tranche:
    name: endurance / tranche ${{ matrix.tranche }} / SMP${{ matrix.cpus }}
    needs: construire
    runs-on: ubuntu-latest
    # Bien sous la limite de six heures : une tranche qui la frole rendrait une
    # annulation, pas un verdict.
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        # QUATRE TRANCHES, ET LE NOMBRE N'EST PAS REGLABLE.
        #
        # Une premiere version offrait un choix « nombre de tranches » que la
        # matrice ne lisait pas : demander une tranche en lancait quatre,
        # demander six n'en lancait jamais six. Un reglage qui ne regle rien est
        # pire qu'un reglage absent -- on croit avoir agi.
        #
        # Il n'a pas ete cable, il a ete RETIRE : les quatre tranches ne sont
        # pas une duree, ce sont les quatre TOPOLOGIES SMP. Une regression SMP
        # se manifeste rarement au meme nombre de coeurs qu'on l'a introduite,
        # et en retirer une ne raccourcirait pas la campagne -- elles tournent
        # en parallele -- elle creerait seulement un angle mort.
        #
        # La duree, elle, se regle : c'est `minutes_par_tranche`.
        include:
          - { tranche: 1, cpus: 1 }
          - { tranche: 2, cpus: 2 }
          - { tranche: 3, cpus: 4 }
          - { tranche: 4, cpus: 8 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: endurance-bootimage
          path: target/x86_64-bouchaud_os/debug/
      - name: QEMU et chaine musl
        run: |
          # musl-tools/build-essential : les sondes du scenario sont compilees
          # ici, depuis les sources du commit -- jamais un binaire perime.
          tools/ci/apt-installe.sh qemu-system-x86 musl-tools build-essential
      - name: Scenario d'endurance (disque autorun + charges reelles)
        shell: bash
        run: tools/ci/fabrique-scenario-endurance.sh endurance-scenario
      - name: Campagne
        shell: bash
        run: |
          chmod +x target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin || true
          minutes='${{ github.event.inputs.minutes_par_tranche || 90 }}'
          # Le cycle doit contenir le scenario entier (~75 s sous TCG a SMP1,
          # plus lent a SMP8) avec une marge : un cycle coupe avant
          # `ENDURANCE_CYCLE_FIN` est ROUGE (marqueur absent), jamais tronque
          # en silence.
          PYTHONPATH=tools/ci/reliability python3 tools/ci/reliability/soak.py \
            target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin \
            --cpus '${{ matrix.cpus }}' \
            --duration-seconds "$(( minutes * 60 ))" \
            --cycle-seconds 300 \
            --memory-mb 4096 \
            --disque endurance-scenario/endurance.img \
            --require-fichier endurance-scenario/marqueurs-endurance.txt \
            --out-dir endurance-tranche-${{ matrix.tranche }}
      - name: Verdict (campagne / budgets / metriques absentes / noyau)
        if: always()
        shell: bash
        run: |
          # Le consommateur suit le chemin publie dans `summary.json` : aucun
          # nom de trace n'est devine ici. Voir `test_traces_endurance.py`.
          python3 tools/ci/reliability/budgets_endurance.py endurance-tranche-${{ matrix.tranche }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endurance-tranche-${{ matrix.tranche }}
          path: |
            endurance-tranche-${{ matrix.tranche }}
            endurance-scenario/scenario/autorun
            endurance-scenario/marqueurs-endurance.txt
          retention-days: 14

  endurance-gate:
    name: endurance-gate
    if: always()
    needs: [construire, tranche]
    runs-on: ubuntu-latest
    steps:
      - name: Verdict agrege
        env:
          BUILD: ${{ needs.construire.result }}
          TRANCHES: ${{ needs.tranche.result }}
        run: |
          printf '%-12s %s\n' construire "$BUILD" tranches "$TRANCHES"
          for r in "$BUILD" "$TRANCHES"; do
            [ "$r" != failure ] && [ "$r" != cancelled ] || exit 1
          done
          echo ENDURANCE_GATE_OK
