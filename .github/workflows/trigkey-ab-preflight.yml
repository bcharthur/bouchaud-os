# Prove a REAL QEMU boot of the exact generated A/B image, not physical qualification.
name: Trigkey A/B image preflight
on:
  pull_request:
    paths:
      - 'tools/release/build_trigkey_ab_image.sh'
      - 'tools/release/verify_trigkey_ab_image.py'
      - 'tools/release/smoke_trigkey_ab_qemu.sh'
      - 'tools/release/verify_trigkey_ab_boot.py'
      - 'tools/ci/reliability/test_trigkey_ab_*.py'
      - '.github/workflows/trigkey-ab-preflight.yml'
      - 'tools/reference/uefi-image-builder/**'
      # BOUCHAUD_STATE_AB_V1 / BOUCHAUD_INSTALL_SSD_V1
      - 'tools/ci/run_state_ab.sh'
      - 'tools/ci/state_ab_verdict.py'
      - 'tools/ci/run_installe_ssd_qemu.sh'
      - 'tools/ci/reliability/test_state_ab_verdict.py'
      - 'tools/ci/reliability/test_installe_ssd.py'
      - 'tools/install/**'
      - 'src/shell/**'
      - 'userland/services/**'
      - 'src/kernel/update/**'
      - 'src/gui/client.rs'
      - 'src/gui/window_manager.rs'
      - 'tools/ci/qemu_gestes.py'
      - 'tools/release/test_livraison_qemu.py'
      - 'tools/release/assemble_systeme.sh'
      - 'tools/update/meta.rs'
      - 'src/fs/persistance/**'
      - 'src/fs/persistance.rs'
      - 'src/platform/pc/installation.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu-ab-proof:
    name: trigkey / QEMU image A/B boot, non physique
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Install OVMF + QEMU
        run: tools/ci/apt-installe.sh qemu-system-x86 ovmf musl-tools build-essential binutils
      - name: Rust UEFI toolchain
        run: |
          rustup show active-toolchain
          rustup target add x86_64-unknown-uefi
      - name: Refuse false-positive fixtures
        run: python3 -m unittest discover -s tools/ci/reliability -p 'test_trigkey_ab_*.py' -v
      - name: Build A/B image without writing to any physical device
        run: bash tools/release/build_trigkey_ab_image.sh target/trigkey-ab-preflight
      - name: Boot SAME image under QEMU/OVMF, require real health signal
        run: bash tools/release/smoke_trigkey_ab_qemu.sh target/trigkey-ab-preflight
      - name: Image de livraison, demarree telle quelle et utilisee (Terminal, DOOM ; Ladybird absent ici -- PARTIEL)
        run: python3 tools/release/test_livraison_qemu.py target/trigkey-ab-preflight
      - name: STATE survit aux coupures et au changement de slot A -> B (copie de l'image)
        run: |
          python3 -m unittest tools/ci/reliability/test_state_ab_verdict.py -v
          bash tools/ci/run_state_ab.sh target/trigkey-ab-preflight
      - name: Installateur SSD (fichier, sysfs factice) puis demarrage du SSD installe
        run: |
          python3 -m unittest tools/ci/reliability/test_installe_ssd.py -v
          bash tools/ci/run_installe_ssd_qemu.sh target/trigkey-ab-preflight
      - name: Collect reproducible proof without uploading the large disk image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trigkey-ab-qemu-preflight
          path: |
            target/trigkey-ab-preflight/manifest-ab.json
            target/trigkey-ab-preflight/disque-ab.img.sha256
            target/trigkey-ab-preflight/qemu-boot-evidence.json
            target/trigkey-ab-preflight/boot-qemu.log
            target/trigkey-ab-preflight/state-boot-*.log
            target/trigkey-ab-preflight/ssd-boot-*.log
            target/trigkey-ab-preflight/installe-ssd.log
            target/trigkey-ab-preflight/livraison-evidence.json
            target/trigkey-ab-preflight/livraison-boot.log
            target/trigkey-ab-preflight/livraison-captures/*.ppm
          if-no-files-found: warn
          retention-days: 14
