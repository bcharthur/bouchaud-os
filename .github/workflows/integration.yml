name: Integration

# NIVEAU B -- VALIDATION AVANT FUSION (BOUCHAUD_CI_TROIS_NIVEAUX_V1).
#
# Sur chaque PR (le commit de fusion), et apres fusion sur `main`. Plus sur
# chaque push de branche de travail : ce run et le run PR refaisaient le meme
# arbre (19 doublons sur 24 SHA releves du 14 au 17/11), et le run PR, lui, ne
# lancait AUCUNE suite QEMU sans libelle -- `integration-gate` y etait vert sans
# rien avoir execute. Desormais le run PR EXECUTE les suites ; seule une PR
# strictement documentaire n'en lance aucune, et le verdict le DIT.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'targets/**'
      - '.cargo/**'
      - '.github/workflows/integration.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: 'auto, kernel ou all'
        required: false
        default: auto
        type: choice
        options: [auto, kernel, all]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    name: integration / gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      health: ${{ steps.classify.outputs.health }}
      mm: ${{ steps.classify.outputs.mm }}
      primitives: ${{ steps.classify.outputs.primitives }}
      kernel: ${{ steps.classify.outputs.kernel }}
      userland: ${{ steps.classify.outputs.userland }}
      browser_engine: ${{ steps.classify.outputs.browser_engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classer les changements
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          SUITE: ${{ inputs.suite || 'auto' }}
          EVENT: ${{ github.event_name }}
        run: |
          # UN LANCEMENT MANUEL VERIFIE L'ETAT, PAS LE DERNIER COMMIT.
          #
          # Sans base de comparaison, le classificateur retombe sur `HEAD^` :
          # un `workflow_dispatch` ne classait donc que les fichiers du DERNIER
          # commit. Un lot ou le dernier commit ne touche que la table du gros
          # verrou faisait sauter les sondes memoire, alors que le lot entier
          # changeait l'allocateur -- et le vert obtenu ne disait rien de ce
          # qu'on croyait avoir verifie.
          #
          # `ci.yml` forcait deja tout sur un lancement manuel. L'asymetrie
          # entre les deux etait le defaut : c'est celle qui fait croire qu'on
          # a verifie la meme chose des deux cotes.
          if [ "$EVENT" = workflow_dispatch ] || [ "$SUITE" = all ] || [ "$SUITE" = kernel ]; then
            python3 tools/ci/classify_changes.py --head "$HEAD_SHA" --all
          else
            python3 tools/ci/classify_changes.py --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

      # La decision vient APRES le classement : elle en depend.
      - name: Autorisation du niveau integration
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
        run: |
          # push main, lancement manuel, PR : les suites tournent. La seule
          # exception est une PR strictement documentaire (docs/, README.md) :
          # aucun fichier executable n'a change, et le verdict le dira.
          run=true
          if [ "$EVENT" = pull_request ] && [ "$DOCS_ONLY" = true ]; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "integration enabled=$run (event=$EVENT docs_only=$DOCS_ONLY)"

  kernel-build:
    name: kernel / bootimage once
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: integration-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            integration-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-
      - name: Construire l'image une seule fois
        run: tools/ci/build_kernel.sh

      # De quel commit vient cette image, et est-ce bien celle qui a ete
      # testee. Une image qui boote sans qu'on sache CE qui a ete construit
      # n'est pas une publication, c'est un artefact.
      #
      # Les deux fichiers sont rassembles dans UN SEUL repertoire avant
      # l'envoi. `upload-artifact` conserve l'arborescence commune a tous les
      # chemins fournis : deux chemins sans ancetre commun produisent une
      # archive qui reproduit `target/x86_64-bouchaud_os/debug/...`, et les
      # jobs suivants ne trouvent plus l'image la ou ils l'attendent. C'est
      # exactement ce qui vient d'arriver -- « Could not open
      # image/bootimage-bouchaud-os.bin » sur les quatre suites QEMU.
      - name: Rassembler l'image et son manifeste
        run: |
          mkdir -p publication
          cp target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin publication/
          python3 tools/ci/release_manifest.py \
            publication/bootimage-bouchaud-os.bin \
            --sortie publication/release-manifest.json
          cat publication/release-manifest.json
          ls -l publication

      - name: Publier le bootimage partage
        uses: actions/upload-artifact@v4
        with:
          name: integration-bootimage
          path: publication/
          if-no-files-found: error
          retention-days: 7

  qemu-smoke:
    name: qemu / boot smoke
    needs: [gate, kernel-build]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 8 min pour le boot minimal, plus ~1 min pour le releve des fils.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: QEMU
        run: |
          tools/ci/apt-installe.sh qemu-system-x86
      - uses: actions/download-artifact@v4
        with:
          name: integration-bootimage
          path: image
      - name: Boot minimal
        run: tools/ci/run_qemu_smoke.sh image/bootimage-bouchaud-os.bin qemu-smoke.log
      # BOUCHAUD_SYSRQ_RELEVE_FILS_V1 (#283) : l'outil que les bancs Ladybird
      # utilisent sur une VM figee doit marcher AVANT d'en avoir besoin.
      - name: Releve des fils par Alt+SysRq
        if: always()
        run: tools/ci/run_releve_fils_e2e.sh image/bootimage-bouchaud-os.bin releve-fils.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-qemu-smoke
          path: |
            qemu-smoke.log
            releve-fils.log
          if-no-files-found: warn

  nvme-gpt:
    name: qemu / nvme + gpt
    needs: [gate, kernel-build]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: QEMU
        run: |
          tools/ci/apt-installe.sh qemu-system-x86
      - uses: actions/download-artifact@v4
        with:
          name: integration-bootimage
          path: image
      # Le pilote NVMe n'etait execute NULLE PART : `bouchaud_nvme_args`
      # existait sans appelant, et aucune campagne n'attachait de disque. Le
      # seul endroit ou il tournait etait la machine physique, ou il a
      # double-faute. Ce scenario lui donne un disque, une vraie table GPT
      # ecrite par un outil independant, et exige que la premiere lecture
      # reelle parte et revienne.
      - name: NVMe + GPT + montage (i440fx)
        run: |
          BOUCHAUD_MACHINE=pc tools/ci/run_nvme_gpt.sh \
            image/bootimage-bouchaud-os.bin target/nvme-gpt-ci/nvme-gpt-pc.log
      # LA MACHINE DE REFERENCE EST UNE TOPOLOGIE PCIe, PAS UN BUS PARTAGE.
      #
      # Le premier essai de ce scenario avait conclu que le noyau « ne demarre
      # pas encore sur q35 » a partir d'un journal serie vide. C'ETAIT FAUX,
      # et la mesure l'a montre : sur q35 le noyau demarre entierement,
      # jusqu'a l'ordonnanceur, exactement comme sur i440fx. Le journal etait
      # vide parce que le montage differe n'etait jamais declenche, pas parce
      # que le noyau se taisait.
      #
      # Les deux machines tournent donc, et separement : une reussite sur
      # i440fx ne dit rien de la topologie PCIe, qui est celle du materiel de
      # reference.
      - name: NVMe + GPT + montage (q35, topologie PCIe)
        run: |
          BOUCHAUD_MACHINE=q35 tools/ci/run_nvme_gpt.sh \
            image/bootimage-bouchaud-os.bin target/nvme-gpt-ci/nvme-gpt-q35.log
      # PROFONDEUR ANNONCEE CONTRE PROFONDEUR ATTEINTE.
      #
      # Partitionner les ressources DMA rend une profondeur superieure a un
      # possible. Seul un appelant concurrent la rend atteinte -- et le journal
      # du sondage GPT montrait huit commandes d'affilee toutes sur
      # `emplacement=0`. Cette etape lance de vrais lecteurs simultanes et
      # echoue si la profondeur retombe a un, ou si un emplacement fuit.
      - name: Profondeur de file reellement atteinte
        run: tools/ci/run_nvme_parallele.sh image/bootimage-bouchaud-os.bin target/nvme-parallele-ci/nvme-parallele.log
      - name: Publier le diagnostic de profondeur NVMe
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('target/nvme-parallele-ci/nvme-parallele.log')
          if path.is_file():
              raw = re.sub(r'\x1b\[[0-9;]*m', '', path.read_text(errors='replace'))
              lines = [line for line in raw.splitlines() if any(key in line for key in (
                  'NVME_PARALLELE', 'SCHED-NG-ATTENTE-VIVE', 'KERNEL PANIC', 'panicked at'))]
              for start in range(0, len(lines), 4):
                  message = '\n'.join(lines[start:start + 4])
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::notice title=NVMe profondeur {start // 4 + 1}::{message}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-nvme-gpt
          path: |
            target/nvme-gpt-ci/*.log
            target/nvme-parallele-ci/*.log
          if-no-files-found: warn

  system-health:
    name: qemu / system health
    needs: [gate, kernel-build]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: QEMU + curl
        run: |
          tools/ci/apt-installe.sh qemu-system-x86 curl
      - uses: actions/download-artifact@v4
        with:
          name: integration-bootimage
          path: image
      - name: Health bare-metal
        run: tools/ci/run_system_health.sh image/bootimage-bouchaud-os.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-system-health
          path: |
            health.log
            health-report.json
            fixture.log
          if-no-files-found: warn

  python-disque:
    # BOUCHAUD_PYTHON_DISQUE_V1 : l'interpreteur Python (16,4 Mo) n'est plus
    # dans le noyau. Prouve qu'il calcule depuis le disque, qu'un disque sans
    # lui donne un refus nomme sans panique, et que l'image de boot a maigri.
    name: qemu / python depuis le disque
    needs: [gate, kernel-build]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: QEMU
        run: |
          tools/ci/apt-installe.sh qemu-system-x86
      - uses: actions/download-artifact@v4
        with:
          name: integration-bootimage
          path: image
      - name: Python lu sur le disque de donnees
        run: tools/ci/run_python_disque.sh image/bootimage-bouchaud-os.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-python-disque
          path: python-disque/*.log
          if-no-files-found: warn

  souffrance-verrou:
    # BOUCHAUD_SOUFFRANCE_PROPRIETAIRE_V1 (#283) : quand TOUS les coeurs sont
    # figes, la seule ligne qui sort (`[DIAG-EN-SOUFFRANCE]`, emise par l'IRQ)
    # doit nommer le verrou attendu, son coeur proprietaire et la ligne de
    # l'attente. Temoin positif (noyau `banc-souffrance-verrou`, jamais livre)
    # et temoin negatif (l'image partagee : aucune ligne en 60 s).
    name: qemu / noyau fige, proprietaire du verrou
    needs: [gate, kernel-build]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: integration-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            integration-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-
      - name: QEMU
        run: |
          tools/ci/apt-installe.sh qemu-system-x86
      - uses: actions/download-artifact@v4
        with:
          name: integration-bootimage
          path: image
      - name: Noyau temoin (banc-souffrance-verrou)
        run: |
          rustup show active-toolchain || rustup toolchain install
          command -v cargo-bootimage >/dev/null 2>&1 || cargo install bootimage --locked
          cargo bootimage --features banc-souffrance-verrou
          grep -aq BOUCHAUD_BANC_SOUFFRANCE target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
          cp target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin temoin-souffrance.bin
      - name: Ligne de souffrance d'un noyau fige
        run: tools/ci/run_souffrance_verrou.sh temoin-souffrance.bin image/bootimage-bouchaud-os.bin
      # BOUCHAUD_RAPPORT_GEL_V1 : le rapport automatique, symbolise avec le
      # noyau ELF du temoin qu'on vient de construire, doit designer le
      # detenteur et la fonction ou il s'execute (RIP de la NMI).
      - name: Rapport de gel symbolise (temoin)
        run: |
          set -o pipefail
          python3 -m unittest discover -s tools/ci/reliability -p 'test_rapport_gel.py' -v
          python3 tools/ci/reliability/rapport_gel.py souffrance-verrou/temoin.txt \
            target/x86_64-bouchaud_os/debug/bouchaud-os | tee souffrance-verrou/rapport.txt
          grep -qE 'RAPPORT_GEL fautif coeur[01] .*s.execute en 0x[0-9a-f]+ \[[^]]*banc_souffrance::detenteur' \
            souffrance-verrou/rapport.txt
          grep -qE 'RAPPORT_GEL qemu_verdict=boucle_noyau coeur=[01] .*banc_souffrance::detenteur' \
            souffrance-verrou/rapport.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-souffrance-verrou
          path: |
            souffrance-verrou/*.log
            souffrance-verrou/*.cpus
            souffrance-verrou/rapport.txt
          if-no-files-found: warn

  tempete-exec:
    # BOUCHAUD_TEMPETE_EXEC_V1 : le motif de la batterie de workers de Ladybird
    # (fork + execve en rafale depuis un processus multi-fils, enfants qui
    # fautent, protegent, creent un fil et sortent), sans Ladybird. Exige zero
    # echec, zero gel, et AUCUNE FUITE DE PROCESSUS (processus_crees -
    # processus_detruits borne par les vivants) : avant
    # BOUCHAUD_SORTIE_SANS_REFERENCE_V1, aucun processus sorti par exit_group
    # ou ayant fait execve n'etait detruit, et la RAM etait pleine en ~2 000
    # cycles. SMP4 puis SMP1.
    name: qemu / tempete fork+exec (fuite de processus)
    needs: [gate, kernel-build]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: QEMU + musl
        run: |
          tools/ci/apt-installe.sh qemu-system-x86 musl-tools build-essential file
      - uses: actions/download-artifact@v4
        with:
          name: integration-bootimage
          path: image
      - name: Tempete fork+exec, SMP4
        run: BO_SMP=4 OUT=tempete-exec-smp4 tools/ci/run_tempete_exec.sh image/bootimage-bouchaud-os.bin 40
      - name: Tempete fork+exec, SMP1
        run: BO_SMP=1 OUT=tempete-exec-smp1 tools/ci/run_tempete_exec.sh image/bootimage-bouchaud-os.bin 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-tempete-exec
          path: |
            tempete-exec-smp4/serie.log*
            tempete-exec-smp1/serie.log*
          if-no-files-found: warn

  atelier-reactivite:
    # BOUCHAUD_BANC_ATELIER_V1 : le bureau Atelier pilote comme un utilisateur
    # (moniteur QEMU) -- bureau vide, ouverture/fermeture d'Insights, survol,
    # deplacement, redimensionnement -- sous KVM (sorties de VM reelles, comme
    # WHPX) puis TCG. Exige des trames mesurees dans chaque phase, aucune
    # panique et AUCUN acces de configuration PCI pendant les trames : Insights
    # re-enumerait le bus a chaque trame (~30 000 E/S), ~100 ms par trame sous
    # WHPX. p50/p95/p99 publies, sans seuil de temps (runner partage).
    name: qemu / reactivite Atelier (KVM, TCG)
    needs: [gate, kernel-build]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: QEMU
        run: |
          tools/ci/apt-installe.sh qemu-system-x86
      - uses: actions/download-artifact@v4
        with:
          name: integration-bootimage
          path: image
      - name: Acces a /dev/kvm
        run: |
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Atelier sous KVM, SMP2
        run: python3 tools/ci/banc_atelier.py --boot image/bootimage-bouchaud-os.bin --sortie atelier-kvm-smp2 --accel kvm --smp 2 --exige-sans-es --etiquette kvm-smp2
      - name: Atelier sous TCG, SMP2
        if: ${{ !cancelled() }}
        run: python3 tools/ci/banc_atelier.py --boot image/bootimage-bouchaud-os.bin --sortie atelier-tcg-smp2 --accel tcg --smp 2 --exige-sans-es --etiquette tcg-smp2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-atelier-reactivite
          path: |
            atelier-*/serie.log
            atelier-*/resultat.json
          if-no-files-found: warn

  fenetre-migration:
    # BOUCHAUD_FENETRE_MIGRATION_V1 (#283) : aucune marque par coeur
    # (`preempt_count`, `verrous_simples`) posee sur un autre coeur que celui
    # qui execute. Temoin `banc-fenetre-migration` (jamais livre) : la panique
    # `preempt_count underflow` du job Ladybird perf avant-simple (15/11)
    # rejouee sur commande, et refusee.
    name: qemu / fenetre de migration des marques par coeur
    needs: [gate, kernel-build]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: integration-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            integration-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-
      - name: QEMU
        run: |
          tools/ci/apt-installe.sh qemu-system-x86
      - name: Noyau temoin (banc-fenetre-migration)
        run: |
          rustup show active-toolchain || rustup toolchain install
          command -v cargo-bootimage >/dev/null 2>&1 || cargo install bootimage --locked
          cargo bootimage --features banc-fenetre-migration
          grep -aq BOUCHAUD_BANC_FENETRE target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
          cp target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin temoin-fenetre.bin
      - name: Marques par coeur, SMP4
        run: tools/ci/run_fenetre_migration.sh temoin-fenetre.bin 4
      - name: Marques par coeur, SMP2
        run: tools/ci/run_fenetre_migration.sh temoin-fenetre.bin 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-fenetre-migration
          path: fenetre-migration/*.log
          if-no-files-found: warn

  os-primitives:
    name: qemu / os primitives
    needs: [gate, kernel-build]
    if: needs.gate.outputs.run == 'true' && (needs.gate.outputs.primitives == 'true' || inputs.suite == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: QEMU + musl
        run: |
          tools/ci/apt-installe.sh qemu-system-x86 musl-tools build-essential file
      - uses: actions/download-artifact@v4
        with:
          name: integration-bootimage
          path: image
      - name: Sondes ABI/FS/disque
        run: tools/ci/run_os_primitives.sh image/bootimage-bouchaud-os.bin
      - name: Persistance -- un cache qui deborde n'emporte pas /persist (deux demarrages)
        run: tools/ci/run_persist_cache.sh image/bootimage-bouchaud-os.bin
      - name: Audio -- l'horloge OSS de /dev/dsp avance au rythme du son joue (AC'97 emule)
        run: tools/ci/run_oss_horloge.sh image/bootimage-bouchaud-os.bin
      - name: Securite -- matrice des roles du navigateur par vrais appels systeme
        run: tools/ci/run_matrice_roles.sh image/bootimage-bouchaud-os.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-os-primitives
          path: |
            serie-primitives.log
            serie-persist-cache-*.log
          if-no-files-found: warn

  comptabilite-cpu:
    name: qemu / proc-stat et cout du fork
    needs: [gate, kernel-build]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Deux scenarios QEMU emules, dont un qui projette et recopie 256 Mio.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: QEMU + compilateur
        run: |
          tools/ci/apt-installe.sh qemu-system-x86 build-essential file
      - uses: actions/download-artifact@v4
        with:
          name: integration-bootimage
          path: image
      # P18 : `/proc/stat` doit rester cumulatif, et l'ecart qu'il revele doit
      # etre EXPLIQUE. Ce banc se jouait a la main ; une propriete que rien ne
      # rejoue se perd au premier remaniement.
      - name: Compteurs /proc/stat
        env:
          PROCSTAT_SORTIE: proc-stat-ci
        run: tools/ci/run_proc_stat_monotone.sh image/bootimage-bouchaud-os.bin
      # Le cout de la duplication d'espace d'adressage. C'est le chemin de
      # chaque lancement de service du navigateur.
      - name: Cout du fork
        env:
          FORK_SORTIE: cout-fork-ci
        run: tools/ci/run_cout_fork.sh image/bootimage-bouchaud-os.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-comptabilite-cpu
          path: |
            proc-stat-ci
            cout-fork-ci
          if-no-files-found: warn

  mm-ng6:
    name: qemu / mm-ng6 smp4
    needs: [gate, kernel-build]
    if: needs.gate.outputs.run == 'true' && (needs.gate.outputs.mm == 'true' || inputs.suite == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: QEMU + musl
        run: |
          tools/ci/apt-installe.sh qemu-system-x86 musl-tools file
      - uses: actions/download-artifact@v4
        with:
          name: integration-bootimage
          path: image
      - name: Stress memoire SMP4
        run: tools/ci/run_mm_ng6.sh image/bootimage-bouchaud-os.bin

      # Les budgets d'EXECUTION ne peuvent se verifier que la ou une trace
      # existe. Celle-ci est la plus longue et la plus chargee de
      # l'integration : c'est donc ici qu'un figement du gros verrou se voit.
      # Trois valeurs bloquent -- tenue maximale, attente maximale avant
      # acquisition, et regressions de domaine, qui doit rester a zero.
      - name: Budgets d'execution
        run: python3 tools/ci/check_budgets.py --journal mm-ng6.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-mm-ng6
          path: |
            mm-ng6.log
            mmstress.readelf.txt
            mmstress.sha256
          if-no-files-found: warn

  qt-pixel:
    name: host / qt pixel
    needs: gate
    if: needs.gate.outputs.run == 'true' && (needs.gate.outputs.userland == 'true' || needs.gate.outputs.browser_engine == 'true' || inputs.suite == 'all')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Qt hote
        run: |
          tools/ci/apt-installe.sh qtbase5-dev qtbase5-dev-tools libbrotli-dev python3-dev
      - name: Pixels reels
        env:
          QT_QPA_PLATFORM: offscreen
        run: tools/userland/verifie-hote.sh

  dns-udp:
    name: qemu / dns udp ring3
    needs: gate
    if: needs.gate.outputs.run == 'true' && (needs.gate.outputs.kernel == 'true' || inputs.suite == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: QEMU
        run: |
          tools/ci/apt-installe.sh qemu-system-x86
      - name: Cache Cargo de la sonde specialisee
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: dns-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            dns-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-
      - name: DNS depuis ring3
        run: tools/net/verifie-dns.sh
      # BOUCHAUD_TCP_SOCKETS_FIABLES_V1 : meme noyau, meme couche (sockets
      # d'anneau 3). Un segment de donnees qui ne part pas -- ARP expire apres
      # 65 s de silence -- doit etre renvoye ; avant, la connexion restait
      # figee jusqu'a l'echeance du serveur (consentement YouTube, 4 min).
      - name: TCP depuis ring3 - segment non parti renvoye
        if: always()
        run: tools/net/verifie-tcp-perte.sh
      # BOUCHAUD_LECTURE_EXACTE_V1 / BOUCHAUD_COPIE_BORNEE_V1 : meme noyau.
      # Un gros `read`/`write` paniquait le noyau ; `read`/`pread` rendaient
      # des lectures courtes au milieu d'un fichier (classes de la JVM
      # tronquees).
      - name: Fichiers ring3 - lectures exactes, copies bornees
        if: always()
        run: tools/ci/run_lecture_fichiers.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
      # BOUCHAUD_REVEIL_CIBLE_V1 : meme noyau. Un message IPC ne reveille que
      # son destinataire : 12 processus en poll(-1) sur leurs propres canaux
      # ne consomment rien pendant 20 000 allers-retours IPC entre deux
      # autres (main : 18,1 s de CPU pour les inactifs).
      - name: IPC ring3 - un message ne reveille que son destinataire
        if: always()
        run: tools/ci/run_reveil_cible.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-dns-udp
          path: |
            target/verifie-dns/serie.log
            target/verifie-tcp-perte/serie.log
            target/verifie-tcp-perte/serveur.log
            target/lecture-fichiers/serie.log
            target/reveil-cible/serie.log
          if-no-files-found: warn

  bar-haute:
    # BOUCHAUD_MMIO_HORS_FENETRE_V1 : panique de main@4307cf6f sous WHPX (BAR
    # du xHCI a 56 Tio, hors de la fenetre physique du chargeur). La condition
    # est reproduite sous TCG par `-cpu max,phys-bits=46` ; le banc exige
    # qu'elle le soit, puis le bureau, l'USB, le NVMe et l'e1000.
    name: qemu / bar pci hors fenetre (uefi, 46 bits)
    needs: gate
    if: needs.gate.outputs.run == 'true' && (needs.gate.outputs.kernel == 'true' || inputs.suite == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: QEMU + OVMF
        run: tools/ci/apt-installe.sh qemu-system-x86 ovmf
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-uefi
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bar-haute-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            bar-haute-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-
      - name: Stage 2 UEFI, BAR au-dela de la fenetre physique
        run: tools/ci/run_bar_haute.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-bar-haute
          path: target/bar-haute/serie.log
          if-no-files-found: warn

  dhcp-recuperation:
    name: qemu / dhcp + reprise rx
    needs: [gate, kernel-build]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: QEMU
        run: |
          tools/ci/apt-installe.sh qemu-system-x86
      - uses: actions/download-artifact@v4
        with:
          name: integration-bootimage
          path: image
      # Diagnostic : l OFFRE est-elle sur le fil ? Tranche CAS A / CAS B.
      - name: L offre DHCP sur le fil
        run: BANC_TRAVAIL=banc-fil tools/ci/run_dhcp_wire.sh image/bootimage-bouchaud-os.bin
      # La question qui engage : sans aucune commande tapee, la machine
      # finit-elle par obtenir un VRAI bail ?
      - name: Recuperation, SLIRP par defaut
        run: BANC_TRAVAIL=banc-defaut tools/ci/run_dhcp_recuperation.sh image/bootimage-bouchaud-os.bin 45
      # ET HORS DU SOUS-RESEAU D USINE.
      #
      # Sur 10.0.2.x, le repli compile devine juste par accident : une
      # configuration inventee et un bail reel donnent la meme adresse. Seul
      # un autre sous-reseau distingue les deux.
      # B3 : les DEUX issues d une reparation RX, sur une vraie panne
      # materielle. Un banc qui n atteindrait qu une seule issue ne
      # mesurerait rien.
      - name: Reprise RX effective et inefficace
        run: BANC_TRAVAIL=banc-rx tools/ci/run_rx_recuperation.sh image/bootimage-bouchaud-os.bin
      # B4 : les scenarios deterministes. Chaque panne est ARMEE et COMPTEE,
      # et un scenario dont l injection n a pas ete APPLIQUEE echoue.
      - name: Scenarios DHCP deterministes
        run: BANC_TRAVAIL=banc-scenarios tools/ci/run_dhcp_scenarios.sh image/bootimage-bouchaud-os.bin
      - name: Recuperation, SLIRP hors 10.0.2.x
        env:
          BANC_NETDEV: user,id=net0,net=192.168.76.0/24,host=192.168.76.2,dhcpstart=192.168.76.15,dns=192.168.76.3
        run: BANC_TRAVAIL=banc-autre tools/ci/run_dhcp_recuperation.sh image/bootimage-bouchaud-os.bin 45
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-dhcp-recuperation
          path: |
            banc-fil/
            banc-defaut/
            banc-autre/
            banc-rx/
            banc-scenarios/
          if-no-files-found: warn

  usb-arbre:
    name: qemu / arbre usb
    needs: [gate, kernel-build]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: QEMU
        run: |
          tools/ci/apt-installe.sh qemu-system-x86
      - uses: actions/download-artifact@v4
        with:
          name: integration-bootimage
          path: image
      # Un clavier et une souris DERRIERE un concentrateur, et rien en direct.
      # Si la traversee ne marche pas, il n'y a aucune entree, et c'est rouge.
      - name: Clavier et souris derriere un concentrateur
        run: tools/ci/run_usb_arbre.sh image/bootimage-bouchaud-os.bin usb-arbre.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-usb-arbre
          path: usb-arbre.log
          if-no-files-found: warn

  usb-branchement:
    name: qemu / branchement a chaud
    needs: [gate, kernel-build]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: QEMU
        run: |
          tools/ci/apt-installe.sh qemu-system-x86
      - uses: actions/download-artifact@v4
        with:
          name: integration-bootimage
          path: image
      # La machine demarre SANS aucun peripherique USB ; le clavier et la
      # souris sont ajoutes a chaud par QMP pendant qu'elle tourne. C'est le
      # premier geste d'un utilisateur, et aucune autre campagne ne le couvre.
      - name: Clavier branche apres le demarrage
        run: tools/ci/run_usb_branchement.sh image/bootimage-bouchaud-os.bin usb-branchement.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-usb-branchement
          path: usb-branchement.log
          if-no-files-found: warn

  usb-stockage:
    name: qemu / stockage usb (bulk-only)
    needs: [gate, kernel-build]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: QEMU
        run: |
          tools/ci/apt-installe.sh qemu-system-x86
      - uses: actions/download-artifact@v4
        with:
          name: integration-bootimage
          path: image
      # `xhci_active.rs` porte ~1000 lignes de transport Bulk-Only et de
      # commandes SCSI. Aucune campagne ne branchait de peripherique de
      # stockage : elles n'etaient executees NULLE PART. Une preuve de
      # decodage hote ne couvre pas ce chemin -- un CSW se decode a la table,
      # mais un CSW qui n'arrive jamais faute de point de terminaison
      # configure ne se voit qu'a l'execution.
      - name: Cle USB, transport Bulk, READ CAPACITY
        run: tools/ci/run_usb_stockage.sh image/bootimage-bouchaud-os.bin target/usb-stockage-ci/usb-stockage.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-usb-stockage
          path: target/usb-stockage-ci/usb-stockage.log
          if-no-files-found: warn

  # BOUCHAUD_USB_LIAISON_SUPPORT_V1 / BOUCHAUD_USB_REFUS_SCSI_V1 : le volume USB
  # designe UN support, et un refus de vidange se traite selon le protocole.
  # Six demarrages, image par defaut : une cle qui vide ; une sonde refusee ;
  # deux cles aux capacites differentes, dans les deux ordres ; un refus SCSI
  # REEL en cours d'usage (QEMU `blkdebug`), suivi d'E/S ordinaires ; un
  # debranchement puis un rebranchement. 3,5 min mesurees en local.
  usb-liaison:
    name: qemu / liaison volume usb
    needs: [gate, kernel-build]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: QEMU
        run: |
          tools/ci/apt-installe.sh qemu-system-x86
      - uses: actions/download-artifact@v4
        with:
          name: integration-bootimage
          path: image
      - name: Liaison volume/support, refus SCSI, rebranchement
        run: tools/ci/run_usb_liaison.sh image/bootimage-bouchaud-os.bin target/usb-liaison-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-usb-liaison
          path: |
            target/usb-liaison-ci/*/serie.log
            target/usb-liaison-ci/*/releve.txt
          if-no-files-found: warn

  brdp-qemu-e2e:
    name: qemu / BRDP + telemetry e2e
    needs: gate
    if: needs.gate.outputs.run == 'true' && (needs.gate.outputs.kernel == 'true' || inputs.suite == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: QEMU + TAP
        run: |
          tools/ci/apt-installe.sh qemu-system-x86 iproute2
      - name: Cache Cargo LAB
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: integration-brdp-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            integration-brdp-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-
      - name: BRDP et telemetrie sur segment TAP reel
        run: bash tools/ci/run_brdp_qemu_e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-brdp-qemu-e2e
          path: target/brdp-qemu-e2e/
          if-no-files-found: warn
          retention-days: 7

  integration-gate:
    name: integration-gate
    if: always()
    needs: [gate, kernel-build, qemu-smoke, nvme-gpt, system-health, python-disque, souffrance-verrou, tempete-exec, fenetre-migration, atelier-reactivite, os-primitives, mm-ng6, qt-pixel, dns-udp, bar-haute, dhcp-recuperation, usb-arbre, usb-branchement, usb-stockage, usb-liaison, brdp-qemu-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Synthese
        env:
          ENABLED: ${{ needs.gate.outputs.run }}
          EVENT: ${{ github.event_name }}
          DOCS_ONLY: ${{ needs.gate.outputs.docs_only }}
          KERNEL: ${{ needs.kernel-build.result }}
          BOOT: ${{ needs.qemu-smoke.result }}
          NVME: ${{ needs.nvme-gpt.result }}
          HEALTH: ${{ needs.system-health.result }}
          PYDISK: ${{ needs.python-disque.result }}
          SOUFFRANCE: ${{ needs.souffrance-verrou.result }}
          TEMPETE: ${{ needs.tempete-exec.result }}
          FENETRE: ${{ needs.fenetre-migration.result }}
          ATELIER: ${{ needs.atelier-reactivite.result }}
          PRIMITIVES: ${{ needs.os-primitives.result }}
          MM: ${{ needs.mm-ng6.result }}
          QT: ${{ needs.qt-pixel.result }}
          DNS: ${{ needs.dns-udp.result }}
          BARHAUTE: ${{ needs.bar-haute.result }}
          DHCP: ${{ needs.dhcp-recuperation.result }}
          USB: ${{ needs.usb-arbre.result }}
          PLUG: ${{ needs.usb-branchement.result }}
          STOCK: ${{ needs.usb-stockage.result }}
          LIAISON: ${{ needs.usb-liaison.result }}
          BRDP: ${{ needs.brdp-qemu-e2e.result }}
        run: |
          if [ "$ENABLED" != true ]; then
            # Seul cas : PR strictement documentaire (aucun fichier executable).
            if [ "$EVENT" = pull_request ] && [ "$DOCS_ONLY" = true ]; then
              echo 'INTEGRATION_GATE_DOCS_ONLY : PR strictement documentaire, aucune suite QEMU.'
              exit 0
            fi
            echo "ECHEC: integration non lancee hors PR documentaire (event=$EVENT docs_only=$DOCS_ONLY)."
            exit 1
          fi
          printf '%-12s %s\n' kernel "$KERNEL" boot "$BOOT" nvme "$NVME" health "$HEALTH" python "$PYDISK" souffrance "$SOUFFRANCE" tempete "$TEMPETE" fenetre "$FENETRE" atelier "$ATELIER" primitives "$PRIMITIVES" mm "$MM" qt "$QT" dns "$DNS" barhaute "$BARHAUTE" dhcp "$DHCP" usb "$USB" plug "$PLUG" stockage "$STOCK" liaison "$LIAISON" brdp "$BRDP"

          # Un job SAUTE n est pas un job REUSSI.
          #
          # Le classement peut legitimement sauter une suite sans rapport avec
          # le changement. Mais si l integration a ete demandee et que
          # RIEN n a tourne, le vert obtenu est exactement celui d une suite
          # qui passe -- et c est ainsi qu on croit valider ce qu on ne valide
          # pas. On le dit, et on echoue.
          a_tourne=0
          for r in "$KERNEL" "$BOOT" "$NVME" "$HEALTH" "$PYDISK" "$SOUFFRANCE" "$TEMPETE" "$FENETRE" "$ATELIER" "$PRIMITIVES" "$MM" "$DNS" "$BARHAUTE" "$DHCP" "$USB" "$PLUG" "$STOCK" "$LIAISON" "$BRDP"; do
            [ "$r" = skipped ] || a_tourne=1
          done
          if [ "$a_tourne" -eq 0 ]; then
            echo 'ECHEC: integration demandee, mais toutes les suites ont ete sautees.'
            exit 1
          fi

          # qt-pixel reste informatif.
          for r in "$KERNEL" "$BOOT" "$NVME" "$HEALTH" "$PYDISK" "$SOUFFRANCE" "$TEMPETE" "$FENETRE" "$ATELIER" "$PRIMITIVES" "$MM" "$DNS" "$BARHAUTE" "$DHCP" "$USB" "$PLUG" "$STOCK" "$LIAISON" "$BRDP"; do
            [ "$r" != failure ] && [ "$r" != cancelled ] || exit 1
          done
          echo INTEGRATION_GATE_OK
