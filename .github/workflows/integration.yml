name: Integration

# Integration automatique uniquement apres merge/push sur main.
# Sur une PR, ajouter le label `ci:integration` pour la demander explicitement.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'targets/**'
      - '.cargo/**'
      - '.github/workflows/integration.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      suite:
        description: 'auto, kernel ou all'
        required: false
        default: auto
        type: choice
        options: [auto, kernel, all]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: integration / gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      health: ${{ steps.classify.outputs.health }}
      mm: ${{ steps.classify.outputs.mm }}
      primitives: ${{ steps.classify.outputs.primitives }}
      kernel: ${{ steps.classify.outputs.kernel }}
      userland: ${{ steps.classify.outputs.userland }}
      browser_engine: ${{ steps.classify.outputs.browser_engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Autorisation du niveau integration
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          run=false
          if [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; then run=true; fi
          case ",$LABELS," in *,ci:integration,*) run=true ;; esac

          # Certains changements ne se VERIFIENT que sous QEMU.
          #
          # Une modification du verrouillage, de l'ordonnanceur ou de la table
          # des taches compile parfaitement et passe toutes les suites hote
          # tout en produisant un noyau qui se fige ou ne demarre pas : la
          # propriete en cause est une course entre coeurs, et aucun test
          # d'hote ne la voit. Attendre un label pour ces chemins-la revient a
          # ne jamais les valider, puisque c'est justement la ou l'on croit le
          # moins en avoir besoin.
          if [ "$run" != true ] && [ -n "$BASE_SHA" ]; then
            if git diff --name-only "$BASE_SHA...$HEAD_SHA" \
                 | grep -qE '^src/(kernel/(sync|process|scheduler)|arch/x86_64/(smp|cpu_local|idt))'; then
              echo "chemin critique touche : integration forcee"
              run=true
            fi
          fi

          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "integration enabled=$run"
      - name: Classer les changements
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          SUITE: ${{ inputs.suite || 'auto' }}
        run: |
          if [ "$SUITE" = all ] || [ "$SUITE" = kernel ]; then
            python3 tools/ci/classify_changes.py --head "$HEAD_SHA" --all
          else
            python3 tools/ci/classify_changes.py --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

  kernel-build:
    name: kernel / bootimage once
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: integration-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            integration-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-
      - name: Construire l'image une seule fois
        run: tools/ci/build_kernel.sh

      # De quel commit vient cette image, et est-ce bien celle qui a ete
      # testee. Une image qui boote sans qu'on sache CE qui a ete construit
      # n'est pas une publication, c'est un artefact.
      #
      # Les deux fichiers sont rassembles dans UN SEUL repertoire avant
      # l'envoi. `upload-artifact` conserve l'arborescence commune a tous les
      # chemins fournis : deux chemins sans ancetre commun produisent une
      # archive qui reproduit `target/x86_64-bouchaud_os/debug/...`, et les
      # jobs suivants ne trouvent plus l'image la ou ils l'attendent. C'est
      # exactement ce qui vient d'arriver -- « Could not open
      # image/bootimage-bouchaud-os.bin » sur les quatre suites QEMU.
      - name: Rassembler l'image et son manifeste
        run: |
          mkdir -p publication
          cp target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin publication/
          python3 tools/ci/release_manifest.py \
            publication/bootimage-bouchaud-os.bin \
            --sortie publication/release-manifest.json
          cat publication/release-manifest.json
          ls -l publication

      - name: Publier le bootimage partage
        uses: actions/upload-artifact@v4
        with:
          name: integration-bootimage
          path: publication/
          if-no-files-found: error
          retention-days: 7

  qemu-smoke:
    name: qemu / boot smoke
    needs: [gate, kernel-build]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
      - uses: actions/download-artifact@v4
        with:
          name: integration-bootimage
          path: image
      - name: Boot minimal
        run: tools/ci/run_qemu_smoke.sh image/bootimage-bouchaud-os.bin qemu-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-qemu-smoke
          path: qemu-smoke.log
          if-no-files-found: warn

  system-health:
    name: qemu / system health
    needs: [gate, kernel-build]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: QEMU + curl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 curl
      - uses: actions/download-artifact@v4
        with:
          name: integration-bootimage
          path: image
      - name: Health bare-metal
        run: tools/ci/run_system_health.sh image/bootimage-bouchaud-os.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-system-health
          path: |
            health.log
            health-report.json
            fixture.log
          if-no-files-found: warn

  os-primitives:
    name: qemu / os primitives
    needs: [gate, kernel-build]
    if: needs.gate.outputs.run == 'true' && (needs.gate.outputs.primitives == 'true' || inputs.suite == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: QEMU + musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 musl-tools build-essential file
      - uses: actions/download-artifact@v4
        with:
          name: integration-bootimage
          path: image
      - name: Sondes ABI/FS/disque
        run: tools/ci/run_os_primitives.sh image/bootimage-bouchaud-os.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-os-primitives
          path: serie-primitives.log
          if-no-files-found: warn

  mm-ng6:
    name: qemu / mm-ng6 smp4
    needs: [gate, kernel-build]
    if: needs.gate.outputs.run == 'true' && (needs.gate.outputs.mm == 'true' || inputs.suite == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: QEMU + musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 musl-tools file
      - uses: actions/download-artifact@v4
        with:
          name: integration-bootimage
          path: image
      - name: Stress memoire SMP4
        run: tools/ci/run_mm_ng6.sh image/bootimage-bouchaud-os.bin

      # Les budgets d'EXECUTION ne peuvent se verifier que la ou une trace
      # existe. Celle-ci est la plus longue et la plus chargee de
      # l'integration : c'est donc ici qu'un figement du gros verrou se voit.
      # Trois valeurs bloquent -- tenue maximale, attente maximale avant
      # acquisition, et regressions de domaine, qui doit rester a zero.
      - name: Budgets d'execution
        run: python3 tools/ci/check_budgets.py --journal mm-ng6.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-mm-ng6
          path: |
            mm-ng6.log
            mmstress.readelf.txt
            mmstress.sha256
          if-no-files-found: warn

  qt-pixel:
    name: host / qt pixel
    needs: gate
    if: needs.gate.outputs.run == 'true' && (needs.gate.outputs.userland == 'true' || needs.gate.outputs.browser_engine == 'true' || inputs.suite == 'all')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Qt hote
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qtbase5-dev qtbase5-dev-tools libbrotli-dev python3-dev
      - name: Pixels reels
        env:
          QT_QPA_PLATFORM: offscreen
        run: tools/userland/verifie-hote.sh

  dns-udp:
    name: qemu / dns udp ring3
    needs: gate
    if: needs.gate.outputs.run == 'true' && (needs.gate.outputs.kernel == 'true' || inputs.suite == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Cache Cargo de la sonde specialisee
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: dns-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            dns-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-
      - name: DNS depuis ring3
        run: tools/net/verifie-dns.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-dns-udp
          path: target/verifie-dns/serie.log
          if-no-files-found: warn

  integration-gate:
    name: integration-gate
    if: always()
    needs: [gate, kernel-build, qemu-smoke, system-health, os-primitives, mm-ng6, qt-pixel, dns-udp]
    runs-on: ubuntu-latest
    steps:
      - name: Synthese
        env:
          ENABLED: ${{ needs.gate.outputs.run }}
          KERNEL: ${{ needs.kernel-build.result }}
          BOOT: ${{ needs.qemu-smoke.result }}
          HEALTH: ${{ needs.system-health.result }}
          PRIMITIVES: ${{ needs.os-primitives.result }}
          MM: ${{ needs.mm-ng6.result }}
          QT: ${{ needs.qt-pixel.result }}
          DNS: ${{ needs.dns-udp.result }}
        run: |
          if [ "$ENABLED" != true ]; then
            echo 'INTEGRATION NON DEMANDEE : aucune suite QEMU n a tourne.'
            echo 'Ce resultat vert ne dit RIEN du comportement a l execution.'
            exit 0
          fi
          printf '%-12s %s\n' kernel "$KERNEL" boot "$BOOT" health "$HEALTH" primitives "$PRIMITIVES" mm "$MM" qt "$QT" dns "$DNS"

          # Un job SAUTE n est pas un job REUSSI.
          #
          # Le classement peut legitimement sauter une suite sans rapport avec
          # le changement. Mais si l integration a ete demandee et que
          # RIEN n a tourne, le vert obtenu est exactement celui d une suite
          # qui passe -- et c est ainsi qu on croit valider ce qu on ne valide
          # pas. On le dit, et on echoue.
          a_tourne=0
          for r in "$KERNEL" "$BOOT" "$HEALTH" "$PRIMITIVES" "$MM" "$DNS"; do
            [ "$r" = skipped ] || a_tourne=1
          done
          if [ "$a_tourne" -eq 0 ]; then
            echo 'ECHEC: integration demandee, mais toutes les suites ont ete sautees.'
            exit 1
          fi

          # qt-pixel reste informatif.
          for r in "$KERNEL" "$BOOT" "$HEALTH" "$PRIMITIVES" "$MM" "$DNS"; do
            [ "$r" != failure ] && [ "$r" != cancelled ] || exit 1
          done
          echo INTEGRATION_GATE_OK
