name: C22 GC closure preflight (no native rebuild)
on:
  push:
    branches: ['p13/qualification-c22-nightly-20261030']
    paths:
      - 'tools/ladybird/prepare-echange-processus.py'
      - 'tools/ci/reliability/test_c22_gc_closure.py'
      - '.github/workflows/c22-gc-preflight.yml'
permissions:
  contents: read
jobs:
  c22-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verifier les scripts et gardes de GC differe
        run: |
          python3 -m py_compile tools/ladybird/prepare-echange-processus.py
          python3 -m unittest discover -s tools/ci/reliability -p test_c22_gc_closure.py -v
