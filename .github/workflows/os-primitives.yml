name: os-primitives (debug)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: os-primitives-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: QEMU + musl
        run: |
          tools/ci/apt-installe.sh qemu-system-x86 musl-tools build-essential file
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: primitives-debug-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            primitives-debug-${{ runner.os }}-
            cargo-${{ runner.os }}-
      - name: Bootimage
        run: tools/ci/build_kernel.sh
      - name: Primitives sur Bouchaud OS
        run: tools/ci/run_os_primitives.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
      - name: Acces a /dev/kvm
        run: |
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Primitives sous KVM, trois demarrages (compta-stress, signaux)
        # BOUCHAUD_COMPTA_STRESS_V1 : la panique de comptabilite n'est
        # apparue que sous KVM (run 37589903681). Trois demarrages complets,
        # chacun doit rendre OS_PRIMITIVES_OK (COMPTA_STRESS_OK compris).
        run: |
          for essai in 1 2 3; do
            echo "== demarrage KVM ${essai}/3 =="
            BO_QEMU_KVM=1 tools/ci/run_os_primitives.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin > "primitives-kvm-${essai}.log" 2>&1 || { tail -c 20000 "primitives-kvm-${essai}.log"; exit 1; }
            grep -aE 'COMPTA_STRESS |SIGCHLD_CAS|SIGMASQUE_CAS|BOUCHAUD_TSC_|compta_relues=|PRIMITIVES_ACCEL|OS_PRIMITIVES_OK' "primitives-kvm-${essai}.log"
            cp serie-primitives.log "serie-primitives-kvm-${essai}.log"
          done
      - name: Horloges 1 / 10 / 60 s contre le temps de l'hote (TCG puis KVM)
        # BOUCHAUD_HORLOGE_AUDIT_V1 : chaque ligne serie horodatee a son
        # arrivee par l'hote ; la duree vue par l'invite doit coller a la
        # sienne (1 s : 50 ms ; 10 et 60 s : 1 %).
        run: |
          tools/ci/run_horloge.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin 60
          cp serie-horloge.log serie-horloge-tcg.log
          BO_QEMU_KVM=1 tools/ci/run_horloge.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin 60
          cp serie-horloge.log serie-horloge-kvm.log
      - name: ATA -- integrite du chemin DMA et repli PIO sur erreur injectee (TCG puis KVM)
        # BOUCHAUD_ATA_INTEGRITE_V1 : 2 048 secteurs ecrits, vides, relus et
        # compares ; puis une ecriture refusee par QEMU blkdebug, vue par le
        # pilote et refaite en PIO, sans corruption silencieuse.
        run: |
          tools/ci/run_ata_integrite.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
          BO_QEMU_KVM=1 tools/ci/run_ata_integrite.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
      - name: P10 -- transport virtio-PCI et GET_DISPLAY_INFO (TCG puis KVM)
        # BOUCHAUD_VIRTIO_PCI_V1 : premier composant de P10. Pas un pilote
        # d'affichage, rien d'accelere : P10 reste BLOCKED.
        run: |
          tools/ci/run_virtio_gpu.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
          BO_QEMU_KVM=1 tools/ci/run_virtio_gpu.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
      - name: P10 -- scanout virtio-gpu 2D, verifie aux pixels (TCG puis KVM)
        # BOUCHAUD_VIRTIO_GPU_2D_V1 : mire exacte au pixel, 7 refus avec leur
        # code, bureau presente par virtio-gpu sans BGA et identique au bureau
        # BGA, repli sans ecran. Scanout 2D seulement : aucune acceleration,
        # aucune 3D -- P10 n'est pas termine.
        run: |
          SCANOUT_SORTIE=$PWD/scanout-virtio tools/ci/run_virtio_gpu_scanout.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
          SCANOUT_SORTIE=$PWD/scanout-virtio-kvm BO_QEMU_KVM=1 tools/ci/run_virtio_gpu_scanout.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
      - name: Faute ring 3 d'un processus multi-fils -- SMP1 et SMP8 (TCG), SMP4 (KVM)
        # BOUCHAUD_FAUTE_MULTIFIL_V1 / BOUCHAUD_BSP_PREEMPTION_DIRECTE_V1 :
        # #UD/#DE/#GP/#PF depuis le fil principal ou un frere ; le noyau
        # survit et le processus meurt. SMP1 met tout sur le coeur zero : un
        # fil de calcul pur doit y etre preempte, et y mourir condamne.
        run: |
          BO_SMP=1 tools/ci/run_faute_multifil.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin 2
          cp serie-faute-multifil.log serie-faute-multifil-smp1.log
          BO_SMP=8 tools/ci/run_faute_multifil.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin 2
          cp serie-faute-multifil.log serie-faute-multifil-smp8.log
          BO_QEMU_KVM=1 tools/ci/run_faute_multifil.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin 3
          cp serie-faute-multifil.log serie-faute-multifil-kvm.log
      - name: Extinction pendant que des orphelins tiennent le disque -- SMP1 et SMP4 (TCG)
        # BOUCHAUD_EXTINCTION_FIL_NOYAU_V1 : l'autorun s'eteint depuis le
        # contexte d'amorcage (aucune tache) ; la persistance y attend des
        # verrous dormants tenus par des processus encore vivants. Sans fil
        # noyau d'extinction : panique « parking demande hors de toute tache ».
        run: |
          BO_SMP=1 tools/ci/run_extinction_contention.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
          cp serie-extinction-contention.log serie-extinction-contention-smp1.log
          BO_SMP=4 tools/ci/run_extinction_contention.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
          cp serie-extinction-contention.log serie-extinction-contention-smp4.log
      - name: Persistance -- un cache qui deborde n'emporte pas /persist (deux demarrages)
        run: tools/ci/run_persist_cache.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
      - name: Audio -- l'horloge OSS de /dev/dsp avance au rythme du son joue (AC'97 emule)
        run: tools/ci/run_oss_horloge.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
      - name: Securite -- matrice des roles du navigateur par vrais appels systeme
        run: tools/ci/run_matrice_roles.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: os-primitives-debug
          path: |
            serie-primitives.log
            serie-primitives-kvm-*.log
            serie-persist-cache-*.log
            serie-horloge-*.log
            serie-ata-integrite-*.log
            serie-virtio-*.log
            scanout-virtio*/serie-*.log
            scanout-virtio*/capture-*.ppm
            serie-faute-multifil-*.log
            serie-extinction-contention-*.log
          if-no-files-found: warn
