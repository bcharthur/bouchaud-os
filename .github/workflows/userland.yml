name: userland-legacy

# Le chemin normal de Bouchaud OS utilise Ladybird natif. Ce workflow reste la
# fabrique du userland historique Qt/CPython/QuickJS et n'est plus lance sur
# chaque commit de branche.
on:
  push:
    branches: [main]
    paths:
      - 'tools/userland/**'
      - 'tools/ladybird/build-*.sh'
      - 'tools/ladybird/fetch.sh'
      - 'tools/ladybird/patches/**'
      - 'third_party/UPSTREAM.md'
      - '.github/workflows/userland.yml'
  workflow_dispatch:

concurrency:
  group: userland-legacy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: userland / legacy build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Dependances de construction
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3-dev pkg-config perl \
            libfreetype-dev libpng-dev libjpeg-dev libpcre2-dev \
            zlib1g-dev libbrotli-dev libbz2-dev libfontconfig1-dev \
            nasm curl tar xz-utils file clang lld cmake ninja-build git \
            autoconf automake libtool libssl-dev libedit-dev
      - name: Cache QuickJS
        uses: actions/cache@v4
        with:
          path: tools/userland/out-quickjs
          key: qjs-${{ runner.os }}-${{ hashFiles('tools/userland/build-quickjs.sh') }}
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: tools/userland/out-ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('tools/userland/build-ffmpeg.sh') }}
      - name: Cache CPython
        uses: actions/cache@v4
        with:
          path: tools/userland/out-python-embed
          key: cpython-${{ runner.os }}-${{ hashFiles('tools/userland/build-python.sh') }}
      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: tools/userland/build-qt/install
          key: qt-${{ runner.os }}-${{ hashFiles('tools/userland/build-qt.sh') }}
      - name: Cache Ladybird M5 cible
        uses: actions/cache@v4
        with:
          path: |
            third_party/ladybird
            third_party/deps-src
            third_party/deps-bouchaud
            third_party/icu-src
            third_party/icu-bouchaud
            third_party/build-rust-bouchaud
            third_party/build-ak-bouchaud
            third_party/build-libcore-bouchaud
            third_party/build-libunicode-bouchaud
            third_party/build-libcrypto-bouchaud
            third_party/build-libgc-bouchaud
            third_party/build-libjs-bouchaud
            third_party/build-libipc-bouchaud
            third_party/gen-bouchaud
          key: ladybird-m5-v2-${{ runner.os }}-${{ hashFiles('third_party/UPSTREAM.md', 'tools/ladybird/build-*.sh', 'tools/ladybird/patches/**') }}
      - name: Construire le probe Ladybird M5
        run: |
          tools/ladybird/fetch.sh
          tools/ladybird/build-tout.sh --cible
          test -x third_party/build-libipc-bouchaud/libipc-codec-probe
      - name: Construire le userland legacy
        env:
          BO_LADYBIRD_M5_PROBE: ${{ github.workspace }}/third_party/build-libipc-bouchaud/libipc-codec-probe
        run: tools/userland/build-tout.sh
      - name: Manifeste
        run: |
          cd tools/userland
          ./manifeste.sh userland.img > userland-manifest.json
          cat userland-manifest.json
          python3 - <<'PY'
          import json, os, sys
          m=json.load(open('userland-manifest.json', encoding='utf-8'))
          if m.get('git_commit') != os.environ['GITHUB_SHA']:
              sys.exit('manifeste rattache au mauvais commit')
          for k in ('qt_version','python_version','quickjs_version','ffmpeg_version','sha256','image_size'):
              if not m.get(k): sys.exit(f'champ vide: {k}')
          if m.get('ladybird_m5_probe') is not True: sys.exit('probe M5 absent')
          PY
      - name: Publier artefact
        uses: actions/upload-artifact@v4
        with:
          name: userland
          path: |
            tools/userland/userland.img
            tools/userland/userland-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Publier release du commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="userland-${GITHUB_SHA}"
          cd tools/userland
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" userland.img userland-manifest.json --clobber
          else
            gh release create "$TAG" userland.img userland-manifest.json \
              --title "userland ${GITHUB_SHA:0:12}" \
              --notes "Userland legacy Bouchaud OS pour ${GITHUB_SHA}." \
              --latest=false
          fi

  product:
    name: userland / product qemu smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: userland-product-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            userland-product-${{ runner.os }}-
            cargo-${{ runner.os }}-
      - name: Noyau
        run: tools/ci/build_kernel.sh
      - uses: actions/download-artifact@v4
        with:
          name: userland
          path: livre
      - name: Preparer scenario
        run: |
          set -e
          mkdir -p scenario
          tar -xf livre/userland.img -C scenario
          sha256sum scenario/bo-navigateur | cut -d' ' -f1 > livre.sha256
          cat > scenario/autorun <<'AUTORUN'
          uname
          df
          ifconfig
          export BO_PREFIXE=/usr
          exec /usr/libexec/ladybird/libipc-codec-probe
          exec /bo-navigateur --verifie
          AUTORUN
          (cd tools/userland && IMAGE="$GITHUB_WORKSPACE/scenario.img" ./mkdisk.sh "$GITHUB_WORKSPACE/scenario")
      - name: Demarrer Bouchaud OS
        run: |
          set +e
          timeout 600 qemu-system-x86_64 \
            -drive format=raw,file=target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin \
            -drive format=raw,file=scenario.img \
            -m 2048 -display none -no-reboot \
            -netdev user,id=net0 -device e1000,netdev=net0 \
            -audiodev none,id=muet -device AC97,audiodev=muet \
            -serial file:serie.log
          echo "qemu code=$?"
          set -e
          cat serie.log || true
      - name: Verdict M5 + produit
        run: |
          grep -F "== temoin LibIPC : endpoints generes ==" serie.log
          grep -F "RESULTAT : 0 verification(s) en echec (6 passees)" serie.log
          python3 tools/verdict-produit.py serie.log "$(cat livre.sha256)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serie-produit-legacy
          path: |
            serie.log
            jalons-produit.json
          if-no-files-found: warn
