name: ladybird-browser-host

on:
  workflow_dispatch:
  push:
    branches: ["feat/ladybird-browser-host"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ladybird-browser-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-host:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 python3-dev python3-venv perl \
            clang lld ccache cmake ninja-build git curl wget gnupg lsb-release \
            zip unzip tar xz-utils file autoconf autoconf-archive automake \
            libtool libltdl-dev gettext m4 nasm bison flex libssl-dev \
            libedit-dev linux-libc-dev mesa-common-dev ca-certificates \
            qemu-system-x86

          LLVM_VERSION=20
          if ! command -v "clang-${LLVM_VERSION}" >/dev/null 2>&1; then
            CODENAME="$(lsb_release -sc)"
            wget -qO /tmp/llvm-snapshot.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
            sudo gpg --dearmor --yes -o /usr/share/keyrings/llvm-snapshot.gpg.gpg /tmp/llvm-snapshot.gpg.key
            echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg.gpg] https://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-${LLVM_VERSION} main" \
              | sudo tee /etc/apt/sources.list.d/llvm-${LLVM_VERSION}.list
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              "clang-${LLVM_VERSION}" "lld-${LLVM_VERSION}" "llvm-${LLVM_VERSION}"
          fi

      - name: Cache Ladybird
        uses: actions/cache@v4
        with:
          path: |
            third_party/ladybird
            third_party/vcpkg-gfx
            third_party/vcpkg-downloads
            third_party/vcpkg-browser-manifest
            ~/.cache/vcpkg
            ~/.cache/ccache
          key: browser-host-${{ runner.os }}-${{ hashFiles('third_party/UPSTREAM.md', 'tools/ladybird/**') }}
          restore-keys: |
            browser-host-${{ runner.os }}-

      - name: Construire runtime + BrowserHost
        run: tools/ladybird/native-browser-final.sh --cible

      - name: Verifier artefacts
        run: |
          set -eux
          OUT=third_party/native-browser-bouchaud
          for f in BouchaudBrowserHost WebContent RequestServer ImageDecoder WebWorker Compositor WebDriver; do
            test -f "$OUT/$f"
            file "$OUT/$f"
            ! readelf -l "$OUT/$f" | grep -q INTERP
          done
          du -h "$OUT"/* || true

      - name: Construire noyau
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo install bootimage --locked
          cargo bootimage

      - name: Demarrer fixture BrowserHost
        run: |
          python3 tools/health/browser_host_fixture.py > fixture-browser-host.log 2>&1 &
          echo $! > fixture-browser-host.pid
          sleep 1
          kill -0 "$(cat fixture-browser-host.pid)"

      - name: Fabriquer disque BrowserHost
        run: |
          set -eux
          OUT=third_party/native-browser-bouchaud
          SCENARIO=scenario-browser-host

          mkdir -p "$SCENARIO/usr/libexec/ladybird" "$SCENARIO/usr/share/ladybird" "$SCENARIO/etc/ssl/certs"

          for f in BouchaudBrowserHost WebContent RequestServer ImageDecoder WebWorker Compositor WebDriver; do
            cp "$OUT/$f" "$SCENARIO/usr/libexec/ladybird/$f"
            chmod 755 "$SCENARIO/usr/libexec/ladybird/$f"
          done

          # Le desktop lance /bo-navigateur. En mode interactif il s'agit du
          # vrai BrowserHost, pas du bootstrap M9.
          cp "$OUT/BouchaudBrowserHost" "$SCENARIO/bo-navigateur"
          chmod 755 "$SCENARIO/bo-navigateur"

          if [ -d "$OUT/resources" ]; then
            cp -a "$OUT/resources/." "$SCENARIO/usr/share/ladybird/"
          fi

          cp /etc/ssl/certs/ca-certificates.crt "$SCENARIO/etc/ssl/certs/ca-certificates.crt"

          cat > "$SCENARIO/autorun" <<'SCENARIO_EOF'
          uname
          df
          ifconfig
          echo "=== Bouchaud BrowserHost interactif M11 ==="
          export BO_AUTOSTART_BROWSER=1
          export BOUCHAUD_M9=1
          export BOUCHAUD_BROWSER_HOST=1
          export BOUCHAUD_M11=1
          export BOUCHAUD_TIME_ZONE=Europe/Paris
          export BOUCHAUD_M9_URL='http://10.0.2.2:18082/browser-host.html'
          desktop
          SCENARIO_EOF

          (cd tools/userland && IMAGE="$GITHUB_WORKSPACE/ladybird-browser-host.img" ./mkdisk.sh "$GITHUB_WORKSPACE/$SCENARIO")
          stat -c 'BrowserHost disk: %s bytes' ladybird-browser-host.img
          # Le plafond porte sur l'ARCHIVE, pas sur l'image : la zone
          # persistante de 128 Mio occupe la fin du disque, bien au-dela de ce
          # que `src/fs/tar.rs` indexe. `mkdisk.sh` connait les deux tailles et
          # refuse deja une archive hors plafond, avec ses chiffres exacts ;
          # comparer ici l'image entiere rejetait des disques valides.

      - name: Executer BrowserHost
        run: |
          set -u
          LOG=serie-browser-host.log
          : > "$LOG"
          DEADLINE=$((SECONDS + 300))

          qemu-system-x86_64 \
            -drive format=raw,file=target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin \
            -drive format=raw,file=ladybird-browser-host.img \
            -m 8192 -display none -no-reboot \
            -netdev user,id=net0 -device e1000,netdev=net0 \
            -audiodev none,id=muet -device AC97,audiodev=muet \
            -serial file:"$LOG" &
          PID=$!

          while kill -0 "$PID" 2>/dev/null; do
            if grep -aFq "HOST_SMOKE_OK canvas=1 worker=1 image=1" "$LOG"               && grep -aFq "BROWSER_HOST_M11_FRAME_PRESENTED" "$LOG"               && grep -aFq "M11_DOCUMENT_LOADED" "$LOG"; then
              break
            fi
            if (( SECONDS >= DEADLINE )); then break; fi
            sleep 0.5
          done

          kill -TERM "$PID" 2>/dev/null || true
          sleep 1
          kill -KILL "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          cat "$LOG"

      - name: Verdict
        run: |
          set -e
          grep -aF "[ladybird-bouchaud] BROWSER_HOST_START" serie-browser-host.log
          grep -aF "[ladybird-bouchaud] BROWSER_HOST_INITIALIZED" serie-browser-host.log
          grep -aF "[ladybird-bouchaud] IMAGE_DECODER_MODE browser-host-upstream" serie-browser-host.log
          grep -aF "[ladybird-bouchaud] BROWSER_HOST_M11_SPARE_DISABLED reason=shared-gui-stream" serie-browser-host.log
          test "$(grep -aFc "[ladybird-bouchaud] WEBCONTENT_READY" serie-browser-host.log)" -eq 1
          test "$(grep -aFc "[ladybird-bouchaud] M11_CHROME " serie-browser-host.log)" -eq 1
          test "$(grep -aFc "[ladybird-bouchaud] BROWSER_HOST_M11_ATTACHED" serie-browser-host.log)" -eq 1
          grep -aF "[ladybird-bouchaud] M11_GUI_HANDSHAKE_OK" serie-browser-host.log
          grep -aF "[ladybird-bouchaud] BROWSER_HOST_M11_INPUT_ACK_LOCAL" serie-browser-host.log
          grep -aF "[ladybird-bouchaud] M11_DOCUMENT_LOADED" serie-browser-host.log
          grep -aF "[ladybird-bouchaud] BROWSER_HOST_M11_FRAME_PRESENTED" serie-browser-host.log
          grep -aF "site_isolation=disable" serie-browser-host.log
          grep -aF "HOST_CANVAS OK" serie-browser-host.log
          grep -aF "HOST_WORKER OK pong" serie-browser-host.log
          grep -aF "HOST_IMAGE OK 1x1" serie-browser-host.log
          grep -aF "HOST_SMOKE_OK canvas=1 worker=1 image=1" serie-browser-host.log
          grep -F "BROWSER_HOST_FIXTURE_OK path=/browser-host.html" fixture-browser-host.log
          grep -F "BROWSER_HOST_FIXTURE_IMAGE_OK path=/pixel.png" fixture-browser-host.log

          if grep -aFq "VERIFICATION FAILED:" serie-browser-host.log; then
            echo "VERIFY Ladybird detecte dans le runtime interactif" >&2
            grep -aF "VERIFICATION FAILED:" serie-browser-host.log >&2 || true
            exit 1
          fi
          if grep -aFq "IMAGE_DECODER_ABSENT" serie-browser-host.log; then
            echo "Ancien diagnostic ImageDecoder legacy encore actif" >&2
            exit 1
          fi
          if grep -aFq "M11_GUI_STREAM_DESYNC" serie-browser-host.log; then
            echo "Flux GUI M11 desynchronise : plusieurs lecteurs ou framing casse" >&2
            exit 1
          fi
          if grep -aFq "instruction illegale dans le programme utilisateur" serie-browser-host.log; then
            echo "Instruction illegale detectee dans le runtime" >&2
            exit 1
          fi

      - name: Journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-host-logs
          path: |
            serie-browser-host.log
            fixture-browser-host.log
          if-no-files-found: warn
