name: ladybird-browser-host (debug)

on:
  workflow_dispatch:
    inputs:
      ladybird_run_id:
        description: 'Run ID de ladybird-native-browser contenant artefact canonique'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ladybird-browser-host-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-host:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: QEMU + outils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 file
      - name: Cache Cargo noyau
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: browser-host-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            browser-host-cargo-${{ runner.os }}-
            cargo-${{ runner.os }}-
      - name: Construire seulement le noyau
        run: tools/ci/build_kernel.sh
      - name: Recuperer Ladybird deja construit
        uses: actions/download-artifact@v4
        with:
          name: bouchaud-ladybird-native-browser
          path: native-browser
          run-id: ${{ inputs.ladybird_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Executer le scenario BrowserHost
        run: tools/ci/run_ladybird_browser_host.sh target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin native-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-host-debug-logs
          path: |
            serie-browser-host.log
            fixture-browser-host.log
          if-no-files-found: warn
