name: ladybird-native-m6

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "tools/ladybird/**"
      - "docs/ladybird/**"
      - ".github/workflows/ladybird-native-m6.yml"
  pull_request:
    paths:
      - "tools/ladybird/**"
      - "docs/ladybird/**"
      - ".github/workflows/ladybird-native-m6.yml"

concurrency:
  group: ladybird-native-m6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: LibGfx-Skia-CPU
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Outils de construction
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 python3-dev perl \
            clang lld cmake ninja-build git curl zip unzip tar xz-utils file \
            autoconf autoconf-archive automake libtool nasm bison flex \
            libssl-dev libedit-dev

      - name: Cache M5 Ladybird
        uses: actions/cache@v4
        with:
          path: |
            third_party/ladybird
            third_party/deps-src
            third_party/deps-bouchaud
            third_party/icu-src
            third_party/icu-bouchaud
            third_party/build-rust-bouchaud
            third_party/build-ak-bouchaud
            third_party/build-libcore-bouchaud
            third_party/build-libunicode-bouchaud
            third_party/build-libcrypto-bouchaud
            third_party/build-libgc-bouchaud
            third_party/build-libjs-bouchaud
            third_party/build-libipc-bouchaud
            third_party/gen-bouchaud
          key: ladybird-m5-${{ runner.os }}-${{ hashFiles('tools/ladybird/build-*.sh', 'tools/ladybird/fetch.sh', 'tools/ladybird/ipc/**') }}

      - name: Cache dependances graphiques
        uses: actions/cache@v4
        with:
          path: |
            third_party/vcpkg-gfx
            third_party/vcpkg-gfx-installed
            third_party/vcpkg-gfx-manifest
            ~/.cache/vcpkg
          key: ladybird-gfx-vcpkg-${{ runner.os }}-${{ hashFiles('tools/ladybird/build-vcpkg-gfx.sh') }}

      - name: Cache LibGfx
        uses: actions/cache@v4
        with:
          path: |
            third_party/build-rust-gfx-bouchaud
            third_party/build-libcompress-bouchaud
            third_party/build-libgfx-bouchaud
          key: ladybird-libgfx-${{ runner.os }}-${{ hashFiles('tools/ladybird/build-rust-gfx.sh', 'tools/ladybird/build-libcompress.sh', 'tools/ladybird/build-libgfx.sh', 'tools/ladybird/libgfx-probe.cpp') }}

      - name: Construire le port natif jusqu'a LibGfx
        run: tools/ladybird/native-m6.sh --cible

      - name: Verifier l'ELF produit
        run: |
          test -f third_party/build-libgfx-bouchaud/libGfx.a
          test -x third_party/build-libgfx-bouchaud/libgfx-probe
          file third_party/build-libgfx-bouchaud/libgfx-probe
          ls -lh third_party/build-libgfx-bouchaud/libGfx.a \
                 third_party/build-libgfx-bouchaud/libgfx-probe

      - name: Publier le probe M6
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-libgfx-m6
          path: |
            third_party/build-libgfx-bouchaud/libgfx-probe
          if-no-files-found: error
          retention-days: 14

  qemu:
    name: M6-ring3-QEMU
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Cache cargo noyau
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Construire le noyau
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo install bootimage --locked
          cargo bootimage

      - uses: actions/download-artifact@v4
        with:
          name: ladybird-libgfx-m6
          path: m6

      - name: Fabriquer le disque M6
        run: |
          set -e
          mkdir -p scenario/usr/libexec/ladybird
          cp m6/libgfx-probe scenario/usr/libexec/ladybird/libgfx-probe
          chmod 755 scenario/usr/libexec/ladybird/libgfx-probe

          cat > scenario/autorun <<'SCENARIO'
          uname
          df
          ifconfig
          exec /usr/libexec/ladybird/libgfx-probe
          SCENARIO

          (cd tools/userland && IMAGE="$GITHUB_WORKSPACE/ladybird-m6.img" \
             ./mkdisk.sh "$GITHUB_WORKSPACE/scenario")

      - name: Executer LibGfx en ring 3
        run: |
          set +e
          timeout 180 qemu-system-x86_64 \
            -drive format=raw,file=target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin \
            -drive format=raw,file=ladybird-m6.img \
            -m 2048 -display none -no-reboot \
            -netdev user,id=net0 -device e1000,netdev=net0 \
            -audiodev none,id=muet -device AC97,audiodev=muet \
            -serial file:serie-m6.log
          echo "qemu: code $?"
          cat serie-m6.log

      - name: Verdict M6
        run: |
          grep -F "== temoin LibGfx : Skia CPU ==" serie-m6.log
          grep -F "ok     Bitmap BGRA8888 320x200 cree par LibGfx" serie-m6.log
          grep -F "ok     PainterSkia CPU cree" serie-m6.log
          grep -F "ok     clear_rect a produit des pixels blancs" serie-m6.log
          grep -F "ok     fill_rect Skia a produit rouge, bleu et fond intact" serie-m6.log
          grep -F "RESULTAT : 0 verification(s) en echec (4 passees)" serie-m6.log

      - name: Journal M6
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-m6-serie
          path: serie-m6.log
          if-no-files-found: warn
