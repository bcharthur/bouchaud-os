name: Ladybird Vulkan experimental
on:
  push:
    branches: ['codex/p10-real-gpu-vulkan-20261119']
    paths:
      - '.github/workflows/ladybird-vulkan-experimental.yml'
      - 'third_party/UPSTREAM.md'
      - 'tools/ladybird/**'

permissions:
  contents: read

concurrency:
  group: ladybird-vulkan-experimental-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BOUCHAUD_P10_GPU_VULKAN: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Installer la chaîne de compilation
        run: |
          tools/ci/apt-installe.sh \
            build-essential pkg-config python3 python3-dev python3-venv perl \
            clang lld ccache cmake ninja-build rsync git curl wget gnupg lsb-release zip unzip tar xz-utils file \
            autoconf autoconf-archive automake libtool libltdl-dev gettext m4 \
            nasm bison flex libssl-dev libedit-dev linux-libc-dev mesa-common-dev ca-certificates
          if ! command -v clang-20 >/dev/null 2>&1; then
            codename=$(lsb_release -sc)
            wget -qO /tmp/llvm-snapshot-p10.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
            sudo gpg --dearmor -o /usr/share/keyrings/llvm-snapshot-p10.gpg.gpg /tmp/llvm-snapshot-p10.gpg.key
            echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot-p10.gpg.gpg] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-20 main" \
              | sudo tee /etc/apt/sources.list.d/llvm-p10.list
            tools/ci/apt-installe.sh clang-20 lld-20 llvm-20
          fi

      - name: Construire le navigateur et son compositeur Vulkan
        run: |
          set -o pipefail
          bash tools/ladybird/native-browser-final.sh --cible 2>&1 | tee /tmp/ladybird-vulkan.log

      - name: Vérifier le lien Vulkan du compositeur
        run: |
          compositor=third_party/native-browser-bouchaud-vulkan/Compositor
          test -x "$compositor"
          readelf -dW "$compositor" > /tmp/ladybird-vulkan-dynamic.txt
          grep -F '[libvulkan.so.1]' /tmp/ladybird-vulkan-dynamic.txt

      - name: Publier la construction expérimentale
        uses: actions/upload-artifact@v4
        with:
          name: bouchaud-ladybird-vulkan-experimental
          path: third_party/native-browser-bouchaud-vulkan/
          if-no-files-found: error
          retention-days: 7

      - name: Conserver le diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-vulkan-build-log
          path: |
            /tmp/ladybird-vulkan.log
            /tmp/ladybird-vulkan-dynamic.txt
          if-no-files-found: ignore
          retention-days: 7
