name: Ladybird Vulkan experimental
on:
  push:
    branches:
      - codex/p10-real-gpu-vulkan-20261119
      - codex/ladybird-ci-qualification-20261120
      - codex/ladybird-ci-evidence-20261120
    paths:
      - '.github/workflows/ladybird-vulkan-experimental.yml'
      - 'third_party/UPSTREAM.md'
      - 'tools/ladybird/**'
      - 'tools/ci/apt-installe.sh'
      - 'tools/ci/ladybird_empreinte.py'
      - 'tools/ci/ladybird_vulkan_provenance.py'

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-24.04
    outputs:
      empreinte: ${{ steps.identite.outputs.empreinte }}
    steps:
      - uses: actions/checkout@v4
      - id: identite
        run: python3 tools/ci/ladybird_vulkan_provenance.py calcule

  build:
    needs: provenance
    concurrency:
      group: ladybird-vulkan-${{ needs.provenance.outputs.empreinte }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BOUCHAUD_P10_GPU_VULKAN: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Sélectionner un artefact Vulkan de provenance identique
        id: reutilisation
        env:
          DEPOT: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          EMPREINTE: ${{ needs.provenance.outputs.empreinte }}
        run: python3 tools/ci/ladybird_vulkan_provenance.py

      - uses: actions/download-artifact@v4
        if: steps.reutilisation.outputs.source_run != ''
        with:
          name: bouchaud-ladybird-vulkan-${{ needs.provenance.outputs.empreinte }}
          path: ${{ runner.temp }}/ladybird-vulkan-reuse
          run-id: ${{ steps.reutilisation.outputs.source_run }}
          github-token: ${{ github.token }}

      - name: Installer la chaîne de compilation
        if: steps.reutilisation.outputs.source_run == ''
        run: |
          tools/ci/apt-installe.sh \
            build-essential pkg-config python3 python3-dev python3-venv perl \
            clang lld ccache cmake ninja-build rsync git curl wget gnupg lsb-release zip unzip tar xz-utils file \
            autoconf autoconf-archive automake libtool libltdl-dev gettext m4 \
            nasm bison flex libssl-dev libedit-dev linux-libc-dev mesa-common-dev ca-certificates
          if ! command -v clang-20 >/dev/null 2>&1; then
            codename=$(lsb_release -sc)
            wget -qO /tmp/llvm-snapshot-p10.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
            sudo gpg --dearmor -o /usr/share/keyrings/llvm-snapshot-p10.gpg.gpg /tmp/llvm-snapshot-p10.gpg.key
            echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot-p10.gpg.gpg] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-20 main" \
              | sudo tee /etc/apt/sources.list.d/llvm-p10.list
            tools/ci/apt-installe.sh clang-20 lld-20 llvm-20
          fi

      - name: Construire le navigateur et son compositeur Vulkan
        if: steps.reutilisation.outputs.source_run == ''
        run: |
          set -o pipefail
          bash tools/ladybird/native-browser-final.sh --cible 2>&1 | tee /tmp/ladybird-vulkan.log

      - name: Restaurer les modes des fichiers Vulkan
        if: steps.reutilisation.outputs.source_run != ''
        run: |
          mkdir -p third_party/native-browser-bouchaud-vulkan
          (cd "$RUNNER_TEMP/ladybird-vulkan-reuse" && sha256sum -c browser.tar.sha256)
          tar -xf "$RUNNER_TEMP/ladybird-vulkan-reuse/browser.tar" -C third_party/native-browser-bouchaud-vulkan

      - name: Vérifier le lien Vulkan du compositeur
        run: |
          compositor=third_party/native-browser-bouchaud-vulkan/Compositor
          test -x "$compositor"
          readelf -dW "$compositor" > /tmp/ladybird-vulkan-dynamic.txt
          grep -F '[libvulkan.so.1]' /tmp/ladybird-vulkan-dynamic.txt

      - name: Publier la construction expérimentale
        uses: actions/upload-artifact@v4
        with:
          name: bouchaud-ladybird-vulkan-experimental
          path: third_party/native-browser-bouchaud-vulkan/
          if-no-files-found: error
          retention-days: 7

      - name: Empaqueter l'artefact canonique Vulkan
        if: steps.reutilisation.outputs.source_run == ''
        run: |
          tar -C third_party/native-browser-bouchaud-vulkan -cf "$RUNNER_TEMP/browser.tar" .
          (cd "$RUNNER_TEMP" && sha256sum browser.tar > browser.tar.sha256)

      - name: Publier l'artefact Vulkan par empreinte
        if: steps.reutilisation.outputs.source_run == ''
        uses: actions/upload-artifact@v4
        with:
          name: bouchaud-ladybird-vulkan-${{ needs.provenance.outputs.empreinte }}
          path: |
            ${{ runner.temp }}/browser.tar
            ${{ runner.temp }}/browser.tar.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Conserver le diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-vulkan-build-log
          path: |
            /tmp/ladybird-vulkan.log
            /tmp/ladybird-vulkan-dynamic.txt
          if-no-files-found: ignore
          retention-days: 7
