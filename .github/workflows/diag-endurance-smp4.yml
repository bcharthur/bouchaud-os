name: Diagnostic apparié endurance SMP4
on:
  push:
    branches: [codex/diag-endurance-smp4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      MAIN_SHA: bbce0e7b3ad44e3177174766ef0dcb1e180cd8f8
      CANDIDATE_SHA: eb8ac15cf7f1e73fdc20ecb612e7a267a5400462
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAIN_SHA }}
          path: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Préparer QEMU et les outils Ubuntu signés
        run: |
          set -euo pipefail
          source_list=/etc/apt/sources.list.d/ubuntu.sources
          test -s "$source_list"
          opts=(-o "Dir::Etc::sourcelist=$source_list" -o Dir::Etc::sourceparts=-
                -o APT::Update::Error-Mode=any -o Acquire::Retries=3
                -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo timeout 300 apt-get "${opts[@]}" update
          sudo timeout 900 apt-get "${opts[@]}" install -y --no-install-recommends             qemu-system-x86 musl-tools build-essential file
      - name: Construire les deux BIOS et un scénario commun
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/diag-smp4"
          mkdir -p "$evidence"
          { qemu-system-x86_64 --version; uname -a; lscpu; } > "$evidence/host.txt"
          for arm in main candidate; do
            (
              cd "$arm"
              git rev-parse HEAD > "$evidence/$arm.sha"
              tools/ci/build_kernel.sh
            ) > "$evidence/$arm-build.log" 2>&1
            cp "$arm/target/x86_64-bouchaud_os/debug/bootimage-bouchaud-os.bin" "$evidence/$arm.bin"
          done
          (cd main && tools/ci/fabrique-scenario-endurance.sh "$evidence/scenario")
          (cd "$evidence" && sha256sum main.bin candidate.bin scenario/endurance.img > inputs.sha256)
      - name: Exécuter les cycles historiques en ordre ABBA
        working-directory: main
        env:
          PYTHONPATH: tools/ci/reliability
        run: |
          python3 -u - "$RUNNER_TEMP/diag-smp4" <<'PY'
          import json
          import sys
          from pathlib import Path

          from etat_cycle import ECHEC, OK, etat_du_cycle
          from qemu_matrix import qemu_binary, run_one

          root = Path(sys.argv[1])
          markers = (root / "scenario/marqueurs-endurance.txt").read_text().splitlines()
          states = []
          for block in range(16):
              qualified_failure = False
              for arm in ("main", "candidate", "candidate", "main"):
                  index = len(states) + 1
                  output = root / f"{index:03d}-{arm}"
                  result = run_one(
                      qemu_binary(), root / f"{arm}.bin", 4, 300, 4096, output,
                      markers, root / "scenario/endurance.img",
                  )
                  log = Path(result["log"]).read_text(errors="replace")
                  state, reason = etat_du_cycle(result, log, "ENDURANCE_ORDONNANCEUR_OK")
                  # Le disque commun reste attesté. Le clone de cycle n'est pas une preuve
                  # de scheduling et peut représenter plusieurs Gio sur cette campagne.
                  if result.get("disque"):
                      Path(result["disque"]).unlink(missing_ok=True)
                  (output / "verdict.json").write_text(json.dumps({
                      **result, "etat": state, "raison": reason, "disque_conserve": False,
                  }, indent=2) + "\n")
                  print(index, arm, state, reason)
                  states.append(state)
                  qualified_failure |= state == ECHEC and "VERDICT_SONDE : QUALIFIE_ECHEC" in log
              if qualified_failure:
                  print(f"Échec de la sonde dans le bloc apparié {block + 1}")
                  break
          raise SystemExit(0 if all(state == OK for state in states) else 1)
          PY
      - name: Conserver les traces et identités
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-endurance-smp4
          path: |
            ${{ runner.temp }}/diag-smp4/*.txt
            ${{ runner.temp }}/diag-smp4/*.log
            ${{ runner.temp }}/diag-smp4/*.sha
            ${{ runner.temp }}/diag-smp4/*.sha256
            ${{ runner.temp }}/diag-smp4/*/*.log
            ${{ runner.temp }}/diag-smp4/*/verdict.json
          if-no-files-found: error


  audit-archives:
    if: github.event_name == 'push'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Vérifier et analyser les 68 cycles archivés
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in 15197547942 15200346928; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$id.zip"
          done
          sha256sum -c <<'SUMS'
          843b5f63a255dfe1dec54f585e3ee28673082770fd8905d6a7c3716ef3fba08b  15197547942.zip
          89882393072e7c448a4595c2c1b0261af2ed1a829afb71f879ae301a77d33033  15200346928.zip
          SUMS
          python3 tools/ci/analyse_diag_smp4.py 15197547942.zip 15200346928.zip | tee diag-distributions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: diag-distributions-smp4
          path: |
            diag-observations.csv
            diag-distributions.txt
          if-no-files-found: error


  qualify-nightly:
    if: github.event_name == 'push'
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Déclencher le Nightly de la branche indépendante
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: b3fa8d41438cfa0959a9b437b70dc0d876642fe9
        run: |
          set -euo pipefail
          ref=codex/nightly-concurrency
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ref" --jq .object.sha)
          test "$actual" = "$EXPECTED_SHA"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?head_sha=$EXPECTED_SHA&event=workflow_dispatch" --jq .total_count)
          if [ "$existing" = 0 ]; then
            gh workflow run nightly.yml --repo "$GITHUB_REPOSITORY" --ref "$ref"
          fi
