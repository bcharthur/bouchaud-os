<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/usr/share/ladybird/fonts</dir>
  <dir>/usr/share/fonts</dir>
  <cachedir>/tmp/fontconfig</cachedir>

  <!-- V16: strong substitutions. PathFontProvider handles exact installed
       families; Skia/fontconfig handles missing CSS families. These rules
       prevent Google Sans/Roboto/SerenitySans from falling onto the old
       geometric bootstrap face when DejaVu is installed by Bouchaud. -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Google Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Google Sans Text</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Google Sans Display</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Product Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Roboto</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Helvetica</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Helvetica Neue</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Segoe UI</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Noto Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Open Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Inter</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>SerenitySans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Courier New</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Roboto Mono</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>

  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias><family>emoji</family><prefer><family>Noto Emoji</family></prefer></alias>

  <!-- Graisses intermediaires. Un bouton de Google demande
       font-weight: 500 ; DejaVu n'a que Book (80) et Bold (200). Sans
       rabattement, fontconfig peut ne rien trouver et rendre la main a la
       police par defaut : c'est ce qui laissait « Se connecter » et « Tout
       accepter » en lettres geometriques sur une page dont le corps de texte
       etait deja correct. La reecriture V16 avait perdu ces regles ; le
       garde-fou les a redemandees. -->
  <match target="pattern">
    <test name="weight" compare="more_eq"><int>80</int></test>
    <test name="weight" compare="less"><int>180</int></test>
    <edit name="weight" mode="assign"><int>80</int></edit>
  </match>
  <match target="pattern">
    <test name="weight" compare="more_eq"><int>180</int></test>
    <edit name="weight" mode="assign"><int>200</int></edit>
  </match>

  <match target="font">
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
