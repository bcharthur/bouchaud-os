<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">

<!--
  Configuration fontconfig de Bouchaud OS.

  ## Pourquoi ce fichier existe

  Au demarrage, WebContent imprimait :

      Fontconfig error: Cannot load default config file: No such file: (null)

  fontconfig cherche sa configuration dans `FONTCONFIG_FILE`, puis dans
  `$FONTCONFIG_PATH/fonts.conf`, puis dans le chemin fige a la compilation de
  la bibliotheque. Ce dernier designe l'arborescence de la machine Ubuntu qui a
  construit le paquet vcpkg, et n'existe evidemment pas sous Bouchaud.

  Faire taire l'avertissement n'aurait rien corrige : fontconfig sert reellement
  a deux choses dans le Ladybird epingle.

    1. `SkFontMgr_New_FontConfig` (LibGfx/Font/TypefaceSkia.cpp) — le
       gestionnaire de polices de Skia, donc **tout le repli** quand une page
       demande une famille que le fournisseur de chemins de Ladybird ne connait
       pas. Sans configuration, ce gestionnaire ne voit aucune police, et une
       page qui demande `Helvetica, Arial, sans-serif` n'obtient rien.

    2. `GlobalFontConfig::hinting_for_font` (LibGfx/Font/Font.cpp) — les
       options de hinting reellement appliquees a chaque glyphe rasterise.

  ## Ce qu'il declare, et pourquoi c'est la verite

  Le repertoire de polices est celui que Ladybird embarque lui-meme, a
  l'emplacement ou le portage le depose. Les alias generiques designent tous
  SerenitySans parce que c'est **la seule police de texte** de l'arbre epingle
  (`Base/res/fonts/` contient SerenitySans-Regular.ttf et NotoEmoji.ttf, rien
  d'autre). Ce n'est pas un raccourci : c'est la description exacte de ce que
  cette machine sait afficher. Le jour ou d'autres familles seront empaquetees,
  ces alias devront citer les vraies.

  Le cache va dans /tmp, seul emplacement inscriptible d'un systeme de fichiers
  reconstruit a chaque demarrage. Sans repertoire inscriptible, fontconfig
  reanalyse les fichiers de polices a chaque appel.
-->

<fontconfig>

  <dir>/usr/share/ladybird/fonts</dir>
  <!-- Les polices du systeme, deposees par le noyau
       (`kernel::sysroot::install_fonts`) : DejaVu Sans et DejaVu Sans Mono.
       L'arbre Ladybird epingle n'embarque qu'UNE police de texte, et c'est une
       police d'interface geometrique — d'ou l'aspect « cartoon » de tout le
       Web, et surtout un `monospace` rendu en PROPORTIONNEL, qui desaligne
       n'importe quel code affiche sur une page. -->
  <dir>/usr/share/fonts</dir>
  <cachedir>/tmp/fontconfig</cachedir>

  <!-- Les generiques designent d'abord une vraie police de texte. SerenitySans
       reste cite en second : si les polices systeme manquaient, la page
       s'afficherait comme avant plutot que pas du tout. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family><family>DejaVu Sans</family><family>SerenitySans</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>DejaVu Serif</family><family>DejaVu Sans</family><family>SerenitySans</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family><family>DejaVu Sans</family><family>SerenitySans</family></prefer>
  </alias>
  <alias>
    <family>cursive</family>
    <prefer><family>DejaVu Sans</family><family>DejaVu Sans</family><family>SerenitySans</family></prefer>
  </alias>
  <alias>
    <family>fantasy</family>
    <prefer><family>DejaVu Sans</family><family>DejaVu Sans</family><family>SerenitySans</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>DejaVu Sans</family><family>DejaVu Sans</family><family>SerenitySans</family></prefer>
  </alias>

  <!-- Les familles que les vrais sites citent en premier. Les rediriger vers
       ce qui existe est le travail meme de fontconfig ; les laisser sans
       reponse ferait tomber la page sur la police par defaut sans passer par
       la substitution, et perdrait au passage les metriques demandees. -->
  <alias><family>Helvetica</family><prefer><family>DejaVu Sans</family><family>DejaVu Sans</family><family>SerenitySans</family></prefer></alias>
  <alias><family>Helvetica Neue</family><prefer><family>DejaVu Sans</family><family>DejaVu Sans</family><family>SerenitySans</family></prefer></alias>
  <alias><family>Arial</family><prefer><family>DejaVu Sans</family><family>DejaVu Sans</family><family>SerenitySans</family></prefer></alias>
  <alias><family>Liberation Sans</family><prefer><family>DejaVu Sans</family><family>DejaVu Sans</family><family>SerenitySans</family></prefer></alias>
  <alias><family>Times New Roman</family><prefer><family>DejaVu Serif</family><family>DejaVu Sans</family><family>SerenitySans</family></prefer></alias>
  <alias><family>Georgia</family><prefer><family>DejaVu Serif</family><family>DejaVu Sans</family><family>SerenitySans</family></prefer></alias>
  <alias><family>Verdana</family><prefer><family>DejaVu Sans</family><family>DejaVu Sans</family><family>SerenitySans</family></prefer></alias>
  <alias><family>Segoe UI</family><prefer><family>DejaVu Sans</family><family>DejaVu Sans</family><family>SerenitySans</family></prefer></alias>
  <alias><family>Roboto</family><prefer><family>DejaVu Sans</family><family>DejaVu Sans</family><family>SerenitySans</family></prefer></alias>
  <alias><family>Courier New</family><prefer><family>DejaVu Sans Mono</family><family>DejaVu Sans</family><family>SerenitySans</family></prefer></alias>

  <!-- Emoji : la seule autre police de l'arbre epingle, et la seule qui puisse
       repondre a ces familles-la. -->
  <alias>
    <family>emoji</family>
    <prefer><family>Noto Emoji</family></prefer>
  </alias>
  <alias><family>Apple Color Emoji</family><prefer><family>Noto Emoji</family></prefer></alias>
  <alias><family>Segoe UI Emoji</family><prefer><family>Noto Emoji</family></prefer></alias>

  <!-- Bouchaud rasterise sur le processeur, sans sous-pixel : le hinting
       leger donne le meilleur compromis nettete/fidelite a cette echelle, et
       c'est exactement ce que `Font::hinting_options` viendra lire ici. -->
  <match target="font">
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>

</fontconfig>
