<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Fenetre modale</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; color: #0f172a;
         background: #fff; font-size: 15px; line-height: 1.5; }

  .fond { position: fixed; left: 0; top: 0; width: 100%; height: 100%;
          background: rgba(15, 23, 42, 0.55); }
  .modale { position: fixed; left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            width: 420px; background: #fff; border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); padding: 24px; }
  .modale h2 { margin: 0 0 10px; font-size: 20px; }
  .modale p { margin: 0 0 20px; color: #475569; font-size: 14px; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; }
  .actions button { padding: 8px 16px; border-radius: 6px; border: 1px solid #cbd5e1;
                    background: #fff; font-size: 14px; }
  .actions button.primaire { background: #2563eb; border-color: #2563eb; color: #fff; }
  .arriere { padding: 24px; }

</style></head><body>

<div class="arriere"><h1>Page derriere la modale</h1>
<p>Le fond assombri doit couvrir toute la fenetre, et la modale doit etre
centree par <code>transform: translate(-50%, -50%)</code> — la technique de
centrage la plus utilisee du Web.</p></div>
<div class="fond"></div>
<div class="modale">
  <h2>Confirmer la suppression</h2>
  <p>Cette action est definitive. Les elements selectionnes seront retires.</p>
  <div class="actions"><button>Annuler</button><button class="primaire">Supprimer</button></div>
</div>

</body></html>
