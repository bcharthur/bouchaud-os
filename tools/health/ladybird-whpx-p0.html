<!doctype html>
<meta charset="utf-8">
<title>Ladybird WHPX P0</title>
<style>
  body { margin: 0; font: 16px sans-serif; background: #eef2f6; }
  header { position: sticky; top: 0; background: #123452; color: white; padding: 12px; }
  article { box-sizing: border-box; height: 48px; margin: 4px 16px; padding: 8px;
            border: 2px solid #256e99; background: white; }
  article:nth-child(odd) { background: #cbe4f0; }
</style>
<header><button id="start" disabled>Lancer le défilement</button> <output id="status">Chargement</output></header>
<main id="rows"></main>
<script>
"use strict";
const options = new URLSearchParams(location.search);
const profileCallbacks = options.get("phases") === "1";
const scrollOnly = options.get("scroll-only") === "1";
const autoStart = options.get("auto-start") === "1";
const rows = document.getElementById("rows");
const start = document.getElementById("start");
const statusLine = document.getElementById("status");
const batch = document.createDocumentFragment();
for (let i = 0; i < 512; ++i) {
    const row = document.createElement("article");
    row.textContent = "Bouchaud OS — ligne " + (i + 1);
    batch.appendChild(row);
}
rows.appendChild(batch);
requestAnimationFrame(() => requestAnimationFrame(() => {
    statusLine.textContent = "Page prête";
    start.disabled = false;
    console.log("WHPX_P0_READY ms=" + performance.now().toFixed(2));
    if (autoStart)
        setTimeout(() => start.click(), 10000);
}));
start.addEventListener("click", () => {
    start.disabled = true;
    const click = performance.now();
    if (new URLSearchParams(location.search).get("phase-markers") === "1")
        console.log("WHPX_P0_BEGIN");
    const frames = [];
    let step = 0;
    let callbackTotalMs = 0;
    let callbackMaxMs = 0;
    function scroll(now) {
        if (step === 240) {
            // Aggregate the scene timings in one message after the animation.
            statusLine.textContent = "Terminé";
            console.log("WHPX_P0_SCROLL " + JSON.stringify({click, frames, end: now}));
            if (profileCallbacks)
                console.log("WHPX_P0_CALLBACK " + JSON.stringify({count: step, callbackTotalMs, callbackMaxMs, scrollOnly}));
            return;
        }
        const before = profileCallbacks ? performance.now() : 0;
        window.scrollTo(0, ++step * 52);
        if (!scrollOnly)
            statusLine.textContent = step + "/240";
        if (profileCallbacks) {
            const elapsed = performance.now() - before;
            callbackTotalMs += elapsed;
            callbackMaxMs = Math.max(callbackMaxMs, elapsed);
        }
        frames.push(now);
        requestAnimationFrame(scroll);
    }
    requestAnimationFrame(scroll);
}, {once: true});
</script>
